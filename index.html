/* Перевод данных в текущий формат. Возвращает [данные, был ли перевод формата]. */
function normalize(d){
  d=d?clone(d):{};
  const base=DEFAULT_DATA;
  const o={version:numOr(d.version,1),
    settings:Object.assign({},base.settings,d.settings||{}),
    scenarios:(d.scenarios&&d.scenarios.length)?d.scenarios:clone(base.scenarios),
    items:d.items||[], facts:d.facts||[], insurance:d.insurance||[], insFacts:d.insFacts||[], gifts:d.gifts||[],
    invGroups:d.invGroups||[], invPositions:d.invPositions||[], invFacts:d.invFacts||[], invContribs:d.invContribs||[], invWish:d.invWish||[],
    goal:Object.assign({name:'',target:0,date:'',start:''},d.goal||{}), goalFacts:d.goalFacts||[],
    habits:d.habits||[], habitLog:d.habitLog||[],
    tasks:d.tasks||[], goals:d.goals||[], goalSteps:d.goalSteps||[], books:d.books||[], notes:d.notes||[],
    foodLog:d.foodLog||[], waterLog:d.waterLog||[], weightLog:d.weightLog||[],
    exercises:d.exercises||[], routines:d.routines||[], workouts:d.workouts||[], trainActive:d.trainActive||null,
    projects:d.projects||[], fundSpend:d.fundSpend||[], payments:d.payments||[], payLog:d.payLog||[],
    noteFolders:d.noteFolders||[], recipes:d.recipes||[], pantry:d.pantry||[], movies:d.movies||[], trash:d.trash||[]};
  let migrated=false;
  if(o.version<2){
    migrated=true;
    // старые «Инвестиции» (одна строка = инструмент) → группы с позициями
    if(!o.invGroups.length&&Array.isArray(d.investments)){
      d.investments.forEach(v=>{ const g={id:uid(),name:v.name||'Инвестиции',kind:KINDS.includes(v.kind)?v.kind:'Другое'}; o.invGroups.push(g);
        if(numOr(v.amount,0)) o.invPositions.push({id:uid(),group:g.id,name:v.name,amount:v.amount,rate:v.rate,start:v.start||'',end:v.end||'',flow:false}); });
    }
    // «Акции + облигации на счёте» — не разовый доход, а вложения: переносим в инвестиции
    const k=o.items.findIndex(it=>/акции\s*\+\s*облигации/i.test(it.name||''));
    if(k>=0){ const it=o.items.splice(k,1)[0]; o.facts=o.facts.filter(f=>f.item!==it.id);
      let g=o.invGroups.find(x=>x.kind==='Акции'); if(!g){ g={id:uid(),name:'Акции',kind:'Акции'}; o.invGroups.push(g); }
      o.invPositions.push({id:uid(),group:g.id,name:it.name,amount:it.amount,rate:null,start:it.start||'',end:'',flow:false}); }
    o.version=2;
  }
  if(o.version<3){
    migrated=true;
    // одно поле «Вложено» → запись в списке пополнений
    o.invPositions.forEach(p=>{ const a=numOr(p.amount,0);
      if(a&&!o.invContribs.some(c=>c.pos===p.id)) o.invContribs.push({id:uid(),pos:p.id,date:p.start||dkey(TODAY()),amount:a,note:'перенесено из поля «Вложено»'});
      delete p.amount; });
    // ПДС из статей бюджета → долгосрочная позиция (пополнения уже учтены статьёй, поэтому без «движения денег»)
    const pds=o.items.find(it=>/^пдс/i.test(String(it.name||'').trim()));
    if(pds&&!o.invPositions.some(p=>/пдс/i.test(p.name||''))){
      let g=o.invGroups.find(x=>x.kind==='ПДС'); if(!g){ g={id:uid(),name:'ПДС',kind:'ПДС'}; o.invGroups.push(g); }
      o.invPositions.push({id:uid(),group:g.id,name:'ПДС',rate:null,start:pds.start||'',end:pds.end||'',flow:false,long:true,reinvest:true,
        contribAmount:numOr(pds.amount,null),contribPeriod:Math.round(numOr(pds.period,1))||1,coFin:null,value:null,valueDate:''});
    }
    o.version=3;
  }
  if(o.version<4){
    // тренировки: стартовая библиотека домашних упражнений и три программы
    if(!o.exercises.length) o.exercises=EX_SEED.map(([id,name,kind,muscle])=>({id,name,kind,muscle,note:''}));
    if(!o.routines.length) o.routines=ROUTINE_SEED.map(([id,name,rest,items])=>({id,name,items:items.map(([ex,sets,reps,weight,time])=>({ex,sets,reps,weight,time,rest}))}));
    o.version=4;
  }
  if(typeof o.settings.alloc==='string'){ try{ o.settings.alloc=JSON.parse(o.settings.alloc); }catch(e){ o.settings.alloc=null; } }
  if(o.version<5){
    migrated=true;
    // программа с гирей и упражнения к ней
    KB_EX.forEach(([id,name,kind,muscle])=>{ if(!o.exercises.some(e=>e.id===id)) o.exercises.push({id,name,kind,muscle,note:''}); });
    ROUTINE_SEED.filter(r=>r[0]==='rt_kb').forEach(([id,name,rest,items])=>{ if(!o.routines.some(r=>r.id===id)) o.routines.push({id,name,items:items.map(([ex,sets,reps,weight,time])=>({ex,sets,reps,weight,time,rest}))}); });
    // чей доход: доходы супруги — по названию; фонды 10 / 5 / 2,5 % — со следующего месяца
    o.items.forEach(it=>{ if(!it.owner) it.owner=/супруг/i.test(it.name||'')?'spouse':'me'; });
    if(!o.settings.alloc) o.settings.alloc=defaultAlloc();
    o.version=5;
  }
  if(o.version<6){
    migrated=true;
    // привычки «тренировка» и «чтение» по названию начинают отмечаться сами
    if(!o.habits.some(h=>h.link==='train')){ const h=o.habits.find(h=>/трениров|зарядк|спорт|фитнес|гир[яи]/i.test(h.name||'')); if(h){ h.link='train'; backfillTrain(o,h); } }
    if(!o.habits.some(h=>h.link==='books')){ const h=o.habits.find(h=>/чтени|читат|книг/i.test(h.name||'')); if(h) h.link='books'; }
    o.version=6;
  }
  if(o.version<7){
    // открытые повторяющиеся задачи со сроком на неподходящий день (суббота у «по будням») — на ближайший подходящий
    (o.tasks||[]).forEach(t=>{ if(!t.done&&t.due) t.due=alignDue(t.due,t.repeat,t.repeatDays); });
    // подкатегории факта из названия статьи: «Питомец (еда + лекарства)» → Еда, Лекарства
    (o.items||[]).forEach(it=>{ if(it.subs) return; const m=/\(([^)]*[+\/][^)]*)\)/.exec(it.name||''); if(!m) return;
      const subs=m[1].split(/[+\/]/).map(s=>s.trim()).filter(Boolean).map(s=>s[0].toUpperCase()+s.slice(1)); if(subs.length>1) it.subs=subs.join(', '); });
    o.version=7;
  }
  if(o.version<8){
    migrated=true;
    // категория «Фонды» — под биржевые фонды (TMOS, LQDT и т.п.)
    if(!o.invGroups.some(g=>g.kind==='Фонды')) o.invGroups.push({id:uid(),name:'Фонды',kind:'Фонды'});
    o.version=8;
  }
  if(o.version<9){
    migrated=true;
    // разделы заметок; идеи подарков — из текста «Идеи подарков» в список
    if(!o.noteFolders.length) o.noteFolders=[{id:uid(),name:'Книги'},{id:uid(),name:'Работа'}];
    o.gifts.forEach(g=>{ const have=jsonOr(g.ideas); if((!have||!have.length)&&String(g.note||'').trim()){
      g.ideas=String(g.note).split(/\n|;/).map(x=>x.replace(/^[\s•\-–—*]+/,'').trim()).filter(Boolean).map(text=>({id:uid(),text,done:false,doneAt:''})); g.note=''; } });
    o.version=9;
  }
  o.habits.forEach(h=>{ if(h.link==null) h.link=''; });
  o.gifts.forEach(g=>{ if(!g.id) g.id=uid(); g.remind=numOr(g.remind,3); if(g.note==null) g.note=''; if(g.byear===undefined) g.byear=null; });
  o.payments.forEach(p=>{ if(!p.id) p.id=uid(); p.remind=numOr(p.remind,3); p.toFact=!!p.toFact; if(!p.repeat) p.repeat='monthly'; if(p.until==null) p.until=''; if(p.item==null) p.item=''; if(!p.created) p.created=p.start||dkey(TODAY()); });
  o.payLog.forEach(l=>{ if(!l.id) l.id=uid(); l.fact=!!l.fact; });
  // отметки об оплате, съехавшие на 1–3 дня (прежний сдвиг дат при сохранении), — обратно на дату платежа
  o.payLog.forEach(l=>{ const p=o.payments.find(x=>x.id===l.pay), d=parseD(l.due); if(!p||!d) return;
    const near=payDates(p,dkey(addDays(d,-3)),dkey(addDays(d,3))); if(!near.length||near.includes(l.due)) return;
    const best=near.slice().sort((a,b)=>Math.abs(parseD(a)-d)-Math.abs(parseD(b)-d))[0];
    if(!o.payLog.some(x=>x!==l&&x.pay===l.pay&&x.due===best)){ l.due=best; migrated=true; } });
  o.items.forEach(it=>{ if(!it.owner) it.owner='me'; if(it.fund==null) it.fund=''; if(it.subs==null) it.subs=''; if(it.limit===undefined||it.limit==='') it.limit=null; });
  // фонды: вместо «чей доход» — у каждого фонда свои источники (src: ID доходов, пусто — все регулярные; once — и разовые)
  const AL0=o.settings.alloc;
  if(AL0&&Array.isArray(AL0.funds)) AL0.funds.forEach(f=>{ if(f.src!==undefined) return;
    const inc=o.items.filter(it=>it.type==='Доход'||it.type==='Разовый доход'), mine=inc.filter(it=>(it.owner||'me')==='me');
    f.src=(f.who==='all'||mine.length===inc.length)?[]:mine.map(it=>it.id); f.once=AL0.base==='all'; delete f.who; });
  o.facts.forEach(f=>{ if(f.tags==null) f.tags=''; });
  o.tasks.forEach(t=>{ if(t.project==null) t.project=''; if(t.time==null) t.time=''; if(!Array.isArray(t.checklist)) t.checklist=[]; if(t.repeatDays==null) t.repeatDays=''; if(t.deadline==null) t.deadline=''; t.times=Math.max(1,Math.min(12,Math.round(numOr(t.times,1)))); t.timesDone=Math.max(0,Math.min(t.times,Math.round(numOr(t.timesDone,0)))); });
  o.goals.forEach(g=>{ for(const k of ['specific','measure','achievable']) if(g[k]==null) g[k]=''; });
  o.habits.forEach(h=>{ if(!h.type) h.type='check'; });
  for(const list of [o.projects,o.fundSpend]) list.forEach(x=>{ if(!x.id) x.id=uid(); });
  o.projects.forEach(p=>{ if(p.parent==null) p.parent=''; });
  if(!Array.isArray(o.settings.people)) o.settings.people=[];
  o.insurance.forEach(x=>{ x.repeat=(x.repeat==null||x.repeat==='')?12:(+x.repeat||0); if(x.paid==null) x.paid=''; });
  for(const list of [o.items,o.insurance,o.invGroups,o.invPositions,o.invContribs,o.habits,o.tasks,o.goals,o.goalSteps,o.books,o.notes,o.foodLog,o.exercises,o.routines,o.workouts]) list.forEach(x=>{ if(!x.id) x.id=uid(); });
  for(const k of ['readGoal','kcalGoal','waterGoal']) if(o.settings[k]===undefined) o.settings[k]=null;
  if(typeof o.trainActive==='string'){ try{ o.trainActive=o.trainActive?JSON.parse(o.trainActive):null; }catch(e){ o.trainActive=null; } }
  o.tasks.forEach(t=>{ t.done=!!t.done; if(!t.repeat) t.repeat='none'; });
  o.goalSteps.forEach(s=>{ s.done=!!s.done; });
  o.notes.forEach(n=>{ n.pinned=!!n.pinned; });
  o.routines.forEach(r=>{ if(!Array.isArray(r.items)) r.items=[]; });
  o.workouts.forEach(w=>{ if(!Array.isArray(w.items)) w.items=[]; if(!Array.isArray(w.prs)) w.prs=[]; });
  o.invPositions.forEach(p=>{ p.flow=!!p.flow; p.long=!!p.long; p.reinvest=!!p.reinvest; delete p.amount;
    for(const k of ['rate','contribAmount','contribPeriod','coFin','value']) if(p[k]===undefined) p[k]=null;
    for(const k of ['start','end','valueDate','secid','board','market','divDate']) if(p[k]==null) p[k]='';
    if(p.divPs===undefined) p.divPs=null; p.q=jsonOr(p.q); p.pdsRatio=p.pdsRatio==null?'':String(p.pdsRatio); p.taxBack=!!p.taxBack; });
  o.invContribs.forEach(c=>{ if(c.qty===undefined) c.qty=null; if(c.price===undefined) c.price=null; });
  o.notes.forEach(n=>{ if(n.folder==null) n.folder=''; if(n.book==null) n.book=''; });
  o.noteFolders.forEach(f=>{ if(!f.id) f.id=uid(); if(f.name==null) f.name=''; });
  o.recipes.forEach(r=>{ if(!r.id) r.id=uid(); r.planned=!!r.planned; for(const k of ['name','servings','ingredients','steps','url','task','created']) r[k]=r[k]==null?'':String(r[k]); if(r.kcal===undefined) r.kcal=null; });
  o.pantry.forEach(x=>{ if(!x.id) x.id=uid(); x.have=!!x.have; if(x.name==null) x.name=''; x.qty=x.qty==null?'':String(x.qty); });
  o.tasks.forEach(t=>{ if(t.part==null) t.part=''; });
  o.movies.forEach(m=>{ if(!m.id) m.id=uid(); if(m.kind!=='series') m.kind='film'; if(!['want','watching','done'].includes(m.status)) m.status='want';
    for(const k of ['name','where','note','started','finished','created']) if(m[k]==null) m[k]=''; for(const k of ['season','episode','year','rating']) if(m[k]===undefined) m[k]=null; });
  o.gifts.forEach(g=>{ const v=jsonOr(g.ideas); g.ideas=Array.isArray(v)?v.filter(x=>x&&x.text).map(x=>({id:x.id||uid(),text:String(x.text),done:!!x.done,doneAt:x.doneAt||''})):[]; });
  o.invWish.forEach(w=>{ if(!w.id) w.id=uid(); w.lots=Math.max(1,Math.round(numOr(w.lots,1))); w.q=jsonOr(w.q);
    for(const k of ['secid','board','market','kind','note','name']) if(w[k]==null) w[k]=''; });
  const gids=new Set(o.invGroups.map(g=>g.id)), orphans=o.invPositions.filter(p=>!gids.has(p.group));
  if(orphans.length){ const g={id:uid(),name:'Без группы',kind:'Другое'}; o.invGroups.push(g); orphans.forEach(p=>p.group=g.id); }
  o.habits.forEach(h=>{ h.days=String(h.days||'1111111').padStart(7,'0').slice(-7); if(!h.created) h.created=dkey(TODAY()); });

  const tOld=dkey(addDays(TODAY(),-TRASH_DAYS));

  return [o,migrated];
}
function jsonOr(v){ if(typeof v==='string'){ try{ v=v?JSON.parse(v):null; }catch(e){ v=null; } } return (v&&typeof v==='object')?v:null; }
function setSync(kind,text){ const el=document.getElementById('sync'); el.className='sync '+kind; el.lastChild.textContent=text; el.title=text; el.setAttribute('aria-label',text); }

/* Сохранение: в таблицу уходят только изменившиеся разделы (persist('facts') и т.п.); persist() — всё. */
let saveTimer=null, saving=false, dirtyAll=false;
const dirtyKeys=new Set();
const isDirty=()=>dirtyAll||dirtyKeys.size>0;
function persist(...keys){
  if(!canSave){ setSync('err','Не сохранено: нет связи с таблицей'); return; }
  if(!keys.length) dirtyAll=true; else keys.forEach(k=>dirtyKeys.add(k));
  setSync('pending','Сохраняю…'); clearTimeout(saveTimer); saveTimer=setTimeout(flush,(IS_GAS||REMOTE)?1200:150);
  if(REMOTE){ clearTimeout(cacheT); cacheT=setTimeout(keepLocal,150); }
}
let cacheT=null, retryT=null, lastPull=0;
// копия на устройстве и список того, что ещё не ушло в таблицу
function keepLocal(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){}
  try{ if(isDirty()||saving) localStorage.setItem(PEND_KEY,JSON.stringify(dirtyAll||saving?{all:true}:{keys:[...dirtyKeys]})); else localStorage.removeItem(PEND_KEY); }catch(e){}
}
function payload(keys){
  // для читаемости таблицы: рядом с ID кладём название и посчитанную сумму
  const names=list=>{ const m={}; list.forEach(x=>m[x.id]=x.name); return m; };
  const items=names(S.items), ins=names(S.insurance), grp=names(S.invGroups), poss=names(S.invPositions), hab=names(S.habits);
  const p=clone(S);
  p.facts.forEach(f=>{ f.itemName=items[f.item]||''; f.sum=evalExpr(f.value); });
  p.insFacts.forEach(f=>{ f.insName=ins[f.ins]||''; f.sum=evalExpr(f.value); });
  p.invPositions.forEach(x=>{ x.groupName=grp[x.group]||''; });
  p.invFacts.forEach(f=>{ f.posName=poss[f.pos]||''; f.sum=evalExpr(f.value); });
  p.invContribs.forEach(c=>{ c.posName=poss[c.pos]||''; });
  p.goalFacts.forEach(f=>{ f.sum=evalExpr(f.value); });
  p.habitLog.forEach(f=>{ f.habitName=hab[f.habit]||''; });
  p.tasks.forEach(t=>{ t.projectName=t.project?projName(t.project):''; });
  p.notes.forEach(n=>{ n.text=noteText(n.body); n.folderName=(S.noteFolders.find(f=>f.id===n.folder)||{}).name||''; });
  p.payments.forEach(x=>{ x.itemName=items[x.item]||''; });
  const pays=names(S.payments); p.payLog.forEach(l=>{ l.payName=pays[l.pay]||''; });
  const exn=names(S.exercises);
  p.workouts.forEach(w=>{ w.summary=(w.items||[]).map(it=>(exn[it.ex]||it.exName||'')+' '+it.sets.length+'×').join('; '); });
  return JSON.stringify({keys,data:p});
}
function flush(){
  if(!IS_GAS&&!REMOTE){ try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); dirtyAll=false; dirtyKeys.clear(); setSync('ok','Сохранено в этом браузере'); }catch(e){ setSync('err','Браузер не дал сохранить'); } return; }
  if(REMOTE) keepLocal();
  if(saving){ saveTimer=setTimeout(flush,800); return; }
  if(!isDirty()) return;
  if(REMOTE&&navigator.onLine===false){ setSync('pending','Нет интернета — сохранено в телефоне'); return; }
  const keys=dirtyAll?null:[...dirtyKeys];
  dirtyAll=false; dirtyKeys.clear(); saving=true;
  const body=payload(keys);
  server('saveState',body).then(()=>{ saving=false; if(REMOTE) keepLocal(); if(!isDirty()) setSync('ok','Сохранено в Google Таблице'); },
    err=>{ saving=false; if(keys) keys.forEach(k=>dirtyKeys.add(k)); else dirtyAll=true;
      if(REMOTE){ keepLocal(); if(!gsNeedNotice(err)) setSync('pending','Нет связи с таблицей — сохранено в телефоне, отправлю позже');
        clearTimeout(retryT); retryT=setTimeout(()=>{ if(isDirty()) flush(); },30000); }
      else setSync('err','Ошибка сохранения: '+errText(err)); });
}
window.addEventListener('beforeunload',e=>{ if(REMOTE){ keepLocal(); return; } if(isDirty()||saving){ e.preventDefault(); e.returnValue=''; } });
window.addEventListener('online',()=>{ if(!REMOTE) return; if(isDirty()) flush(); else pullRemote(); });
document.addEventListener('visibilitychange',()=>{ if(!REMOTE) return; if(!document.hidden) gsAutoUntil=Date.now()+5000;
  if(document.hidden){ keepLocal(); if(isDirty()) flush(); }
  else if(isDirty()) flush(); else if(Date.now()-lastPull>120000) pullRemote(); });
/* Окошко из виджета (Android) копит задачи и заметки в телефоне. Забираем их в план,
   когда данные свежие (сразу после загрузки из таблицы), и только потом подтверждаем телефону.
   ID записи приходит из телефона — повторно одно и то же не добавится. */
const QUICK_FOLDER='Быстрые заметки';
function inboxItems(){ if(!NATIVE) return []; try{ const a=JSON.parse(NATIVE.inbox()||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function noteTitleFrom(text){
  const line=String(text).trim().split('\n')[0].trim(); if(line.length<=40) return line;
  const cut=line.slice(0,40), sp=cut.lastIndexOf(' ');
  return (sp>20?cut.slice(0,sp):cut).replace(/[\s,.;:!?—–-]+$/,'')+'…';
}
function applyInbox(){
  if(!S||!NATIVE||!canSave||!document.getElementById('sheet').hidden) return;
  const items=inboxItems(); if(!items.length) return;
  const keys=new Set(), seen=[], warns=[], isDay=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||''); let nt=0, nn=0, nd=0, nh=0, ne=0;
  items.forEach(it=>{ if(!it||!it.id) return; seen.push(it.id); const text=String(it.text||'').trim(); if(!text&&it.type!=='done'&&it.type!=='habit'&&it.type!=='expense') return;
    // привычка из виджета: состояние на день (не «переключить») — повтор ничего не ломает
    if(it.type==='habit'){ const h=S.habits.find(x=>x.id===it.habit); if(!h||!isDay(it.day)) return;
      const i=S.habitLog.findIndex(l=>l.habit===h.id&&l.date===it.day), v=numOr(it.value,null);
      if(h.type==='count'){ if(it.clear||v==null){ if(i<0) return; S.habitLog.splice(i,1); } else if(i>=0){ if(numOr(S.habitLog[i].value,null)===v) return; S.habitLog[i].value=v; } else S.habitLog.push({habit:h.id,date:it.day,value:v}); }
      else if(it.on){ if(i>=0) return; S.habitLog.push({habit:h.id,date:it.day}); }
      else { if(i<0) return; S.habitLog.splice(i,1); }
      keys.add('habitLog'); nh++; return; }
    if(it.type==='expense'){ const ex=S.items.find(x=>x.id===it.item), v=numOr(it.amount,null); if(!ex||!(v>0)) return;
      const month=isDay(it.day)?it.day.slice(0,7):todayK().slice(0,7); addFactTerm(ex.id,month,String(v),it.sub||''); keys.add('facts'); ne++; const w=limitWarn(ex,month); if(w) warns.push(w); return; }
    if(it.type==='note'){ if(S.notes.some(n=>n.id===it.id)) return;
      let f=S.noteFolders.find(x=>x.name===QUICK_FOLDER); if(!f){ f={id:uid(),name:QUICK_FOLDER}; S.noteFolders.push(f); keys.add('noteFolders'); }
      S.notes.push({id:it.id,name:noteTitleFrom(text),body:esc(text).replace(/\n/g,'<br>'),pinned:false,updated:new Date(+it.at||Date.now()).toISOString(),folder:f.id,book:''});
      keys.add('notes'); nn++; }
    else if(it.type==='done'){ const t=S.tasks.find(x=>x.id===it.task); if(!t||t.done) return;
      const n=t.times||1, k=it.k==null?n:Math.max(0,Math.min(n,+it.k));
      if(k<n){ if(k>(t.timesDone||0)){ t.timesDone=k; keys.add('tasks'); } return; }
      t.done=true; t.doneAt=isDay(it.day)?it.day:todayK(); t.timesDone=n;
      if(t.repeat&&t.repeat!=='none'){ const nx=nextDue(t.due,t.repeat,t.repeatDays); S.tasks.push(Object.assign({},t,{id:uid(),done:false,doneAt:'',timesDone:0,due:nx,deadline:nextDeadline(t,nx),created:todayK(),checklist:(t.checklist||[]).map(c=>({id:uid(),text:c.text,done:false}))})); }
      keys.add('tasks'); nd++; }
    else { if(S.tasks.some(t=>t.id===it.id)) return;
      const day=isDay(it.created)?it.created:todayK(), pt=parseTaskText(text,day), t=newTask(pt.name); t.id=it.id;
      t.due=pt.due||(isDay(it.due)?it.due:(pt.time?day:'')); t.time=pt.time; t.created=day; t.project=it.project&&projById(it.project)?it.project:'';
      S.tasks.push(t); keys.add('tasks'); nt++; } });
  if(keys.size){ persist(...keys); if(REMOTE) keepLocal(); render(); }
  try{ NATIVE.ack(JSON.stringify(seen)); }catch(e){}
  if(nt||nn||nd||nh||ne) toast('Из виджета: '+[nt?nt+' '+plural(nt,'задача','задачи','задач'):'',nn?nn+' '+plural(nn,'заметка','заметки','заметок'):'',nd?'выполнено '+nd:'',nh?'привычки: '+nh:'',ne?ne+' '+plural(ne,'трата','траты','трат'):''].filter(Boolean).join(', ')+(warns.length?'. '+warns.join('. '):''));
}
// вернулись в приложение, а в окошке добавили что-то новое — сперва свежие данные, потом запись
document.addEventListener('visibilitychange',()=>{ if(document.hidden||!NATIVE||!inboxItems().length) return;
  if(REMOTE&&!isDirty()&&!saving){ if(Date.now()-lastPull<=120000) pullRemote(); } else applyInbox(); });
// ярлык «Трата» / «Привычки», когда приложение уже открыто
window.moyplanAction=()=>{ let a=null; try{ a=NATIVE&&NATIVE.takeAction(); }catch(e){} if(a&&S) launch(a); };

/* Android: уведомления. Расписание на 2 недели вперёд считает приложение при каждой правке и отдаёт телефону;
   телефон показывает их сам, даже если приложение закрыто. Настройки — на этом устройстве. */
const NOTIF_KEY='moyplan.notif.v1';
const NOTIF_DEF={on:true,pay:true,bd:true,task:true,free:true,digest:true,digestAt:'09:00',habit:true,habitAt:'21:00',week:true,weekAt:'19:00'};
function notifCfg(){ let c={}; try{ c=JSON.parse(localStorage.getItem(NOTIF_KEY)||'{}')||{}; }catch(e){} return Object.assign({},NOTIF_DEF,c); }
function notifPlan(){
  const c=notifCfg(), out=[]; if(!c.on||!S) return out;
  const now=Date.now(), t=TODAY(), H=14, yrs=n=>n+' '+plural(n,'год','года','лет'), dd=n=>n+' '+plural(n,'день','дня','дней');
  const at=(k,hm)=>{ const d=parseD(k), [h,m]=String(hm||'09:00').split(':').map(Number); return new Date(d.getFullYear(),d.getMonth(),d.getDate(),h||0,m||0).getTime(); };
  const push=(id,ts,title,text,action)=>{ if(ts>now&&ts<now+(H+1)*864e5) out.push({id,at:ts,title,text,action}); };
  if(c.pay) payOcc(todayK(),dkey(addDays(t,H+8))).forEach(o=>{ if(o.paid) return; const r=numOr(o.p.remind,3), amt=rub(numOr(o.p.amount,0));
    if(r>0) push('pay|'+o.p.id+'|'+o.due+'|r',at(dkey(addDays(parseD(o.due),-r)),'10:00'),'Платёж через '+dd(r)+': '+o.p.name,amt+' · '+dayLabel(o.due).toLowerCase(),'pay');
    push('pay|'+o.p.id+'|'+o.due,at(o.due,'10:00'),'Сегодня платёж: '+o.p.name,amt,'pay'); });
  if(c.bd) S.gifts.forEach(g=>{ const n=bdNext(g); if(!n) return; const k=dkey(n), r=numOr(g.remind,3), age=g.byear?n.getFullYear()-g.byear:0;
    if(r>0) push('bd|'+g.id+'|'+k+'|r',at(dkey(addDays(n,-r)),'10:00'),'Через '+dd(r)+' день рождения: '+g.name,dayLabel(k)+(age?' · '+yrs(age):''),'bdays');
    push('bd|'+g.id+'|'+k,at(k,'09:00'),'Сегодня день рождения: '+g.name,age?yrs(age):'Не забудьте поздравить','bdays'); });
  if(c.free&&C) freeList().forEach(x=>{ const nm=x.p.name||x.p.secid||'Позиция', k=x.d;
    if(x.kind==='offer'){ const st=x.from&&x.from>todayK()?x.from:dkey(addDays(parseD(k),-7));
      push('free|'+x.p.id+'|'+k+'|o',at(st,'10:00'),'Оферта по «'+nm+'» '+dRu(k).slice(0,5),'Можно вернуть до '+rub(x.amt)+' — если нужно, подайте заявку брокеру'+(x.to?' до '+dRu(x.to).slice(0,5):''),'invest'); return; }
    const what=x.kind==='end'?'закрытие':x.kind==='am'?'частичное погашение':'погашение';
    push('free|'+x.p.id+'|'+k+'|w',at(dkey(addDays(parseD(k),-7)),'10:00'),'Через неделю освободится '+rub(x.amt),nm+': '+what+' '+dRu(k).slice(0,5)+'. Подумайте, куда реинвестировать','invest');
    push('free|'+x.p.id+'|'+k,at(k,'10:00'),'Сегодня '+what+': '+nm,'Вернётся около '+rub(x.amt)+' — можно реинвестировать','invest'); });
  if(c.task) S.tasks.forEach(x=>{ if(!x.done&&x.due&&x.time) push('task|'+x.id+'|'+x.due+'|'+x.time,at(x.due,x.time),x.name,'Задача на '+x.time,'task'); });
  if(c.digest) for(let i=0;i<=H;i++){ const k=dkey(addDays(t,i)), l=S.tasks.filter(x=>!x.done&&x.due&&(i===0?x.due<=k:x.due===k));
    if(l.length) push('digest|'+k,at(k,c.digestAt),'На сегодня '+l.length+' '+plural(l.length,'задача','задачи','задач'),l.slice(0,4).map(x=>x.name).join(', ')+(l.length>4?'…':''),'task'); }
  if(c.habit) for(let i=0;i<=H;i++){ const d=addDays(t,i), k=dkey(d), l=S.habits.filter(h=>h.days[wd(d)]==='1'&&(h.created||'')<=k&&!(HL[h.id]&&HL[h.id].has(k)));
    if(l.length) push('habit|'+k,at(k,c.habitAt),'Не отмечены привычки',l.slice(0,4).map(h=>h.name).join(', ')+(l.length>4?'…':''),'habit'); }
  if(c.week) for(let i=0;i<=H;i++){ const d=addDays(t,i); if(wd(d)!==6) continue; const k=dkey(d);
    push('week|'+k,at(k,c.weekAt),'Итоги недели','Сколько сделано, как с привычками и что ждёт на следующей неделе','week'); }
  return out.sort((a,b)=>a.at-b.at).slice(0,200);
}
// после каждой отрисовки (с задержкой): уведомления, задачи для виджета, ссылка на таблицу для виджета
let nativeT=null;
function nativeSync(){ if(!NATIVE||!S) return; clearTimeout(nativeT); nativeT=setTimeout(()=>{ try{
  NATIVE.schedule(JSON.stringify(notifPlan()));
  const wk=dkey(addDays(TODAY(),7));
  NATIVE.setWidget(JSON.stringify({today:todayK(),tasks:S.tasks.filter(x=>!x.done&&(x.deadline||x.due&&x.due<=wk)).map(x=>({id:x.id,name:x.name,due:x.due,deadline:x.deadline||'',time:x.time||'',project:x.project||'',priority:+x.priority||0,times:x.times||1,timesDone:x.timesDone||0,repeat:x.repeat||'none'})),
    projects:S.projects.map(p=>({id:p.id,name:p.name,parent:p.parent||''})),
    habits:S.habits.map(h=>({id:h.id,name:(h.icon?h.icon+' ':'')+h.name,type:h.type==='count'?'count':'check',target:numOr(h.target,1),unit:h.unit||'',days:h.days||'1111111',created:h.created||''})),
    hday:todayK(),hlog:Object.fromEntries(S.habitLog.filter(l=>l.date===todayK()).map(l=>[l.habit,numOr(l.value,1)])),
    exp:expItems().map(it=>{ const L=limitOf(it,todayK().slice(0,7)); return {id:it.id,name:it.name,plan:numOr(it.amount,0),subs:itemSubs(it),limit:L?L.lim:0,spent:L?L.spent:0}; }),emonth:todayK().slice(0,7)}));
  NATIVE.setRemote(REMOTE?(REMOTE.g?'google':REMOTE.url):'',REMOTE&&!REMOTE.g?REMOTE.key:'');
}catch(e){} },800); }
function nativeBox(){
  if(!NATIVE) return ''; const c=notifCfg(), ck=(k,l)=>`<label class="chk"><input type="checkbox" data-ncfg="${k}" ${c[k]?'checked':''}><span>${l}</span></label>`;
  let lock=false, ver=''; try{ lock=!!NATIVE.lockOn(); ver=String(NATIVE.build()); }catch(e){}

    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${ck('digest','Утром — задачи на день, в')}<input type="time" data-ncfg="digestAt" value="${esc(c.digestAt)}" style="width:auto"></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${ck('habit','Вечером — неотмеченные привычки, в')}<input type="time" data-ncfg="habitAt" value="${esc(c.habitAt)}" style="width:auto"></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${ck('week','В воскресенье — итоги недели, в')}<input type="time" data-ncfg="weekAt" value="${esc(c.weekAt)}" style="width:auto"></div></div></div>
    <div class="field"><label>Защита</label><label class="chk"><input type="checkbox" id="lockOn" ${lock?'checked':''}><span>Вход по отпечатку пальца (или PIN телефона)</span></label></div>
    <div class="field"><label>Приложение</label><div class="actions" style="margin:0"><span class="hint" style="margin:0">Версия 1.${esc(ver)}</span><span class="sp"></span>${APK_NEW?`<button class="btn small primary" data-act="apkGet">Скачать 1.${APK_NEW.n}</button>`:'<button class="btn small" data-act="apkCheck">Проверить обновления</button>'}</div></div>`;
}
document.addEventListener('change',e=>{ const el=e.target; if(!NATIVE||!el.closest||!el.closest('#sheet')) return;
  if(el.dataset.ncfg){ const c=notifCfg(); c[el.dataset.ncfg]=el.type==='checkbox'?el.checked:el.value;
    try{ localStorage.setItem(NOTIF_KEY,JSON.stringify(c)); }catch(x){}
    if(el.type==='checkbox'&&el.checked) try{ NATIVE.askNotify(); }catch(x){}
    nativeSync(); }
  else if(el.id==='lockOn'){ let r='ok'; try{ r=NATIVE.setLock(el.checked)||'ok'; }catch(x){ r='Не получилось'; }
    if(r!=='ok'){ el.checked=!el.checked; toast(r); } else toast(el.checked?'Вход по отпечатку включён':'Вход по отпечатку выключен'); }
});

/* Android: вышла ли новая сборка. Выпуски — в открытом репозитории pep-app (тег apk-<номер сборки>).
   Проверяем при запуске и при возвращении в приложение, не чаще раза в час; пока не обновились —
   напоминаем каждый раз, а в Настройках висит кнопка «Скачать». */
const APK_API='https://api.github.com/repos/tromb17/pep-app/releases/latest';
let APK_NEW=null;
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkApk(); });
function checkApk(force){
  if(!NATIVE) return; let last=0; try{ last=+localStorage.getItem('moyplan.apkcheck')||0; }catch(e){}
  if(!force&&Date.now()-last<3600e3) return;
  fetch(APK_API,{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    const n=j?+((/^apk-(\d+)$/.exec(j.tag_name||'')||[])[1]||0):0, have=+NATIVE.build()||0, a=j&&(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
    if(n>have&&a){ APK_NEW={n,url:a.browser_download_url}; toast('Вышла новая версия приложения: 1.'+n,{label:'Скачать',fn:()=>NATIVE.openUrl(a.browser_download_url)}); return; }
    APK_NEW=null; try{ localStorage.setItem('moyplan.apkcheck',String(Date.now())); }catch(e){}
    if(force) toast(j?'У вас последняя версия':'Не удалось проверить — нет связи с GitHub');
  }).catch(()=>{ if(force) toast('Не удалось проверить — нет связи с GitHub'); });
}

/* Свежие данные из таблицы. Пока здесь есть неотправленные правки или открыто окно — своё не затираем. */
function pullRemote(){
  if(!REMOTE) return Promise.resolve();
  return server('loadState').then(json=>{
    lastPull=Date.now();
    if(isDirty()||saving){ applyInbox(); return; }
    if(S&&!document.getElementById('sheet').hidden){ setTimeout(pullRemote,5000); return; }
    let d=null; try{ d=json?JSON.parse(json):null; }catch(e){}
    canSave=true;
    if(d){ const [o,mig]=normalize(d), same=S&&JSON.stringify(o)===JSON.stringify(S); S=o; keepLocal();
      setSync('ok','Загружено из Google Таблицы'); if(!same) render(); if(mig) persist(); applyInbox(); }
    else { if(!S) S=normalize(DEFAULT_DATA)[0]; render(); persist(); toast('Таблица была пустой — отправил в неё данные с этого устройства'); }
  }, err=>{
    if(!S){ canSave=false; S=normalize(DEFAULT_DATA)[0]; render();
      setSync('err','Нет связи с таблицей — правки не сохранятся'); toast('Не удалось загрузить: '+errText(err)); }
    else { if(!gsNeedNotice(err)) setSync('pending','Нет связи с таблицей — работаю с копией в телефоне'); applyInbox(); }
  });
}

function boot(){
  document.getElementById('btnSettings').innerHTML=icon('gear');
  gsAutoUntil=Date.now()+8000;
  // вернулись с первого входа через Google: данные этого устройства → в найденную или новую таблицу
  if(GAUTH_RET&&GAUTH_RET.first&&!IS_GAS){
    if(GAUTH_RET.ok){ let d=null; try{ const s=localStorage.getItem(LS_KEY); d=s?JSON.parse(s):null; }catch(e){}
      S=normalize(d||DEFAULT_DATA)[0]; render();
      gsSetup().catch(e=>{ setSync('err','Вход не удался'); toast('Не удалось войти через Google: '+errText(e)); });
      return; }
    setTimeout(()=>toast(GAUTH_RET.err==='access_denied'?'Вход через Google отменён':'Вход через Google не удался: '+GAUTH_RET.err),500);
  }
  if(IS_GAS){
    setSync('pending','Загружаю из таблицы…');
    google.script.run
      .withSuccessHandler(json=>{ let d=null; try{ d=json?JSON.parse(json):null; }catch(e){}
        if(d){ const [o,mig]=normalize(d); S=o; setSync('ok','Загружено из Google Таблицы'); render(); if(mig){ persist(); toast('Данные переведены в новый формат'); } }
        else { S=normalize(DEFAULT_DATA)[0]; render(); persist(); toast('Таблица была пустой — начинаем с чистого листа'); } })
      .withFailureHandler(err=>{ canSave=false; S=normalize(DEFAULT_DATA)[0]; render();
        setSync('err','Нет связи с таблицей — правки не сохранятся'); toast('Не удалось загрузить: '+((err&&err.message)||err)); })
      .loadState();
  } else if(REMOTE){
    let d=null, pend=null; try{ const s=localStorage.getItem(LS_KEY); d=s?JSON.parse(s):null; pend=JSON.parse(localStorage.getItem(PEND_KEY)||'null'); }catch(e){}
    if(d){ S=normalize(d)[0]; render(); setSync('pending','Копия из телефона, сверяю с таблицей…'); } else setSync('pending','Загружаю из таблицы…');
    // в телефоне есть правки, не дошедшие до таблицы, — они новее: сначала отправляем их
    if(d&&pend){ if(pend.all) dirtyAll=true; else (pend.keys||[]).forEach(k=>dirtyKeys.add(k)); lastPull=Date.now(); flush(); }
    else pullRemote();
  } else {
    let d=null; try{ const s=localStorage.getItem(LS_KEY); d=s?JSON.parse(s):null; }catch(e){}
    const [o,mig]=normalize(d||DEFAULT_DATA); S=o; setSync('ok',d?'Данные из этого браузера':'Новый план'); render(); if(d&&mig) persist(); applyInbox();
    if(!d&&gOK()&&!welcomeSkipped()) showWelcome();
  }
}

/* Первый запуск: сразу предлагаем вход через Google — данные будут в своей таблице с самого начала.
   «Без входа» — данные только на устройстве; войти можно потом в настройках. */
const WELCOME_KEY='moyplan.welcome.v1';
function welcomeSkipped(){ try{ return !!localStorage.getItem(WELCOME_KEY); }catch(e){ return false; } }
function showWelcome(){
  const w=document.getElementById('welcome');
  w.innerHTML=`<div class="wbox"><img src="icons/icon-192.png" alt=""><h2>Мой план</h2>
    <p>Финансы, задачи, привычки, цели, питание и заметки — в одном месте.</p>
    <p>Войдите через Google: приложение создаст на вашем Google Диске свою таблицу «${GS_TITLE}», и данные будут на всех ваших устройствах. Таблицу видите только вы.</p>
    <button class="btn primary" data-act="welcomeLogin">Войти через Google</button>
    <button class="btn link" data-act="welcomeSkip">Продолжить без входа</button>
    <p class="hint" style="margin-top:6px">Без входа данные хранятся только на этом устройстве. Войти можно позже в настройках.</p></div>`;
  w.hidden=false;
}
function hideWelcome(){ const w=document.getElementById('welcome'); if(w){ w.hidden=true; w.innerHTML=''; } }

/* Ярлык на значке приложения: сразу открыть нужное окно */
function launch(a){
  const press=act=>{ const b=document.createElement('button'); b.hidden=true; b.dataset.act=act; $view.appendChild(b); b.click(); b.remove(); };
  UI.page=null; UI.detail=null;
  if(a==='task'){ UI.section='tasks'; UI.sub.tasks='today'; render(); const q=document.getElementById('qaTitle'); if(q){ q.scrollIntoView({block:'center'}); q.focus(); } }
  else if(a==='expense'){ UI.section='home'; render(); setTimeout(openQuickExp,0); }
  else if(a==='habit'){ UI.section='habits'; UI.hview='today'; render(); }
  else if(a==='note'){ UI.section='notes'; UI.noteFolder=''; render(); press('noteNew'); }

const $view=document.getElementById('view');
function selMonth(){ const ms=C.months; let m=UI.month??C.curM; if(m<ms[0]||m>ms[ms.length-1]) m=Math.max(ms[0],Math.min(ms[ms.length-1],C.curM)); UI.month=m; return m; }
function prepare(){
  C=compute(S);
  // HL — дни, когда привычка выполнена; HV — введённые количества (для привычек «сколько сделал»)
  HL={}; HV={}; const hb={}; S.habits.forEach(h=>{ HL[h.id]=new Set(); HV[h.id]=new Map(); hb[h.id]=h; });
  S.habitLog.forEach(l=>{ const h=hb[l.habit]; if(!h) return;
    if(h.type==='count'){ const v=numOr(l.value,0); HV[h.id].set(l.date,v); if(v>=habitTarget(h)) HL[h.id].add(l.date); }
    else HL[h.id].add(l.date); });
  const today=TODAY(); HS={}; S.habits.forEach(h=>HS[h.id]=habitStats(h,HL[h.id],today));
  for(const k in CH) delete CH[k];
}
function render(){
  if(LAUNCH){ const a=LAUNCH; LAUNCH=null; setTimeout(()=>launch(a),0); }

  afterRender();

}
function viewHtml(){

/* Мягкая перерисовка: поля ввода не трогаем, обновляем только блоки с data-live */

function avgCard(){
  const a=C.avg;
  if(!a.tracked.length) return `<section class="card"><h3>Средние траты к плану</h3><p class="hint">Появится, когда введёте факт хотя бы за один месяц.</p></section>`;

  const rows=a.rows.slice().sort((x,y)=>(y.fact-y.plan)-(x.fact-x.plan));

    return `<div class="avg"><div class="row-between"><span class="fname">${esc(r.it.name)}</span><span class="num"><b>${fmt(r.fact)}</b> <small>/ ${fmt(r.plan)}</small></span></div>
      <div class="bullet"><i class="${over?'over':''}" style="width:${(r.fact/max*100).toFixed(1)}%"></i>${Math.round(r.plan)?`<b style="left:${(r.plan/max*100).toFixed(1)}%"></b>`:''}</div>
      <div class="fsub">${diff}${r.entered<a.tracked.length?` · факт введён за ${r.entered} из ${a.tracked.length} мес.`:''}</div></div>`; };
  return `<section class="card"><h3>Средние траты к плану${QH}</h3><p class="hint qtip" hidden>В среднем за месяц: ${span}. Где факт за месяц не введён, берётся план. Разовые статьи не учитываются.</p>

    <div class="legend"><span><i style="--c:var(--pos-bar)"></i>в пределах плана</span><span><i style="--c:var(--neg-bar)"></i>больше плана</span><span><i class="tick" style="--c:var(--text)"></i>план</span></div>
    ${shown.map(line).join('')}
    ${rows.length>8?`<button class="more" data-act="avgAll">${UI.avgAll?'Свернуть':'Показать все ('+rows.length+')'}</button>`:''}</section>`;
}

// среднее по месяцам с введённым фактом (как в «Средних тратах»)
function avgOver(arr){ const tr=C.avg.tracked; return tr.length?tr.reduce((s,j)=>s+numOr(arr[j],0),0)/tr.length:null; }

  }
  if(hidden.length) html+=`<button class="more" data-act="showAll">Ещё ${hidden.length} стат. без плана в этом месяце — показать</button>`;

  html+=`<section class="card" style="margin-top:12px"><h3>Резервы и инвестиции${QH}</h3><p class="hint qtip" hidden>Вносятся на вкладках «Фонды» (резервы и подарки) и «Инвестиции».</p>

    <div class="ro"><span>Подарки</span><b class="num">${rub(B.gifts[j])}</b></div>

    ${Math.round(B.invIn[j])?`<div class="ro"><span>Вложения в инвестиции</span><b class="num">${rub(B.invIn[j])}</b></div>`:''}
    ${Math.round(B.invBack[j])?`<div class="ro"><span>Возврат вложений</span><b class="num">${rub(B.invBack[j])}</b></div>`:''}</div></section>`;
  return html;
}
function factSub(raw,plan,isInc,avg){
  let sub='план '+fmt(plan)+(avg!=null?' · в среднем '+fmt(avg):'');
  if(raw!==''){
    const v=evalExpr(raw);
    if(isNaN(v)) return sub+' · <span class="neg">не разобрал выражение</span>';
    if(/[+\-*/]/.test(raw.replace(/^-/,''))) sub+=' · факт '+fmt(v);
    const d=v-plan;
    if(Math.round(d)!==0&&plan!==0){ const good=isInc?d>0:d<0; sub+=` · <span class="${good?'pos':'neg'}">${d>0?'+':'−'}${fmt(Math.abs(d))}</span>`; }
  }
  return sub;
}
function factInput(attr,key,raw,plan,label){
  return `<div class="finput"><input class="num" data-${attr}="${esc(key)}" value="${esc(raw)}" placeholder="${fmt(plan)}" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-label="${esc(label)}">
    <button class="plus" data-act="plus" data-attr="${attr}" data-key="${esc(key)}" aria-label="Добавить сумму">+</button></div>`;
}
/* «715+600+1300» → [715,600,1300]; если в записи не только плюсы — null (покажем строкой) */
function factTerms(raw){
  const s=String(raw||'').replace(/\s+/g,'').replace(/,/g,'.').replace(/^=/,''); if(!s) return [];
  const parts=s.split('+'); if(parts.some(p=>!/^-?\d+(\.\d+)?$/.test(p))) return null;
  return parts.map(Number);
}
function factRow(r,j){
  const key=r.it.id+'|'+C.keys[j], f=S.facts.find(x=>x.item===r.it.id&&x.month===C.keys[j]), raw=f?f.value:'', v=evalExpr(raw), terms=factTerms(raw);
  const n=terms?terms.length:1;
  const L=limitOf(r.it,C.keys[j]);
  return `<div class="frow"><div class="fmain"><div class="fname">${esc(r.it.name)}${r.it.fund?' <span class="tag">из фонда</span>':''}</div>${L?`<div class="fsub num" data-live="lim-${key}">лимит ${fmt(L.lim)} · ${L.left>=0?'осталось '+fmt(L.left):'<span class="neg">превышен на '+fmt(-L.left)+'</span>'}${limitBar(L)}</div>`:''}<div class="fsub num" data-live="fs-${key}">${factSub(raw,r.plan[j],TYPE_CAT[r.it.type]==='inc',TYPE_CAT[r.it.type]==='exp'?((C.avg.rows.find(a=>a.it===r.it)||{}).fact??null):null)}</div>${(()=>{ const st=subTotals(f); return st.some(x=>x.name)?`<div class="fsub num">${st.sort((a,b)=>b.sum-a.sum).map(x=>esc(x.name||'прочее')+' '+fmt(x.sum)).join(' · ')}</div>`:''; })()}</div>
    <button class="factbtn ${raw?'has':''}" data-act="factOpen" data-key="${esc(key)}" aria-label="Факт: ${esc(r.it.name)}"><b class="num">${raw?(isNaN(v)?'ошибка':fmt(v)):'—'}</b><small>${raw?n+' '+plural(n,'запись','записи','записей'):'внести'}</small></button></div>`;
}
// подкатегории факта: у статьи — список названий, у записи факта — метки по порядку сумм («Еда|Лекарства|Еда»)
const itemSubs=it=>[...new Set(String(it&&it.subs||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean))];
function factTagList(f,n){ const a=String(f&&f.tags||'').split('|'), out=[]; for(let i=0;i<n;i++) out.push((a[i]||'').trim()); return out; }
function subTotals(f){ const t=factTerms(f&&f.value); if(!t||!t.length) return []; const tg=factTagList(f,t.length), m=new Map();
  t.forEach((v,i)=>{ const k=tg[i]||''; m.set(k,(m.get(k)||0)+v); }); return [...m].map(([name,sum])=>({name,sum})); }
function openFact(key){ UI.factKey=key; const [id]=key.split('|'), subs=itemSubs(S.items.find(x=>x.id===id)); if(!subs.includes(UI.factSub)) UI.factSub=subs[0]||''; UI.fsubAdd=false; drawFact(true); }

  const f=S.facts.find(x=>x.item===id&&x.month===month), raw=f?f.value:'', sum=evalExpr(raw)||0, terms=factTerms(raw), isInc=TYPE_CAT[it.type]==='inc';
  const over=!isInc&&plan>0&&sum>plan, pctv=plan>0?Math.min(1,sum/plan):0;
  const subs=itemSubs(it), tags=terms?factTagList(f,terms.length):[], used=[...new Set(tags.filter(Boolean))], chips=subs.concat(used.filter(x=>!subs.includes(x)));

function setFactRaw(val,tags){
  const [id,month]=UI.factKey.split('|'); setListFact(S.facts,'item',id,month,val);

/* ---- Лимиты по статьям и быстрая трата ---- */
// потрачено по статье за месяц (факт) и её лимит
function limitOf(it,month){ const lim=numOr(it&&it.limit,0); if(!(lim>0)) return null;
  const f=S.facts.find(x=>x.item===it.id&&x.month===month), v=f?evalExpr(f.value):0, spent=isNaN(v)?0:numOr(v,0);
  return {lim,spent,left:lim-spent,pct:spent/lim}; }
// предупреждение после траты: с 80% — сколько осталось, с 100% — на сколько превышен
function limitWarn(it,month){ const L=limitOf(it,month); if(!L||L.pct<0.8) return '';
  return L.pct>=1?'«'+it.name+'»: лимит превышен на '+rub(L.spent-L.lim)+' ('+fmt(L.spent)+' из '+fmt(L.lim)+')'
    :'«'+it.name+'»: потрачено '+fmt(L.spent)+' из '+fmt(L.lim)+' — осталось '+rub(L.left); }
function limitBar(L){ return `<div class="thermo lim"><i class="${L.pct>=1?'over':L.pct>=0.8?'warn':''}" style="width:${Math.min(100,L.pct*100).toFixed(1)}%"></i></div>`; }
// добавить сумму в факт статьи за месяц (с подкатегорией)
function addFactTerm(id,month,txt,sub){

  setListFact(S.facts,'item',id,month,raw?raw+'+'+txt:txt);
  const g=S.facts.find(x=>x.item===id&&x.month===month);
  if(g){ const n=(factTerms(g.value)||[]).length; g.tags=factTagList({tags:tg.join('|')},n).join('|').replace(/\|+$/,''); }
}

/* ---- Биржа: Московская биржа, открытые данные ISS (без ключа, задержка ~15 мин) ---- */
const MOEX='https://iss.moex.com/iss/';
const SEC_KIND={stock_shares:'Акции',stock_dr:'Акции',stock_bonds:'Облигации',stock_ppif:'Фонды',stock_etf:'Фонды'};
const RUBS=new Set(['SUR','RUB','RUR']);
const okD=v=>(/^\d{4}-\d\d-\d\d$/.test(String(v||''))&&!/^0000/.test(v))?String(v):'';
const issTbl=(j,k)=>{ const t=j&&j[k]; if(!t||!Array.isArray(t.columns)||!Array.isArray(t.data)) return []; return t.data.map(r=>{ const o={}; t.columns.forEach((c,i)=>{ o[c]=r[i]; }); return o; }); };
async function iss(path){
  try{ const r=await fetch(MOEX+path+(path.includes('?')?'&':'?')+'iss.meta=off',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  catch(e){
    // в Google-версии — запасной путь через сервер скрипта
    if(viaScript()) return JSON.parse(await server('moexGet',path));
    throw e; }
}
async function secSearch(q){
  const j=await iss('securities.json?q='+encodeURIComponent(q)+'&limit=100&is_trading=1&engine=stock&securities.columns=secid,shortname,name,isin,primary_boardid,group');
  const Q=q.toUpperCase(), hit=x=>(x.secid.toUpperCase()===Q||x.isin.toUpperCase()===Q)?1:0;
  return issTbl(j,'securities').filter(x=>SEC_KIND[x.group]&&x.primary_boardid&&x.secid)
    .map(x=>({secid:String(x.secid),name:x.shortname||x.secid,full:x.name||'',isin:x.isin||'',board:x.primary_boardid,market:x.group==='stock_bonds'?'bonds':'shares',kind:SEC_KIND[x.group]}))
    .sort((a,b)=>hit(b)-hit(a)).slice(0,15);
}
let fxRates=null;
async function loadFx(){
  if(fxRates&&Date.now()-fxRates.t<36e5) return fxRates.m;
  const j=await iss('statistics/engines/currency/markets/selt/rates.json'), m={};
  issTbl(j,'wap_rates').forEach(r=>{ const k=String(r.shortname||'').slice(0,3).toUpperCase(); if(k&&+r.price>0) m[k]=+r.price/(+r.nominal||1); });
  const c=issTbl(j,'cbrf')[0]||{}; if(!m.USD&&+c.CBRF_USD_LAST) m.USD=+c.CBRF_USD_LAST; if(!m.EUR&&+c.CBRF_EUR_LAST) m.EUR=+c.CBRF_EUR_LAST;
  fxRates={m,t:Date.now()}; return m;
}
// цены (и для облигаций — купоны) в записи x.q; цена в рублях за 1 шт., у облигации с НКД отдельно
async function applyQuotes(recs,withCoupons){
  const by={}; recs.forEach(x=>{ if(!x.secid||!x.board||!x.market) return; const k=x.market+'|'+x.board; (by[k]||(by[k]=[])).push(x); });
  const got={};
  for(const k in by){ const [mk,bd]=k.split('|'), ids=[...new Set(by[k].map(x=>x.secid))];
    for(let i=0;i<ids.length;i+=10){
      const cols=mk==='bonds'?'SECID,SHORTNAME,PREVPRICE,FACEVALUE,FACEUNIT,COUPONVALUE,NEXTCOUPON,ACCRUEDINT,MATDATE,OFFERDATE,LOTSIZE,CURRENCYID':'SECID,SHORTNAME,PREVPRICE,LOTSIZE,CURRENCYID';
      const j=await iss(`engines/stock/markets/${mk}/boards/${encodeURIComponent(bd)}/securities.json?securities=${ids.slice(i,i+10).map(encodeURIComponent).join(',')}&iss.only=securities,marketdata&securities.columns=${cols}&marketdata.columns=SECID,LAST,LCURRENTPRICE,MARKETPRICE,LASTTOPREVPRICE`);
      const md={}; issTbl(j,'marketdata').forEach(r=>{ md[r.SECID]=r; });
      issTbl(j,'securities').forEach(x=>{ got[k+'|'+x.SECID]={s:x,m:md[x.SECID]||{}}; }); } }
  const curOf=g=>String((g.s.FACEUNIT||g.s.CURRENCYID||'SUR')).toUpperCase();
  const fx=Object.values(got).some(g=>!RUBS.has(curOf(g)))?await loadFx().catch(()=>null):null;
  const now=new Date().toISOString(), today=todayK(); let n=0;
  for(const x of recs){ const g=got[x.market+'|'+x.board+'|'+x.secid]; if(!g) continue;
    const {s:sx,m}=g, cur=curOf(g), rate=RUBS.has(cur)?1:(fx&&fx[cur])||null;
    const raw=[m.LAST,m.LCURRENTPRICE,m.MARKETPRICE,sx.PREVPRICE].map(v=>numOr(v,null)).find(v=>v!=null&&v>0);
    if(raw==null||rate==null) continue;
    const bond=x.market==='bonds', face=numOr(sx.FACEVALUE,null); if(bond&&!face) continue;
    const q=Object.assign({},x.q||{},{raw,chg:numOr(m.LASTTOPREVPRICE,null),lot:Math.max(1,numOr(sx.LOTSIZE,1)),cur,fx:rate,t:now});
    if(bond){ const cv=numOr(sx.COUPONVALUE,null);
      Object.assign(q,{price:raw/100*face*rate,face,nkd:numOr(sx.ACCRUEDINT,0)*rate,cv:cv!=null?cv*rate:null,next:okD(sx.NEXTCOUPON),mat:okD(sx.MATDATE),offer:okD(sx.OFFERDATE)}); }
    else q.price=raw*rate;
    // раз в день: купоны, погашения частями (амортизация) и оферты
    if(bond&&withCoupons&&(!Array.isArray(q.cpn)||!Array.isArray(q.am)||q.ct!==today)){
      try{ const j=await iss(`statistics/engines/stock/markets/bonds/bondization/${encodeURIComponent(x.secid)}.json?iss.only=coupons,amortizations,offers&limit=100&from=${new Date().getFullYear()-1}-01-01&coupons.columns=coupondate,value_rub&amortizations.columns=amortdate,value_rub&offers.columns=offerdate,offerdatestart,offerdateend`);
        q.cpn=issTbl(j,'coupons').filter(c=>okD(c.coupondate)).map(c=>[c.coupondate,+c.value_rub>0?Math.round(c.value_rub*100)/100:null]);
        q.am=issTbl(j,'amortizations').filter(c=>okD(c.amortdate)).map(c=>[c.amortdate,+c.value_rub>0?Math.round(c.value_rub*100)/100:null]);
        q.of=issTbl(j,'offers').filter(c=>okD(c.offerdate)).map(c=>[c.offerdate,okD(c.offerdatestart),okD(c.offerdateend)]); q.ct=today; }catch(e){} }
    x.q=q; n++; }
  return n;
}
let qBusy=false, qErr='', qTried=0;
const quoteAge=x=>x&&x.q&&x.q.t?Date.now()-Date.parse(x.q.t):Infinity;
async function refreshQuotes(force){
  if(qBusy||!S) return;
  const P=S.invPositions.filter(p=>p.secid), W=S.invWish.filter(w=>w.secid), all=P.concat(W); if(!all.length) return;
  if(!force&&(Date.now()-qTried<5*60e3||all.every(x=>quoteAge(x)<15*60e3))) return;
  qBusy=true; qErr=''; qTried=Date.now(); qUpd();
  try{ const n=await applyQuotes(all,true);
    if(n) persist(...(P.length?['invPositions']:[]),...(W.length?['invWish']:[]));
    if(n<all.length) qErr=n?'Не по всем бумагам пришла цена':'Биржа не прислала цены — показаны сохранённые'; }
  catch(e){ qErr='Биржа не отвечает — показаны последние сохранённые цены'; }
  qBusy=false; if(force) toast(qErr||'Цены обновлены');
  if(UI.section!=='fin') return;
  const ae=document.activeElement, typing=ae&&$view.contains(ae)&&(/INPUT|TEXTAREA|SELECT/.test(ae.tagName)||ae.isContentEditable);
  if(typing||!document.getElementById('sheet').hidden) softRender(); else render();
}
function qUpd(){ const el=$view.querySelector('[data-live="qbar"]'); if(!el) return; const t=document.createElement('div'); t.innerHTML=qBar(); if(t.firstElementChild) el.innerHTML=t.firstElementChild.innerHTML; }
const NF2=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}), NF4=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:4});
const fmtP=v=>(v==null||isNaN(v))?'—':(Math.abs(v)<10?NF4:NF2).format(v).replace(/^-/,'−')+' ₽';
const fmtQ=v=>NF2.format(numOr(v,0));
const pctD=v=>(v*100).toFixed(1).replace('.',',')+'%';
const chgHtml=c=>c==null?'':`<span class="chg ${c>0?'pos':c<0?'neg':''}">${c>0?'+':c<0?'−':''}${NF2.format(Math.abs(c))}%</span>`;
const priceIn=v=>v==null?'':String(Math.round(v*(Math.abs(v)<10?1e4:100))/(Math.abs(v)<10?1e4:100)).replace('.',',');
function qWhen(ms){ const d=new Date(ms), hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return dkey(d)===todayK()?'обновлено в '+hm:'обновлено '+dRu(dkey(d)).slice(0,5)+' в '+hm; }
function qBar(){
  const all=S.invPositions.filter(p=>p.secid).concat(S.invWish.filter(w=>w.secid)); if(!all.length) return '';
  const ts=all.filter(x=>x.q&&x.q.t).map(x=>Date.parse(x.q.t)), last=ts.length?Math.max(...ts):null;
  const txt=qBusy?'Обновляю цены с биржи…':qErr?qErr:last?'Цены Мосбиржи · '+qWhen(last)+' · задержка до 15 мин':'Цены ещё не загружены';
  return `<div class="qbar" data-live="qbar"><span class="${qErr&&!qBusy?'neg':''}">${esc(txt)}</span><button class="btn small" data-act="qRefresh" ${qBusy?'disabled':''}>Обновить</button></div>`;
}
// цена: «296,11» — рубли; у облигации можно «98,5%» — процент от номинала
function parsePrice(txt,q){ const t=String(txt||'').trim(); if(!t) return null; const isPct=/%\s*$/.test(t), v=evalExpr(t.replace(/%\s*$/,''));

          cur:String(s.FACEUNIT||'SUR').toUpperCase(),lvl:numOr(s.LISTLEVEL,3),st:String(s.SECTYPE||''),float:/плавающ/i.test(type),amort:/Амортиз/i.test(type),put:/оферт/i.test(sub),ytm,val:numOr(m.VALTODAY,0)}); }); }

function bondFilter(){ const f=UI.bf, y0=numOr(evalExpr(f.ymin),null), y1=numOr(evalExpr(f.ymax),null), q=pkey(f.q);
  const yrs=x=>daysTo(bondEnd(x))/365.25;
  let l=BL.list.filter(x=>{
    if(f.rel==='gov'&&!bondGov(x)) return false;
    if(f.rel==='l1'&&!bondGov(x)&&x.lvl>1) return false;
    if(f.rel==='l2'&&!bondGov(x)&&x.lvl>2) return false;
    if(f.rub&&x.cur!=='SUR') return false;
    if(f.cpn==='fix'&&x.float) return false; if(f.cpn==='float'&&!x.float) return false;
    if(y0!=null&&x.ytm<y0) return false; if(y1!=null&&x.ytm>y1) return false;
    const t=yrs(x); if(f.term==='1'&&t>1) return false; if(f.term==='3'&&(t<=1||t>3)) return false; if(f.term==='5'&&(t<=3||t>5)) return false; if(f.term==='5+'&&t<=5) return false;

    persist('invWish'); closeSheet(); UI.sec=null; render(); toast(w?'Добавлено к «'+w.name+'»':'Добавлено в «Хочу купить»'); return; }
  const qty=evalExpr(v('saQty')), price=parsePrice(v('saPrice'),r.q), date=v('saDate')||todayK();
  if(qty==null||isNaN(qty)||qty<=0){ toast(s.fromWish?'Сколько штук купили?':'Сколько штук у вас есть?'); return; }
  if(price==null||isNaN(price)||price<=0){ toast(isNaN(price)?'Цена — число, например 296,5 или 98,5%':'Укажите цену покупки'); return; }
  const keys=['invPositions','invContribs']; let p=S.invPositions.find(x=>x.secid===r.secid), isNew=false;
  if(!p){ let gid=v('saGroup'); if(gid==='__new'||!gid){ const g={id:uid(),name:r.kind,kind:r.kind}; S.invGroups.push(g); gid=g.id; keys.push('invGroups'); }
    p=Object.assign(FORMS.invPos.blank(),{group:gid,name:r.name,start:date,long:!!(document.getElementById('saLong')||{}).checked,secid:r.secid,board:r.board,market:r.market,q:r.q});
    S.invPositions.push(p); isNew=true; }
  S.invContribs.push({id:uid(),pos:p.id,date,amount:r2(qty*price),qty,price:Math.round(price*1e4)/1e4,note:isNew&&!s.fromWish?'уже было':'покупка'});
  if(s.fromWish){ S.invWish=S.invWish.filter(w=>w.id!==s.fromWish); keys.push('invWish'); }
  persist(...keys); closeSheet(); UI.sec=null; UI.section='fin'; UI.tab='invest'; UI.detail={kind:'pos',id:p.id,back:'group'}; render(); window.scrollTo(0,0);
  toast((isNew?'Добавлено: ':'Покупка записана: ')+fmtQ(qty)+' шт. на '+rub(qty*price));
  if(p.market==='bonds'&&!(p.q&&Array.isArray(p.q.cpn))){ qTried=0; refreshQuotes(true); }
}

/* диверсификация: доли по видам или по позициям, по текущей стоимости */

/* Когда освободятся деньги: погашение облигаций (целиком или частями — амортизация) по графику биржи,
   окончание вкладов и других позиций с датой закрытия. Оферта — только если подать заявку, в суммы не входит. */
const FREE_KIND={mat:'погашение',am:'частичное погашение',offer:'оферта',end:'окончание'};
function freeList(){
  const today=todayK(), out=[];
  C.pos.forEach(r=>{ const p=r.p; if(r.closed) return;
    if(r.ex&&p.market==='bonds'){ const q=r.quote; if(!q||!(r.qty>0)) return; const fx=q.fx||1;
      const am=(Array.isArray(q.am)?q.am:[]).filter(a=>a[0]>=today);
      if(am.length) am.forEach(([d,v],i)=>{ const last=i===am.length-1, per=v!=null?v:(last&&q.face?q.face*fx:null); if(per!=null) out.push({d,p,amt:per*r.qty,kind:last?'mat':'am'}); });
      else if(q.mat&&q.mat>=today&&q.face) out.push({d:q.mat,p,amt:q.face*fx*r.qty,kind:'mat'});
      const ofs=Array.isArray(q.of)&&q.of.length?q.of:(q.offer?[[q.offer,'','']]:[]);
      ofs.forEach(([d,s,e])=>{ if(d>=today&&(!q.mat||d<q.mat)&&q.face) out.push({d,p,amt:q.face*fx*r.qty,kind:'offer',from:s||'',to:e||''}); }); }
    else if(!r.ex&&p.end&&p.end>=today){ const amt=r.proj?r.proj.vEnd:r.valueNow; if(amt>0) out.push({d:p.end,p,amt,kind:'end'}); } });
  return out.sort((a,b)=>a.d.localeCompare(b.d)||a.amt-b.amt);
}
/* Доходность облигации к погашению по текущей цене (с НКД): все будущие купоны и погашения номинала, годовая с реинвестированием.
   Раскладка: какая часть годовой доходности — от купонов, какая — от того, что цена дорастёт (или упадёт) до номинала. */
function bondYield(q,nowK){
  if(!q||!(q.price>0)||!Array.isArray(q.cpn)) return null; nowK=nowK||todayK();
  const fx=q.fx||1, nkd=q.nkd||0, cost=q.price+nkd, cf=[]; let red=0, cpn=0, est=false;
  const am=(Array.isArray(q.am)?q.am:[]).filter(a=>a[0]>nowK).sort((a,b)=>a[0].localeCompare(b[0]));
  if(am.length) am.forEach(([d,v],i)=>{ const x=v!=null?v:(i===am.length-1&&q.face?q.face*fx:null); if(x!=null){ cf.push([d,x]); red+=x; } });
  else if(q.mat&&q.mat>nowK&&q.face){ cf.push([q.mat,q.face*fx]); red=q.face*fx; }
  if(!cf.length) return null;
  const end=cf[cf.length-1][0];
  q.cpn.forEach(([d,v])=>{ if(d<=nowK||d>end) return; const x=v!=null?v:numOr(q.cv,0); if(v==null) est=true; if(x>0){ cf.push([d,x]); cpn+=x; } });
  const t0=parseD(nowK).getTime(), T=d=>(parseD(d).getTime()-t0)/(365*864e5), years=T(end);
  if(!(years>0.02)) return null;
  const npv=y=>cf.reduce((s,[d,x])=>s+x/Math.pow(1+y,T(d)),0)-cost;
  let lo=-0.9, hi=3; if(npv(lo)<0||npv(hi)>0) return null;
  for(let i=0;i<80;i++){ const mid=(lo+hi)/2; if(npv(mid)>0) lo=mid; else hi=mid; }
  const ytm=(lo+hi)/2, a=(cpn-nkd)/cost/years, b=(red-q.price)/cost/years, sAB=a+b;
  const yearCpn=q.cpn.filter(([d])=>d>nowK&&d<=dkey(addDays(parseD(nowK),365))).reduce((s,[,v])=>s+(v!=null?v:numOr(q.cv,0)),0);
  return {ytm,cpn:Math.abs(sAB)>1e-9?ytm*a/sAB:a,grow:Math.abs(sAB)>1e-9?ytm*b/sAB:b,years,end,est,curY:yearCpn/q.price};
}
const pctY=v=>(v*100).toFixed(1).replace('.',',').replace('-','−')+'%';
function ytmShort(q){ const y=bondYield(q); return y?'к погашению '+pctY(y.ytm):''; }
function ytmHtml(q){ const y=bondYield(q); if(!y) return '';
  return `<div class="ro"><span>Доходность к погашению</span><b class="num">${pctY(y.ytm)} годовых</b></div>
    <div class="ro"><span class="fsub">· от купонов</span><span class="num">${pctY(y.cpn)}</span></div>
    <div class="ro"><span class="fsub">· ${y.grow>=0?'рост цены до номинала':'цена выше номинала — потеря при погашении'}</span><span class="num ${y.grow<0?'neg':''}">${y.grow>=0?'+':''}${pctY(y.grow)}</span></div>
    <div class="ro"><span class="fsub">Текущая купонная доходность (купоны за год ÷ цена)</span><span class="num">${pctY(y.curY)}</span></div>
    <p class="hint" style="margin:4px 0 8px">Если купить сейчас по ${fmtP(q.price)} + НКД ${fmtP(q.nkd||0)} и держать до ${dRu(y.end)} (${durText(Math.max(1,Math.round(y.years*12)))}). До налога 13%, без комиссий.${y.est?' Будущие купоны ещё не объявлены — взяты по текущему.':''}</p>`; }
const freeWhen=d=>daysTo(d)<=0?'сегодня':payWhen(d);
function freeHtml(){
  const L=freeList(); if(!L.length) return '';
  const sumIn=n=>L.filter(x=>x.kind!=='offer'&&daysTo(x.d)<=n).reduce((s,x)=>s+x.amt,0), rows=UI.freeAll?L:L.slice(0,6);
  return `<section class="card" data-sect="free"><h3>Когда освободятся деньги</h3>
    <div class="kpis" style="margin:6px 0 10px">${kpi('За 30 дней',sumIn(30))}${kpi('За 3 месяца',sumIn(91))}${kpi('За год',sumIn(365))}</div>
    ${rows.map(x=>`<button class="list-row" data-act="posOpen" data-id="${x.p.id}"><div class="m"><div class="fname">${esc(x.p.name||x.p.secid||'Без названия')} <span class="tag">${FREE_KIND[x.kind]}</span></div>
      <div class="fsub">${dRu(x.d)} · ${freeWhen(x.d)}${x.kind==='offer'&&x.from?' · заявка '+dRu(x.from).slice(0,5)+'–'+dRu(x.to||x.d).slice(0,5):''}</div></div>
      <div class="a num">${x.kind==='offer'?'<span class="fsub">до </span>':''}${rub(x.amt)}</div></button>`).join('')}
    ${L.length>6?`<div class="actions" style="margin-top:6px"><button class="btn small" data-act="freeAll">${UI.freeAll?'Свернуть':'Показать все ('+L.length+')'}</button></div>`:''}
    <p class="hint" style="margin:8px 0 0">Облигации — по графику биржи: номинал × количество, частичные погашения — отдельно. Вклады и другие позиции — по дате закрытия. Оферта — деньги вернутся, только если подать заявку брокеру, в суммы не входит. За неделю и в день погашения придёт уведомление — чтобы вовремя реинвестировать.</p></section>`;
}

/* ---- Инвестиции ---- */
const tot=(list,k)=>list.reduce((s,r)=>s+(r.closed&&(k==='invested'||k==='valueNow')?0:r[k]),0);
function viewInvest(){

/* ======== Итоги недели: сделано, привычки, тренировки, деньги и что впереди ======== */
const WEEK_SEEN='moyplan.weekseen.v1';
function weekData(off){
  const T=TODAY(), tk=todayK(), mon=addDays(T,-wd(T)+7*off), sun=addDays(mon,6), a=dkey(mon), b=dkey(sun), end=b<tk?b:tk, inW=k=>k&&k>=a&&k<=b;
  const done=S.tasks.filter(t=>t.done&&inW(t.doneAt));
  // не сделано в срок: срок (или крайний срок) был на этой неделе, а к её концу (или к сегодня) задача не закрыта
  const missed=S.tasks.filter(t=>{ const k=t.deadline||t.due; return k&&k>=a&&k<end&&(!t.done||(t.doneAt||'')>k); });
  const added=S.tasks.filter(t=>inW(t.created)).length;
  // привычки: за неделю (у «пн, ср, пт» — сколько раз из плана)
  const idx=11+off, hab=off<-11?[]:S.habits.map(h=>{ const w=HS[h.id]&&HS[h.id].weeks[idx]; return w&&w.s?{h,s:w.s,c:w.c}:null; }).filter(Boolean);
  const hs=hab.reduce((x,r)=>x+r.s,0), hc=hab.reduce((x,r)=>x+r.c,0);
  const wo=S.workouts.filter(w=>inW(w.date)), woMin=Math.round(wo.reduce((x,w)=>x+numOr(w.duration,0),0)/60);
  const books=S.books.filter(x=>inW(x.finished)), movies=S.movies.filter(x=>inW(x.finished));
  const paid=S.payLog.filter(l=>inW(l.paidAt)), paidSum=paid.reduce((x,l)=>x+numOr(l.amount,0),0);
  const fs=S.fundSpend.filter(x=>inW(x.date)).reduce((x,f)=>x+numOr(f.amount,0),0);
  const wl=S.weightLog.filter(x=>inW(x.date)&&numOr(x.kg,null)!=null).sort((x,y)=>x.date.localeCompare(y.date));
  const food=S.foodLog.filter(x=>inW(x.date)), fdays=new Set(food.map(x=>x.date)).size, kcal=fdays?Math.round(food.reduce((x,f)=>x+numOr(f.kcal,0),0)/fdays):0;
  const goals=S.goals.filter(g=>inW(g.doneAt)), steps=S.goalSteps.filter(x=>x.done&&inW(x.doneAt)).length;
  // деньги — по месяцу, в котором кончается неделя (факт записывается за месяц, не по дням)
  const m=C&&C.months?C.months.indexOf(sun.getFullYear()*12+sun.getMonth()):-1;
  const over=m>=0?S.items.map(it=>({it,L:limitOf(it,dkey(sun).slice(0,7))})).filter(x=>x.L&&x.L.left<0):[];
  // следующая неделя
  const na=dkey(addDays(sun,1)), nb=dkey(addDays(sun,7)), inN=k=>k&&k>=na&&k<=nb;
  const next={tasks:S.tasks.filter(t=>!t.done&&(inN(t.due)||inN(t.deadline))),pays:payOcc(na,nb).filter(o=>!o.paid),bds:S.gifts.map(g=>{ const d=parseD(g.date), f=addDays(sun,1); if(!d) return {g,n:null}; let n=bdIn(f.getFullYear(),d); if(n<f) n=bdIn(f.getFullYear()+1,d); return {g,n}; }).filter(x=>x.n&&inN(dkey(x.n)))};
  return {off,mon,sun,a,b,cur:off===0,done,missed,added,hab,hs,hc,hpct:hs?hc/hs:null,wo,woMin,books,movies,paid,paidSum,fs,wl,kcal,fdays,goals,steps,m,over,next};
}
function weekLine(W){ const p=[]; if(W.done.length) p.push('сделано '+W.done.length); if(W.hpct!=null) p.push('привычки '+pct(W.hpct)); if(W.wo.length) p.push('тренировок '+W.wo.length); return p.length?p.join(' · '):'сколько сделано за неделю'; }
const wkTitle=W=>{ const a=W.mon, b=W.sun; return a.getMonth()===b.getMonth()?a.getDate()+'–'+b.getDate()+' '+MG[b.getMonth()]:a.getDate()+' '+MG[a.getMonth()]+' – '+b.getDate()+' '+MG[b.getMonth()]; };
function viewWeek(off){
  const W=weekData(off), row=(l,v)=>`<div class="wk-row"><span class="fname">${l}</span><span class="num">${v}</span></div>`;
  let h=`${pageBack('Ещё')}<div class="wk-nav"><button class="btn small" data-act="weekNav" data-d="-1" aria-label="Прошлая неделя">‹</button><b>${W.cur?'Эта неделя':off===-1?'Прошлая неделя':'Неделя'} · ${wkTitle(W)}</b><button class="btn small" data-act="weekNav" data-d="1" ${W.cur?'disabled':''} aria-label="Следующая неделя">›</button></div>`;
  h+=`<section class="card"><div class="wk-kpis"><div><b class="num">${W.done.length}</b><span>${plural(W.done.length,'задача сделана','задачи сделано','задач сделано')}</span></div>
    <div><b class="num">${W.hpct==null?'—':pct(W.hpct)}</b><span>привычки${W.hs?' · '+W.hc+' из '+W.hs:''}</span></div>
    <div><b class="num">${W.wo.length}</b><span>${plural(W.wo.length,'тренировка','тренировки','тренировок')}${W.woMin?' · '+W.woMin+' мин':''}</span></div></div>
    ${W.cur&&!W.done.length&&W.hpct==null&&!W.wo.length?'<p class="hint" style="margin:6px 0 0">Неделя только началась — итоги появятся по ходу.</p>':''}</section>`;
  // задачи

  if(W.missed.length) tl.push(row('<span class="neg">Не сделано в срок</span>',W.missed.length));
  const ml=W.missed.slice(0,5).map(t=>`<button class="soonrow" data-act="taskOpen" data-id="${t.id}"><span class="dot" style="--c:var(--neg)"></span><span class="m fname">${esc(t.name)}</span><span class="w">${dayLabel(t.deadline||t.due)}</span></button>`).join('');
  if(W.done.length||tl.length) h+=homeCard('tasks','Задачи',(W.done.length?`<p class="fsub" style="margin:0 0 4px">Сделано: ${W.done.slice(0,6).map(t=>esc(t.name)).join(', ')}${W.done.length>6?' и ещё '+(W.done.length-6):''}</p>`:'')+tl.join('')+ml);
  // привычки
  if(W.hab.length) h+=homeCard('habits','Привычки',W.hab.sort((x,y)=>y.c/y.s-x.c/x.s).map(r=>`<div class="wk-row"><span class="fname">${ico(r.h)}${esc(r.h.name)}</span><span class="num ${r.c>=r.s?'pos':r.c/r.s<0.5?'neg':''}">${r.c} из ${r.s}${r.c>=r.s?' ✓':''}</span></div>`).join(''));
  // тело и досуг
  const life=[]; if(W.wl.length) { const d=numOr(W.wl[W.wl.length-1].kg,0)-numOr(W.wl[0].kg,0); life.push(row('Вес',fmtN(W.wl[W.wl.length-1].kg)+' кг'+(W.wl.length>1&&Math.abs(d)>=0.05?' ('+(d>0?'+':'−')+fmtN(Math.abs(Math.round(d*10)/10))+')':''))); }
  if(W.fdays) life.push(row('Питание, в среднем в день',fmt(W.kcal)+' ккал'));
  if(W.books.length) life.push(row('Прочитано книг',W.books.map(x=>esc(x.name)).join(', ')));
  if(W.movies.length) life.push(row('Посмотрено',W.movies.map(x=>esc(x.name)).join(', ')));
  if(W.goals.length) life.push(row('Цели достигнуты',W.goals.map(x=>ico(x)+esc(x.name)).join(', ')));
  else if(W.steps) life.push(row('Шагов к целям',W.steps));
  if(life.length) h+=homeCard('train','Здоровье и досуг',life.join(''));
  // деньги
  const mon=[]; if(W.paid.length) mon.push(row('Оплачено платежей · '+W.paid.length,rub(W.paidSum)));
  if(W.fs) mon.push(row('Траты из фондов',rub(W.fs)));
  if(W.m>=0&&S.items.length) mon.push(row('Свободно в '+monthIn(C.months[W.m]),`<span class="${C.B.free[W.m]<0?'neg':'pos'}">${rub(C.B.free[W.m])}</span>`));
  W.over.forEach(({it,L})=>mon.push(row('<span class="neg">Лимит превышен: '+esc(it.name)+'</span>','+'+rub(-L.left))));
  if(mon.length) h+=homeCard('fin','Деньги',mon.join(''));
  // что впереди
  const N=W.next, nx=[];
  if(N.tasks.length) nx.push(row('Задач со сроком',N.tasks.length));
  N.pays.slice(0,5).forEach(o=>nx.push(row(esc(o.p.name)+' · '+dayLabel(o.due).toLowerCase(),rub(numOr(o.p.amount,0)))));
  N.bds.forEach(x=>nx.push(row('День рождения: '+esc(x.g.name),dayLabel(dkey(x.n)).toLowerCase())));
  if(nx.length) h+=homeCard('pay',W.cur?'На следующей неделе':'Неделя после',nx.join(''));
  return h;
}
// на главной: в воскресенье после обеда — итоги этой недели, в понедельник — прошлой (можно скрыть)
function weekHomeCard(){

  const W=weekData(d===6?0:-1); let seen=''; try{ seen=localStorage.getItem(WEEK_SEEN)||''; }catch(e){}

/* ======== Привычки, которые отмечаются сами ======== */
const HLINKS=[['','Нет — только вручную'],['train','Когда завершаю тренировку'],['books','Когда записываю прочитанные страницы']];
// amt(h) — сколько прибавить привычке «сколько сделал»; возвращает названия отмеченных привычек
function autoHabit(kind,date,amt){
  const names=[];
  S.habits.filter(h=>h.link===kind).forEach(h=>{
    const i=S.habitLog.findIndex(l=>l.habit===h.id&&l.date===date);
    if(h.type==='count'){ const a=amt(h); if(!(a>0)) return;
      if(i>=0) S.habitLog[i].value=numOr(S.habitLog[i].value,0)+a; else S.habitLog.push({habit:h.id,date,value:a}); }
    else if(i<0) S.habitLog.push({habit:h.id,date});
    else return;
    names.push(h.name); });
  if(names.length) persist('habitLog');
  return names;
}
const trainAmt=w=>h=>/мин/i.test(h.unit||'')?Math.max(1,Math.round(numOr(w.duration,0)/60)):1;
// прошлые тренировки — в привычку (только дни, где отметки ещё нет)
function backfillTrain(st,h){
  const by={}; (st.workouts||[]).forEach(w=>{ if(w.date) (by[w.date]||(by[w.date]=[])).push(w); });
  Object.keys(by).forEach(d=>{ if(st.habitLog.some(l=>l.habit===h.id&&l.date===d)) return;
    if(h.type==='count'){ const v=by[d].reduce((s,w)=>s+trainAmt(w)(h),0); if(v>0) st.habitLog.push({habit:h.id,date:d,value:v}); }
    else st.habitLog.push({habit:h.id,date:d}); });
}

/* ======== Задачи ======== */
const PRIOS=[['0','Без приоритета'],['1','Низкий'],['2','Средний'],['3','Высокий']];
// когда делать: порядок групп на «Сегодня»; задачи «несколько раз в день» без отметки — в «В течение дня»
const PARTS=[['morning','В первой половине дня'],['during','В течение дня'],['day','Днём'],['evening','Во второй половине дня']];
const PART_SHORT={morning:'1-я половина',during:'в течение дня',day:'днём',evening:'2-я половина'};
const tPart=t=>PARTS.some(x=>x[0]===t.part)?t.part:((t.times||1)>1?'during':'');
const REPEATS=[['none','Не повторять'],['daily','Каждый день'],['every2','Через день'],['weekdays','По будням'],['days','По дням недели'],['weekly','Каждую неделю'],['monthly','Каждый месяц']];
function nextDue(k,rep,days){
  let d=parseD(k||todayK());
  if(rep==='daily') d=addDays(d,1);
  else if(rep==='every2') d=addDays(d,2);
  else if(rep==='weekdays'){ do{ d=addDays(d,1); }while(wd(d)>4); }
  else if(rep==='days'){ const m=String(days||''); if(!m.includes('1')) d=addDays(d,1); else do{ d=addDays(d,1); }while(m[wd(d)]!=='1'); }
  else if(rep==='weekly') d=addDays(d,7);
  else if(rep==='monthly'){ const last=new Date(d.getFullYear(),d.getMonth()+2,0).getDate(); d=new Date(d.getFullYear(),d.getMonth()+1,Math.min(d.getDate(),last)); }
  return dkey(d);
}
// подходит ли день под повтор: «по будням» — пн–пт, «по дням недели» — отмеченные дни
function repOk(d,rep,days){ if(rep==='weekdays') return wd(d)<5; if(rep==='days'){ const m=String(days||''); return !m.includes('1')||m[wd(d)]==='1'; } return true; }
// срок на неподходящий день (суббота у задачи «по будням») сдвигается на ближайший подходящий
function alignDue(k,rep,days){ if(!k||!rep||rep==='none') return k; const d=parseD(k); return !d||repOk(d,rep,days)?k:nextDue(k,rep,days); }
function alignTask(t){ const was=t.due; t.due=alignDue(t.due,t.repeat,t.repeatDays); return was&&t.due!==was; }
const repeatText=t=>{ if(!t.repeat||t.repeat==='none') return ''; if(t.repeat==='days'){ const m=String(t.repeatDays||'').padEnd(7,'0'); return m.includes('1')?'по дням: '+daysText(m):'дни не выбраны'; } const r=REPEATS.find(x=>x[0]===t.repeat); return r?r[1].toLowerCase():''; };
// проекты: верхний уровень и подпроекты на один уровень вниз
const projById=id=>S.projects.find(p=>p.id===id);
const projName=id=>{ const p=projById(id); if(!p) return ''; const par=p.parent&&projById(p.parent); return par?par.name+' / '+p.name:p.name; };
const projTree=()=>S.projects.filter(p=>!p.parent||!projById(p.parent)).map(p=>({p,kids:S.projects.filter(c=>c.parent===p.id)}));
const projColor=id=>{ const p=projById(id); const root=p&&p.parent&&projById(p.parent)?p.parent:id; const i=projTree().findIndex(x=>x.p.id===root); return '--t'+((i<0?0:i)%7+1); };
const projOpts=()=>[['','Без проекта']].concat(projTree().flatMap(({p,kids})=>[[p.id,p.name]].concat(kids.map(k=>[k.id,'   — '+k.name]))));
const inInbox=t=>!t.project||!projById(t.project);

// Просрочено: крайний срок прошёл; без крайнего срока — дата выполнения прошла (со следующего дня).
// На сегодня: дата выполнения сегодня; с крайним сроком — каждый день от даты выполнения (или сразу) до крайнего срока.
const tOver=(t,tk)=>!t.done&&(t.deadline?t.deadline<tk:!!t.due&&t.due<tk);
const tToday=(t,tk)=>!t.done&&(t.deadline?t.deadline>=tk&&(!t.due||t.due<=tk):t.due===tk);
const tNow=(t,tk)=>(tOver(t,tk)||tToday(t,tk))&&repOk(TODAY(),t.repeat,t.repeatDays);
const dDay=k=>{ const d=parseD(k); return d.getDate()+' '+MG[d.getMonth()]+(d.getFullYear()!==TODAY().getFullYear()?' '+d.getFullYear():''); };
function deadlineTxt(t,tk){ const n=daysTo(t.deadline);
  return n<0?'срок был '+dDay(t.deadline):n===0?'крайний срок сегодня':'до '+dDay(t.deadline)+' · осталось '+n+' '+plural(n,'день','дня','дней'); }
function taskRow(t,hideProj){

  if(g) parts.push('цель: '+(g.icon?esc(g.icon)+' ':'')+esc(g.name));

  const multi=n>1?`<div class="tmulti" role="group" aria-label="Сделано ${dn} из ${n}">${Array.from({length:n},(_,k)=>`<button class="tcheck sm p${pr} ${k<dn?'on':''}" data-act="taskTick" data-id="${t.id}" data-k="${k}" aria-pressed="${k<dn}" aria-label="Раз ${k+1} из ${n}">${k<dn?'✓':''}</button>`).join('')}<span class="fsub num">${dn} из ${n}</span></div>`:'';
  const left=n>1&&!t.done
    ?`<button class="tcheck tring p${pr}" style="--p:${(dn/n*360).toFixed(0)}deg" data-act="taskTick" data-id="${t.id}" aria-label="Отметить ещё раз: ${esc(t.name)}, сделано ${dn} из ${n}"></button>`
    :`<button class="tcheck p${pr}" data-act="taskToggle" data-id="${t.id}" aria-pressed="${!!t.done}" aria-label="${t.done?'Вернуть':'Выполнить'}: ${esc(t.name)}">${t.done?'✓':''}</button>`;
  return `<div class="trow ${t.done?'done':''}" data-tid="${t.id}">${left}
    <div class="tcol"><button class="tmain" data-act="taskOpen" data-id="${t.id}"><div class="fname">${pr===3?'<span class="flag neg">!!! </span>':pr===2?'<span class="flag" style="color:var(--t4)">!! </span>':''}${esc(t.name||'Без названия')}</div>${parts.length?`<div class="fsub">${parts.join(' · ')}</div>`:''}</button>${multi}
    ${exp?`<div class="tcl">${cl.map((c,i)=>`<button class="tcl-i ${c.done?'done':''}" data-act="clRowToggle" data-id="${t.id}" data-i="${i}" aria-pressed="${!!c.done}"><span class="tcheck sm">${c.done?'✓':''}</span><span class="tcl-t">${esc(c.text)}</span></button>`).join('')}${UI.tclAdd===t.id
      ?`<div class="tcl-add"><input class="inline-in" id="tclNew" placeholder="Новый пункт" autocomplete="off" enterkeyhint="done" aria-label="Новый пункт чек-листа"><button class="btn small primary" data-act="tclAdd" data-id="${t.id}" aria-label="Добавить пункт">+</button></div>`

function taskOccs(fromK,toK){
  const out=[], tk=todayK();
  S.tasks.forEach(t=>{
    if(t.done){ if(t.doneAt&&t.doneAt>=fromK&&t.doneAt<=toK) out.push({t,k:t.doneAt,done:true}); return; }
    const k0=t.deadline||t.due; if(!k0) return;
    if(k0>=fromK&&k0<=toK) out.push({t,k:k0,over:tOver(t,tk)});
    if(!t.due) return;
    if(t.repeat&&t.repeat!=='none'){ let g=nextDue(t.due,t.repeat,t.repeatDays), n=0;
      while(g<=tk&&n++<800) g=nextDue(g,t.repeat,t.repeatDays);
      while(g<=toK&&n++<800){ if(g>=fromK) out.push({t,k:g,ghost:true}); g=nextDue(g,t.repeat,t.repeatDays); } }
  });
  return out;
}

// Понимает: сегодня, завтра, послезавтра, в пятницу (во вт…), через 3 дня / неделю / месяц, на выходных,
// 15.11 (15.11.2027), 5 января; время — «в 18», «в 18:30», «к 9:15», «в 7 вечера», «в 9 утра».
// today — 'ГГГГ-ММ-ДД' (день на устройстве). Чего не понял — остаётся в названии.
function parseTaskText(text, today) {
  var src = String(text || '').replace(/\s+/g, ' ').trim(), s = ' ' + src + ' ', due = '', time = '';
  var END = '(?=[\\s,.!?;]|$)';
  var t0 = new Date(today + 'T00:00:00Z'), wd0 = (t0.getUTCDay() + 6) % 7;
  var key = function (d) { return d.toISOString().slice(0, 10); };
  var plus = function (n) { return key(new Date(t0.getTime() + n * 864e5)); };
  var plusMonths = function (n) { var y = t0.getUTCFullYear(), m = t0.getUTCMonth() + n, last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    return key(new Date(Date.UTC(y, m, Math.min(t0.getUTCDate(), last)))); };
  var ymd = function (y, m, d) { var x = new Date(Date.UTC(y, m, d)); return x.getUTCMonth() === m && x.getUTCDate() === d ? key(x) : ''; };
  var dayMonth = function (d, m, y) { var k = ymd(y || t0.getUTCFullYear(), m, d); if (k && !y && k < today) k = ymd(t0.getUTCFullYear() + 1, m, d); return k; };
  var cut = function (re, fn) { var m = new RegExp(re, 'i').exec(s); if (!m) return; var r = fn(m); if (!r) return;
    s = s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length); return r; };
  var MON = ['янв', 'фев', 'мар', 'апр', 'ма', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  var WD = ['пн|понедельник', 'вт|вторник', 'ср|среду|среда', 'чт|четверг', 'пт|пятницу|пятница', 'сб|субботу|суббота', 'вс|воскресенье'];

  // даты
  if (!due) due = cut('\\s(?:на\\s|до\\s|к\\s)?(\\d{1,2})\\.(\\d{1,2})(?:\\.(\\d{4}|\\d{2}))?' + END, function (m) {
    var y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : 0; return dayMonth(+m[1], +m[2] - 1, y); }) || '';
  if (!due) due = cut('\\s(?:на\\s|до\\s|к\\s)?(\\d{1,2})\\s(январ[яь]|янв|феврал[яь]|фев|марта?|мар|апрел[яь]|апр|ма[яй]|июн[яь]|июн|июл[яь]|июл|августа?|авг|сентябр[яь]|сент?|октябр[яь]|окт|ноябр[яь]|нояб?|декабр[яь]|дек)\\.?(?:\\s(\\d{4}))?' + END, function (m) {
    var w = m[2].toLowerCase(), mi = -1;
    for (var i = 0; i < MON.length; i++) if (w.indexOf(MON[i]) === 0 && !(MON[i] === 'ма' && w.indexOf('мар') === 0)) { mi = i; break; }
    return mi < 0 ? '' : dayMonth(+m[1], mi, m[3] ? +m[3] : 0); }) || '';
  if (!due) due = cut('\\s(?:на\\s)?послезавтра' + END, function () { return plus(2); }) || '';
  if (!due) due = cut('\\s(?:на\\s)?завтра' + END, function () { return plus(1); }) || '';
  if (!due) due = cut('\\s(?:на\\s)?сегодня' + END, function () { return plus(0); }) || '';
  if (!due) due = cut('\\sчерез\\s(?:(\\d+)\\s)?(день|дня|дней|неделю|недели|недель|месяц|месяца|месяцев)' + END, function (m) {
    var n = m[1] ? +m[1] : 1, u = m[2].toLowerCase();
    return /^д/.test(u) ? plus(n) : /^н/.test(u) ? plus(7 * n) : plusMonths(n); }) || '';
  if (!due) due = cut('\\s(?:на|в)\\sвыходны[хе]' + END, function () { return plus(wd0 >= 5 ? 0 : 5 - wd0); }) || '';
  if (!due) due = cut('\\s(?:в|во|до|к)\\s(' + WD.join('|') + ')' + END, function (m) {
    var w = m[1].toLowerCase(), i = 0;
    for (; i < WD.length; i++) if (('|' + WD[i] + '|').indexOf('|' + w + '|') >= 0) break;
    var n = (i - wd0 + 7) % 7; return plus(n || 7); }) || '';

  // время
  time = cut('\\s(?:в|к)\\s(\\d{1,2})(?::(\\d{2}))?(\\s?(?:ч|час|часа|часов))?(?:\\s(утра|дня|вечера|ночи))?' + END, function (m) {
    var h = +m[1], mi = m[2] ? +m[2] : 0, p = (m[4] || '').toLowerCase();
    if (!m[2] && !m[3] && !p) { // «в 2 этапа» — не время: после числа идёт обычное слово
      var rest = s.slice(m.index + m[0].length).trim();
      if (rest && !/^[,.!?;]/.test(rest)) return '';
    }
    if (p === 'утра' && h === 12) h = 0;
    if ((p === 'дня' || p === 'вечера') && h < 12) h += 12;
    if (p === 'ночи' && h === 12) h = 0;
    if (h > 23 || mi > 59) return '';
    return ('0' + h).slice(-2) + ':' + ('0' + mi).slice(-2); }) || '';

  var name = s.replace(/\s+/g, ' ').trim().replace(/[\s,;:—–-]+$/, '').replace(/^[\s,;:—–-]+/, '');
  return { name: name || src, due: due, time: time };
}
