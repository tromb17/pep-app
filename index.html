<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a78d6">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Мой план</title>
<style>
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f1f0ec; --line:#e3e2dc;
  --text:#0b0b0b; --text-2:#52514e; --muted:#898781;
  --accent:#2a78d6; --accent-soft:#e3eefb; --on-accent:#fff;
  --pos-bar:#2a78d6; --neg-bar:#e34948; --series:#2a78d6;
  --pos-text:#0b7a0b; --neg-text:#c0312f; --neg-bg:#fbe9e8;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --t1:#2a78d6; --t2:#eb6834; --t3:#1baf7a; --t4:#eda100; --t5:#e87ba4; --t6:#008300; --t7:#6250d6;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --r:14px;
  --s-home:#2a78d6; --s-tasks:#2a78d6; --s-fin:#159a6b; --s-habits:#e5672f; --s-goals:#6250d6; --s-notes:#d49400; --s-more:#6f6e69;
  --s-pay:#0d93a3; --s-bdays:#d9558c; --s-train:#d6453d; --s-books:#9a6b3f; --s-movies:#8a4fd0; --s-food:#4e9e2c; --s-week:#2a78d6; --s-trash:#6f6e69;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#121417; --surface:#1c1f24; --surface-2:#262a30; --line:#343941;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#898781;
    --accent:#3987e5; --accent-soft:#16283f;
    --pos-bar:#3987e5; --neg-bar:#e66767; --series:#3987e5;
    --pos-text:#5fd35f; --neg-text:#f08a8a; --neg-bg:#3a1f1e;
    --t1:#3987e5; --t2:#d95926; --t3:#199e70; --t4:#c98500; --t5:#d55181; --t6:#008300; --t7:#9085e9;
    --shadow:none;
    --s-home:#4a92ea; --s-tasks:#4a92ea; --s-fin:#2fc28c; --s-habits:#f08250; --s-goals:#9085e9; --s-notes:#e8b330; --s-more:#a3a29b;
    --s-pay:#2ab7c7; --s-bdays:#ec7aa8; --s-train:#ef6b63; --s-books:#c99566; --s-movies:#b182ec; --s-food:#7cc456; --s-week:#5a9bea; --s-trash:#a3a29c;
}
}
:root[data-theme="dark"]{
  --page:#121417; --surface:#1c1f24; --surface-2:#262a30; --line:#343941;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#898781;
  --accent:#3987e5; --accent-soft:#16283f;
  --pos-bar:#3987e5; --neg-bar:#e66767; --series:#3987e5;
  --pos-text:#5fd35f; --neg-text:#f08a8a; --neg-bg:#3a1f1e;
  --t1:#3987e5; --t2:#d95926; --t3:#199e70; --t4:#c98500; --t5:#d55181; --t6:#008300; --t7:#9085e9;
  --shadow:none;
  --s-home:#4a92ea; --s-tasks:#4a92ea; --s-fin:#2fc28c; --s-habits:#f08250; --s-goals:#9085e9; --s-notes:#e8b330; --s-more:#a3a29b;
  --s-pay:#2ab7c7; --s-bdays:#ec7aa8; --s-train:#ef6b63; --s-books:#c99566; --s-movies:#b182ec; --s-food:#7cc456; --s-week:#5a9bea; --s-trash:#a3a29c;
}
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
small{font-size:11.5px;color:var(--muted)}

.top{position:sticky;top:0;z-index:20;background:var(--page);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 6px}
.sic{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--sec,var(--accent)) 16%,transparent);color:var(--sec,var(--accent))}
.sic svg{width:19px;height:19px}
.top h1{font-size:20px;margin:0;flex:0 1 auto;min-width:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync>span{display:none}
.sync{cursor:pointer;padding:10px 6px;margin:-10px -6px;}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;min-width:0;flex:0 1 auto}
.sync span{overflow:hidden;text-overflow:ellipsis}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--critical)} .sync.err{color:var(--neg-text)}
.icon-btn{border:0;background:transparent;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}

.subnav{position:sticky;top:calc(54px + env(safe-area-inset-top));z-index:19;background:var(--page);display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;white-space:nowrap;color:var(--text-2)}
.chip.on{background:color-mix(in srgb,var(--sec,var(--accent)) 16%,var(--surface));border-color:color-mix(in srgb,var(--sec,var(--accent)) 55%,transparent);color:var(--text);font-weight:600}

main{max-width:760px;margin:0 auto;padding:0 16px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 2px;font-size:16px}
.hint{color:var(--muted);font-size:13px;margin:2px 0 10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{border:0;background:transparent;color:var(--accent);padding:2px 0 10px;font-size:15px}
.detail-title{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.detail-title h2{margin:0;font-size:21px;flex:1;min-width:0}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (min-width:640px){.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12.5px;color:var(--text-2)}
.kpi .v{font-size:19px;font-weight:650;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:1px}
.kpi.hero{grid-column:1/-1}
.kpi.hero .v{font-size:28px}
.neg{color:var(--neg-text)} .pos{color:var(--pos-text)}

.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:14px;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

.chart{position:relative;height:190px;margin-top:6px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--page);font-size:12.5px;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}

/* этот и следующий месяц */
table.nn{width:100%;border-collapse:collapse;font-size:15px}
.nn th,.nn td{padding:8px 4px;text-align:right;border-top:1px solid var(--line);vertical-align:top}
.nn th{border-top:0;font-size:14px}
.nn th:first-child,.nn td:first-child{text-align:left;color:var(--text-2)}
.nn small{display:block;font-weight:400}
.nn tr.key td{font-weight:650}
.nn tr.key td:first-child{color:var(--text)}

/* средние траты */
.avg{padding:9px 0;border-top:1px solid var(--line)}
.avg:first-of-type{border-top:0}
.bullet{position:relative;height:8px;border-radius:999px;background:var(--surface-2);margin:6px 0 3px}
.bullet i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--pos-bar)}
.bullet i.over{background:var(--neg-bar)}
.bullet b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:1px;transform:translateX(-1px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:4px;background:var(--c)}
.legend i.tick{width:2px;height:12px;border-radius:1px}
.typesum{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:14px;margin:4px 0 10px}
.typesum .h{color:var(--muted);font-size:12px}

.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.monthbar .t{flex:1;text-align:center;min-width:0}
.monthbar .t b{display:block;font-size:18px}
.monthbar .t span{font-size:12.5px;color:var(--muted)}
.nav-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;color:var(--text-2);flex:none}
.nav-btn:disabled{opacity:.35;cursor:default}
.ghead{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:4px}
.ghead .sum{margin-left:auto;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.frow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.fmain{flex:1;min-width:0}
.fname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsub{font-size:12.5px;color:var(--muted)}
.finput{display:flex;align-items:center;gap:4px;flex:none}
.finput input{width:118px;text-align:right;padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.finput input:focus,.gtbl input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
input.bad{outline:2px solid var(--critical)!important}
.xbtn{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:0 2px 0 8px;vertical-align:-1px}
.xbtn:hover{color:var(--neg-text)}
.plus{width:32px;height:36px;border:0;border-radius:9px;background:var(--surface-2);font-size:18px;color:var(--text-2)}
.more{border:0;background:transparent;color:var(--accent);padding:10px 0 2px;font-size:14px}
.ro{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.ro:first-of-type{border-top:0}
.ro.t{font-weight:600}
.ro.k{font-weight:650}
.rh{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 2px}
.namebtn{border:0;background:transparent;padding:0;text-align:left;width:100%;display:block}

.list-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:10px 0}
.list-row:first-child{border-top:0}
.list-row .m{flex:1;min-width:0}
.list-row .a{text-align:right;flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:550}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--neg-text)}
.btn.small{padding:6px 11px;font-size:14px}
.status{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.status.good{color:var(--pos-text);background:color-mix(in srgb,var(--good) 14%,transparent)}
.status.bad{color:var(--neg-text);background:var(--neg-bg)}
.status.idle{color:var(--text-2);background:var(--surface-2)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--text-2);background:var(--surface-2);border-radius:6px;padding:1px 6px;vertical-align:1px}
.tag.f{color:var(--accent);background:var(--accent-soft)}

/* перетаскивание статей */
.drow{display:flex;align-items:center;border-top:1px solid var(--line);background:var(--surface)}
.drows .drow:first-child{border-top:0}
.drow .list-row{border-top:0;flex:1;min-width:0}
.drag{flex:none;width:34px;align-self:stretch;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:16px;letter-spacing:-2px}
.drows{min-height:8px}
.drows:empty::after{content:'Перетащите статью сюда';display:block;text-align:center;color:var(--muted);font-size:13px;padding:12px;border:1.5px dashed var(--line);border-radius:10px}
.drow.dragging{opacity:.35}
.drow.ghost{position:fixed;z-index:60;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:12px;border:1px solid var(--line);padding:0 10px 0 0}
[data-group].drop-on{outline:2px solid var(--accent);outline-offset:-1px}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* баланс */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:12px}
table.bal{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
.bal th,.bal td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.bal th:first-child,.bal td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;z-index:1;border-right:1px solid var(--line);max-width:150px;overflow:hidden;text-overflow:ellipsis}
.bal thead th{font-weight:600;color:var(--text-2);background:var(--surface-2)}
.bal thead th:first-child{z-index:2;background:var(--surface-2)}
.bal tr.sec td{background:var(--page);color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding-top:10px}
.bal tr.sec td:first-child{background:var(--page)}
.bal tr.t td{font-weight:600}
.bal tr.k td,.bal tr.k td:first-child{font-weight:650;background:var(--surface-2)}
.bal td.cur,.bal th.cur{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.bal td.negc{color:var(--neg-text);background:var(--neg-bg)!important}
.bal td.zero{color:var(--muted)}
.bal th small{display:block;font-weight:400}
.bm{padding:0;overflow:hidden}
.bm.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bm-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:12px 14px 4px}
.bm-head .t{flex:1;min-width:0}
.bm-head .t b{font-size:16px}
.bm-free{font-size:18px;font-weight:650;text-align:right}
.bm-free small{display:block;font-weight:400;text-align:right}
.bm-body{padding:0 14px 12px}
.bm-bar{display:flex;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:6px 0;gap:2px}
.bm-bar i{display:block;height:100%}
.bm-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--text-2)}
.bm-more{border-top:1px solid var(--line);margin-top:10px;padding-top:2px}
.chev{color:var(--muted);transition:transform .15s;flex:none}
.bm.open .chev{transform:rotate(90deg)}

.thermo.lim{height:5px;margin:4px 0 2px;max-width:220px}
.thermo i.warn{background:var(--warning)}
.thermo i.over{background:var(--neg-bar)}
.thermo{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:10px 0 6px}
.thermo.big{height:22px}
.thermo i{display:block;height:100%;background:var(--accent);border-radius:999px;min-width:3px}
.thermo i.done{background:var(--good)}
.gtbl{width:100%;border-collapse:collapse;font-size:14px}
.gtbl th,.gtbl td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}
.gtbl th:first-child,.gtbl td:first-child{text-align:left}
.gtbl th{font-weight:600;color:var(--text-2);font-size:12.5px;border-top:0}
.gtbl input{width:96px;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.gtbl tr.cur td{background:var(--accent-soft)}

.form{display:grid;gap:10px}
.field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:4px}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dchip{position:relative}
.dchip input{position:absolute;opacity:0;pointer-events:none}
.dchip span{display:block;text-align:center;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:14px;color:var(--text-2)}
.dchip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.dchip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* привычки */
.hgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.hgrid.head{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:2px}
.hgrid.head b{display:block;font-size:14px;color:var(--text-2);font-weight:600}
.hgrid.head .t b{color:var(--accent)}
.hrow{padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.hrow .namebtn{margin-bottom:7px;display:flex;align-items:baseline;gap:8px}
.hrow .namebtn .fname{font-weight:550}
.hc{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:17px;font-weight:700;color:var(--on-accent);padding:0}
.hc.on{background:var(--accent);border-color:var(--accent)}
.hc.off{background:transparent;border-style:dashed;opacity:.55}
.hc.today{box-shadow:0 0 0 2px var(--page),0 0 0 3.5px var(--accent)}
.hc:disabled{opacity:.25;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:11.5px;color:var(--muted);text-align:center}
.cal .hc{height:40px;font-size:13px;font-weight:600;color:var(--text-2)}
.cal .hc.on{color:var(--on-accent)}
.pbar{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left}
.pbar:first-of-type{border-top:0}
.pbar .m{flex:1;min-width:0}
.pbar .thermo{height:8px;margin:5px 0 0}

.soon{text-align:center;padding:28px 18px}
.soon .ic{width:58px;height:58px;border-radius:18px;background:color-mix(in srgb,var(--sec,var(--accent)) 15%,transparent);color:var(--sec,var(--accent));display:grid;place-items:center;margin:0 auto 12px}
.soon .ic svg{width:30px;height:30px}
.soon h2{margin:0 0 4px;font-size:21px}
.badge{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;margin-bottom:12px}
.soon ul{text-align:left;max-width:340px;margin:14px auto 0;padding-left:20px;color:var(--text-2)}
.soon li{margin:5px 0}
.empty{text-align:center;padding:26px 16px}
.empty p{color:var(--text-2);margin:6px 0 14px}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.sheet h2{margin:0 0 12px;font-size:18px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
/* главный экран, крупные суммы, первые шаги */
.hello{margin:2px 2px 12px}
.hello b{display:block;font-size:22px;letter-spacing:-.01em}
.hello span{color:var(--text-2);font-size:14px}
.quick{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-weight:550;white-space:nowrap;box-shadow:var(--shadow)}
.quick button svg{width:18px;height:18px;color:var(--sec)}
.hhead{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.hhead b{font-size:16px;flex:1;min-width:0}
.hhead .more{padding:0;white-space:nowrap}
.hic{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--sec,var(--accent)) 15%,transparent);color:var(--sec,var(--accent))}
.hic svg{width:17px;height:17px}
.hlist .trow:first-child,.hhead+.trow,.hhead+.soonrow{border-top:0}
.hpills{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.hpill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;font-size:14px;max-width:100%}
.hpill i{width:24px;height:24px;border-radius:50%;border:2px solid color-mix(in srgb,var(--sec) 60%,transparent);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;flex:none}
.hpill.on{background:color-mix(in srgb,var(--sec) 14%,var(--surface));border-color:color-mix(in srgb,var(--sec) 45%,transparent)}
.hpill.on i{background:var(--sec);border-color:var(--sec);color:#fff}
.hpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soonrow{display:flex;align-items:center;gap:10px;padding:8px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left}
.soonrow:first-of-type{border-top:0}
.soonrow .m{flex:1;min-width:0}
.soonrow .w{font-size:12.5px;color:var(--text-2);white-space:nowrap;text-align:right}
.limrow{padding:7px 0;border-top:1px solid var(--line)}.hhead+.limrow{border-top:0}
.limrow .thermo.lim{max-width:none}
.hero-l{font-size:13px;color:var(--text-2)}
.hero-n{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:2px 0 6px}
.hero-n.pos{color:var(--pos-text)}
.hero-s{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:13.5px;color:var(--text-2)}
.hero-s b{color:var(--text);font-weight:600}
.hero2{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.hero2>b{font-size:24px;font-weight:700;letter-spacing:-.01em}
.balsel{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.capm,.balsel select{width:auto;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:5px 8px;font-size:14px}
.first{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin:0 0 12px;border:1px dashed color-mix(in srgb,var(--sec,var(--accent)) 45%,var(--line));border-radius:var(--r);background:color-mix(in srgb,var(--sec,var(--accent)) 5%,var(--surface))}
.card .first{margin:0;border:0;background:none;padding:2px 0}
.first .m{flex:1;min-width:0}
.first b{display:block;font-size:15px}
.first p{margin:2px 0 0;color:var(--text-2);font-size:13.5px;line-height:1.4}
.first .btn{margin-top:8px}
.welcome{position:fixed;inset:0;z-index:45;background:var(--page);display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));overflow:auto}
.welcome .wbox{max-width:400px;width:100%;text-align:center}
.welcome img{width:84px;height:84px;border-radius:20px}
.welcome h2{margin:14px 0 8px;font-size:24px}
.welcome p{color:var(--text-2);margin:0 0 10px;line-height:1.45}
.welcome .btn{display:block;width:100%;margin-top:10px;padding:13px 14px;font-size:16px}
.welcome .btn.link{border:0;background:none;color:var(--text-2);font-weight:500}
.actions .sp{flex:1}
.sheet textarea{min-height:110px}
#jsonBox{min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--page);padding:8px 14px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* «Ещё» */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;box-shadow:var(--shadow);min-width:0}
.tile .ic{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--sec,var(--accent)) 15%,transparent);color:var(--sec,var(--accent));display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile b{font-size:16px}
.tile .fsub{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* задачи, шаги */
.qa-row{display:flex;gap:8px}
.inline-in{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.inline-in:focus{outline:2px solid var(--accent);outline-offset:-1px}
.qa-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qa-chips .chip{padding:4px 11px;font-size:13px}
.trow{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.tcheck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--on-accent);padding:0;margin-top:1px}
.tcheck.p1{border-color:var(--t1)} .tcheck.p2{border-color:var(--t4)} .tcheck.p3{border-color:var(--critical)}
.trow.done .tcheck{background:var(--muted);border-color:var(--muted)}
.trow.done .fname{text-decoration:line-through;color:var(--muted)}
.tmain{flex:1;min-width:0;border:0;background:transparent;padding:0;text-align:left}
.tmain .fname{white-space:normal}
.tcol{flex:1;min-width:0;display:flex;flex-direction:column}
.tcol .tmain{width:100%}
.tmulti{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:7px}
.tmulti .fsub{margin-left:2px}
.tcheck.on{background:var(--accent);border-color:var(--accent)}
.tring{background:conic-gradient(var(--accent) var(--p),transparent 0)}
.tgrip{flex:none;width:30px;align-self:stretch;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:15px;letter-spacing:-2px;margin-right:-6px}
.trow.dragging{opacity:.35}
.tghost{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
[data-tdrop].drop-on{outline:2px solid var(--accent);outline-offset:-1px;background:var(--accent-soft)}
@media (max-width:899px){body.tdragging .proj-side{display:block;position:fixed;left:0;top:0;bottom:0;width:min(58vw,240px);z-index:46;border-radius:0 18px 18px 0;padding:calc(14px + env(safe-area-inset-top)) 10px 16px;overflow:auto;box-shadow:4px 0 24px rgba(0,0,0,.25)}}
.sticky-ok{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--page);padding:10px 0;margin-top:4px;z-index:5}
.flag{font-weight:800}
.smart-row{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.smart-row:first-of-type{border-top:0}
.smart-l{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.smart-row.miss .smart-l{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.smart-b{flex:1;min-width:0}
.smart-t{white-space:pre-wrap;margin-top:1px}
.tag.smart-miss{color:var(--t4);border-color:currentColor}
.tag.smart-ok{color:var(--good);border-color:currentColor}
.why{border-left:3px solid var(--accent);padding:4px 0 4px 12px;color:var(--text-2);font-style:italic;margin:4px 0 12px;white-space:pre-wrap}
/* книги */
.stars{display:flex;gap:2px}
.stars button{border:0;background:transparent;font-size:28px;line-height:1;color:var(--line);padding:2px}
.stars button.on{color:var(--warning)}
.stars-s{color:var(--warning);letter-spacing:1px}
/* тренировки */
.sets{display:grid;gap:6px;margin-top:8px}
.setrow{display:grid;align-items:center;gap:6px;font-size:14px}
.setrow.h{font-size:11.5px;color:var(--muted)}
.setrow input{width:100%;min-width:0;text-align:center;padding:8px 2px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.setrow input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.setrow .prev{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setrow.done input{background:color-mix(in srgb,var(--good) 14%,var(--surface-2));border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.sbtn{height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;padding:0;color:var(--text-2)}
.sbtn.on{background:var(--good);border-color:var(--good);color:#fff}
.wk-head{display:flex;align-items:center;gap:10px}
.wk-time{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ex-actions{display:flex;gap:6px;flex:none}
.ex-actions .btn{padding:5px 10px}
.mini-in{width:100%;min-width:0;text-align:center;padding:7px 2px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px;font-size:11.5px;color:var(--muted)}
select.mini{padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.timerbar{position:fixed;left:8px;right:8px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:36;background:var(--text);color:var(--page);border-radius:16px;padding:10px 14px 12px;max-width:560px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tb-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tb-top .tl{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-time{font-size:30px;font-weight:700}
.tb-bar{height:5px;border-radius:3px;background:rgba(127,127,127,.4);margin:6px 0 8px;overflow:hidden}
.tb-bar i{display:block;height:100%;background:var(--accent)}
.tb-btns{display:flex;gap:8px;margin-top:6px}
.tb-btns button{flex:1;border:0;border-radius:10px;padding:9px;background:rgba(127,127,127,.3);color:inherit;font-weight:600}
body.has-timer{padding-bottom:calc(200px + env(safe-area-inset-bottom))}
.banner{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:var(--r);background:var(--accent);color:var(--on-accent);padding:12px 14px;margin-bottom:12px;font-weight:600;text-align:left}
.banner span{flex:1}
/* питание */
.cups{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.cup{width:24px;height:30px;border-radius:4px 4px 8px 8px;border:2px solid var(--series);opacity:.4}
.cup.on{background:var(--series);opacity:1}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;font-size:13px;color:var(--text-2)}
.macro b{display:block;font-size:16px;color:var(--text)}
/* заметки */
.note-card{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:11px 0}
.note-card:first-of-type{border-top:0}
.note-prev{color:var(--text-2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;white-space:pre-line}
.note-title{width:100%;border:0;background:transparent;font-size:21px;font-weight:650;padding:4px 0;outline:none}
.note-body{width:100%;min-height:55vh;border:0;background:transparent;resize:vertical;font-size:16px;line-height:1.5;outline:none;padding:4px 0}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);margin-bottom:12px}
.field textarea{min-height:80px;resize:vertical;font:inherit}

/* проекты задач: слева на широком экране, выезжающая панель на телефоне */
:root{--serious:#ec835a}
@media (min-width:900px){
  main.wide{max-width:1060px}
  .tasks-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
  .tasks-layout .proj-side{display:block;position:sticky;top:110px;max-height:calc(100vh - 190px);overflow:auto}
  .proj-btn{display:none!important}
}
.proj-side{display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.proj-side.open{display:block;position:fixed;left:0;top:0;bottom:0;width:min(84vw,320px);z-index:46;border-radius:0 18px 18px 0;padding:calc(14px + env(safe-area-inset-top)) 10px 16px;overflow:auto;box-shadow:4px 0 24px rgba(0,0,0,.25)}
.side-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45}
.side-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 8px 4px}
.side-h:first-child{margin-top:4px}
.side-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:9px;padding:8px;text-align:left;font-size:14.5px;color:var(--text)}
.side-item.sub{padding-left:28px;font-size:14px}
.side-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-item .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.side-add{border:0;background:transparent;color:var(--accent);font-size:20px;line-height:1;padding:0 4px}
.proj-btn{display:inline-flex;align-items:center;gap:6px}
.ptag{font-size:12px;color:var(--text-2)}
.tfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ico{margin-right:6px;font-style:normal}
.emojis{display:flex;flex-wrap:wrap;gap:6px}.emo input{position:absolute;opacity:0;pointer-events:none}
.emo span{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:21px;cursor:pointer}
.emo span.none{font-size:12px;color:var(--text-2)}.emo input:checked+span{border-color:var(--sec,var(--accent));box-shadow:0 0 0 2px var(--sec,var(--accent)) inset;background:var(--surface-2)}
.emo input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
/* отклик на отметку: галочка с кольцом; «всё сделано» — ещё и искры */
.cheer{position:fixed;z-index:95;pointer-events:none;width:0;height:0}
.cheer i{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid var(--sec,var(--accent));animation:chR .55s ease-out forwards}
.cheer b{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:var(--sec,var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;animation:chB .65s cubic-bezier(.2,1.6,.4,1) forwards}
.cheer s{position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--c);transform:rotate(var(--a));animation:chP .75s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes chR{from{transform:scale(.4);opacity:.9}to{transform:scale(1.7);opacity:0}}
@keyframes chB{0%{transform:scale(.3);opacity:0}35%{transform:scale(1.15);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes chP{from{transform:rotate(var(--a)) translateY(-8px);opacity:1}to{transform:rotate(var(--a)) translateY(-54px) scale(.5);opacity:0}}
.pulse{animation:pulse .35s ease-out}@keyframes pulse{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){.cheer,.pulse{animation:none!important}.cheer{display:none}}
.trashrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.trashrow:first-child{border-top:0}.trashrow .m{flex:1;min-width:0}
.wk-nav{display:flex;align-items:center;gap:8px;margin:2px 0 10px}.wk-nav b{flex:1;text-align:center;font-size:15px}
.wk-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 4px}.wk-kpis>div{background:var(--surface-2);border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
.wk-kpis b{display:block;font-size:22px;line-height:1.1}.wk-kpis span{font-size:12px;color:var(--text-2)}
.wk-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.wk-row:first-of-type{border-top:0}.wk-row .fname{min-width:0}
.wk-home{display:flex;align-items:center;gap:10px}.wk-home .m{flex:1;min-width:0}
.hsub{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);margin:8px 0 2px}.hsub.neg{color:var(--neg)}
.dwrap{display:flex;gap:4px;align-items:center}.dwrap input{flex:1;min-width:0}
.cl-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.cl-row:first-child{border-top:0}
.cl-text{flex:1;min-width:0;border:0;background:transparent;padding:4px 0;font-size:15px;outline:none}
.cl-row.done .cl-text{text-decoration:line-through;color:var(--muted)}
.tcheck.sm{width:20px;height:20px;font-size:11px;margin-top:0}
.dbtn{padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;color:var(--text-2)}
.dbtn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
/* заметки: закрепление прямо в списке */
.note-tools{display:flex;flex-wrap:wrap;gap:2px;padding:6px 0;margin:2px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:calc(54px + env(safe-area-inset-top));background:var(--surface);z-index:3}

<script>
'use strict';
/* Стартовое наполнение: пустой план с текущего месяца. Свои данные живут в Google Таблице, в страницу они не зашиваются. */
const DEFAULT_DATA=(()=>{ const d=new Date(), m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return {version:1,settings:{periodStart:m,months:12,scenario:'Базовый'},scenarios:[{name:'Базовый',inc:1,exp:1,sav:1}],
    items:[],facts:[],insurance:[],gifts:[],investments:[],goal:{name:'',target:0,date:'',start:''},goalFacts:[]}; })();

// ENGINE-START — расчёты (повторяют формулы листов Календарь / Факт / Баланс)
const TYPES=['Доход','Разовый доход','Обязательный расход','Необязательный расход','Кредит','Разовая покупка','Накопление'];
const TYPE_CAT={'Доход':'inc','Разовый доход':'inc','Обязательный расход':'exp','Необязательный расход':'exp','Кредит':'exp','Разовая покупка':'exp','Накопление':'sav'};

function mIdx(s){ if(!s) return null; const y=+String(s).slice(0,4), m=+String(s).slice(5,7); return (y&&m)?y*12+m-1:null; }
function mKey(i){ return Math.floor(i/12)+'-'+String(i%12+1).padStart(2,'0'); }
function parseD(s){ if(!s) return null; const p=String(s).split('-').map(Number); return p[0]?new Date(p[0],(p[1]||1)-1,p[2]||1):null; }
const daysTo=k=>Math.round((parseD(k)-TODAY())/864e5);
function addMonthsKD(d0,k){ const y=d0.getFullYear(), m=d0.getMonth()+k; return new Date(y,m,Math.min(d0.getDate(),new Date(y,m+1,0).getDate())); }
function datedifM(a,b){ let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()); if(b.getDate()<a.getDate()) m--; return m; }
function numOr(v,d){ return (v===''||v==null||isNaN(+v))?d:+v; }
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const wd=d=>(d.getDay()+6)%7; // пн = 0

/* «715+600» → 1315; пусто → null; ошибка → NaN. Свой разбор, без eval. */
function evalExpr(src){
  if(src==null) return null;
  const s=String(src).trim().replace(/^=/,'').replace(/\s+/g,'').replace(/,/g,'.');
  if(s==='') return null;
  let i=0;
  const num=()=>{ const m=/^(\d+(\.\d*)?|\.\d+)/.exec(s.slice(i)); if(!m) throw 0; i+=m[0].length; return parseFloat(m[0]); };
  const fac=()=>{ if(s[i]==='-'){i++;return -fac();} if(s[i]==='+'){i++;return fac();}
    if(s[i]==='('){ i++; const v=add(); if(s[i]!==')') throw 0; i++; return v; } return num(); };
  const mul=()=>{ let v=fac(); while(s[i]==='*'||s[i]==='/'){ const o=s[i++], r=fac(); v=o==='*'?v*r:v/r; } return v; };
  const add=()=>{ let v=mul(); while(s[i]==='+'||s[i]==='-'){ const o=s[i++], r=mul(); v=o==='+'?v+r:v-r; } return v; };
  try{ const v=add(); return (i===s.length&&isFinite(v))?v:NaN; }catch(e){ return NaN; }
}
function mapFacts(list,idKey){ const m={}; for(const f of list||[]){ const v=evalExpr(f.value); if(v!=null&&!isNaN(v)) (m[f[idKey]]||(m[f[idKey]]={}))[f.month]=v; } return m; }

// берёт ли фонд процент с этого дохода
const fundTakes=(f,it)=>Array.isArray(f.src)&&f.src.length?f.src.includes(it.id):(it.type==='Доход'||(f.once&&it.type==='Разовый доход'));
function fundSrcText(f){ if(Array.isArray(f.src)&&f.src.length){ const n=S.items.filter(it=>f.src.includes(it.id)).map(it=>it.name); return n.length?n.join(', '):'доходы не выбраны'; }
  return f.once?'все доходы, включая разовые':'все регулярные доходы'; }
function buildBal(months,rows,ins,gifts,pos,pick,al){
  const sum=(list,f)=>months.map((_,j)=>list.reduce((s,r)=>s+f(r,j),0));
  const B={};
  // статья, привязанная к фонду, оплачивается из фонда — в расходы второй раз не идёт
  const inFund=(r,j)=>al&&r.it.fund&&al.fundIds.has(r.it.fund)&&months[j]>=al.start;
  for(const t of TYPES) B[t]=sum(rows,(r,j)=>(r.it.type===t&&!inFund(r,j))?r[pick][j]:0);
  // фонды: процент от своих источников (выбранные доходы или все регулярные), с месяца начала
  B.funds=[];
  if(al){
    const incRows=rows.filter(r=>r.it.type==='Доход'||r.it.type==='Разовый доход');
    al.funds.forEach(f=>{ const base=months.map((m,j)=>m<al.start?0:incRows.reduce((s,r)=>s+(fundTakes(f,r.it)?r[pick][j]:0),0));
      B.funds.push({f,base,amt:base.map(v=>v*numOr(f.pct,0)/100)}); });
  }
  B.fundSave=months.map((_,j)=>B.funds.reduce((s,x)=>s+(x.f.kind==='save'?x.amt[j]:0),0));
  B.fundSpend=months.map((_,j)=>B.funds.reduce((s,x)=>s+(x.f.kind!=='save'?x.amt[j]:0),0));
  const giftsOn=al&&al.funds.some(f=>f.gifts);
  B.invest=sum(pos,(r,j)=>r[pick][j]);
  B.invBack=sum(pos,(r,j)=>r.flowOut[j]);
  B.invIn=sum(pos,(r,j)=>r.flowIn[j]);
  B.capital=sum(pos,(r,j)=>r.capital[j]);
  B.ins=sum(ins,(r,j)=>r[pick][j]);
  // с фондом «Подарки» дни рождения оплачиваются из фонда, отдельный резерв не нужен
  B.gifts=sum(gifts,(r,j)=>(giftsOn&&months[j]>=al.start)?0:r.res[j]);
  B.inc=months.map((_,j)=>B['Доход'][j]+B['Разовый доход'][j]+B.invest[j]+B.invBack[j]);
  B.exp=months.map((_,j)=>B['Обязательный расход'][j]+B['Необязательный расход'][j]+B['Кредит'][j]+B['Разовая покупка'][j]+B.ins[j]+B.gifts[j]+B.fundSpend[j]);
  B.sav=months.map((_,j)=>B['Накопление'][j]+B.invIn[j]+B.fundSave[j]);
  B.free=months.map((_,j)=>B.inc[j]-B.exp[j]-B.sav[j]);
  let a=0; B.cum=B.free.map(v=>a+=v);
  let s=0; B.savCum=B['Накопление'].map(v=>s+=v);
  B.savings=B.savCum.map((v,j)=>v+B.capital[j]);
  return B;
}

// доход бумаги с биржи: купоны облигации по графику биржи (ещё не объявленный — по текущему) или ожидаемый дивиденд
function exIncome(p,q,qtyAt,qty,nowK){
  const out=[]; if(!q) return out;
  if(p.market==='bonds'&&Array.isArray(q.cpn)) q.cpn.forEach(([d,v])=>{ const m=mIdx(d); if(m==null) return;
    const per=v!=null?v:numOr(q.cv,0), n=d<=nowK?qtyAt(d):qty; if(n>0&&per>0) out.push({d,m,v:n*per,per,n,est:v==null}); });
  else if(p.market!=='bonds'&&numOr(p.divPs,0)>0&&p.divDate){ const m=mIdx(p.divDate), per=numOr(p.divPs,0), n=p.divDate<=nowK?qtyAt(p.divDate):qty;
    if(m!=null&&n>0) out.push({d:p.divDate,m,v:n*per,per,n,est:true}); }
  return out;
}

function compute(st,now){
  now=now||new Date();
  const curM=now.getFullYear()*12+now.getMonth(), nowK=dkey(new Date(now.getFullYear(),now.getMonth(),now.getDate()));
  const p0=mIdx(st.settings.periodStart), N=Math.max(1,Math.min(240,Math.max(Math.round(numOr(st.settings.months,12)),(now.getFullYear()+1)*12+11-p0+1)));
  const months=Array.from({length:N},(_,k)=>p0+k);
  const keys=months.map(mKey);
  const colDates=months.map(m=>new Date(Math.floor(m/12),m%12,1));
  const coef={inc:1,exp:1,sav:1};

  // Календарь + Факт: план по статье с коэффициентом сценария; факт, если введён, заменяет план
  const factMap=mapFacts(st.facts,'item');
  const rows=st.items.map(it=>{
    const H=mIdx(it.start), I=mIdx(it.end), per=Math.round(numOr(it.period,0)), amt=numOr(it.amount,null), cat=TYPE_CAT[it.type];
    const K=(amt==null||!cat)?null:amt*coef[cat];
    const plan=months.map(m=>{
      if(K==null||H==null||m<H) return 0;
      if(I!=null&&m>I) return 0;
      if(per<=0) return m===H?K:0;
      return ((m-H)%per===0)?K:0;
    });
    const fm=factMap[it.id]||{};
    const fact=keys.map(k=>k in fm?fm[k]:null);
    const used=plan.map((p,j)=>fact[j]!=null?fact[j]:p);
    return {it,plan,fact,used};
  });

  // Страхование: план = сумма / месяцев до платежа; факт — сколько реально перевели на счёт
  const insFact=mapFacts(st.insFacts,'ins');
  const ins=st.insurance.map(x=>{
    const B=parseD(x.start), Cd=parseD(x.pay), D=numOr(x.amount,0);
    // месяцев для взносов — столько же, сколько строк в таблице взносов: с месяца начала (если с 1-го числа) по месяц платежа (если платёж не 1-го)
    const insN=(b,c)=>(c.getFullYear()*12+c.getMonth())-(b.getFullYear()*12+b.getMonth())+(c.getDate()>1?1:0)-(b.getDate()>1?1:0);
    let E=(B&&Cd)?insN(B,Cd):0; const bad=!!(B&&Cd&&(Cd<B||E<0)); if(E<=0) E=1;
    const F=bad?0:D/E;
    const inMonth=cd=>!bad&&B&&Cd&&cd>=B&&cd<Cd;
    const fm=insFact[x.id]||{};
    // регулярный платёж: дальше по плану — следующие циклы (с месяца после платежа до следующей даты)
    const rep_=Math.round(numOr(x.repeat,12)), cyc=[];
    if(!bad&&B&&Cd&&rep_>0){ let pay=Cd;
      for(let k=0;k<40;k++){ const nb=new Date(pay.getFullYear(),pay.getMonth()+1,1), np=addMonthsKD(pay,rep_); const e=Math.max(1,insN(nb,np));
        cyc.push([nb,np,D/e]); pay=np; if(np.getFullYear()*12+np.getMonth()>months[months.length-1]) break; } }
    const plan=colDates.map(cd=>{ if(inMonth(cd)) return F; const c=cyc.find(z=>cd>=z[0]&&cd<z[1]); return c?c[2]:0; });
    const used=plan.map((p,j)=>keys[j] in fm?fm[keys[j]]:p);
    const sched=[];
    if(B&&Cd&&!bad) for(let m=B.getFullYear()*12+B.getMonth(); sched.length<240; m++){ const cd=new Date(Math.floor(m/12),m%12,1); if(!(cd<Cd)) break; if(cd>=B) sched.push(m); }
    const sk=B?mKey(B.getFullYear()*12+B.getMonth()):'', saved=Object.keys(fm).filter(k=>!sk||k>=sk).reduce((a,k)=>a+fm[k],0);
    const paidOnce=rep_===0&&!!x.paid&&!!x.pay&&x.paid>=x.pay;
    const planToDate=sched.filter(m=>m<=curM).length*F;
    const hasCur=mKey(curM) in fm;
    const leftMonths=sched.filter(m=>m>curM||(m===curM&&!hasCur)).length;
    const left=Math.max(D-saved,0);
    const need=leftMonths?left/leftMonths:left;
    const status=paidOnce?'paid':bad?'bad':(D>0&&saved>=D-0.5)?'done':(planToDate===0&&saved===0)?'wait':(saved>=planToDate-0.5)?'ok':'behind';
    return {x,E,F,plan,used,sched,fm,saved,left,need,leftMonths,planToDate,pct:D?Math.min(1,saved/D):0,status,bad,rep:rep_,paidOnce};
  });

  // Подарки: сумма в месяц даты, каждый год
  const gifts=st.gifts.map(g=>{ const d=parseD(g.date), a=numOr(g.amount,0);
    return {g,res:colDates.map(cd=>(d&&d.getMonth()===cd.getMonth())?a:0)}; });

  // Инвестиции: «внесено» — по записям пополнений (+ плановые пополнения с текущего месяца);
  // доход: факт (купоны, проценты, дивиденды) или ожидаемый по ставке; при капитализации доход в бюджет не идёт
  const invFact=mapFacts(st.invFacts,'pos');
  const contribBy={};
  for(const c of st.invContribs||[]){ const v=numOr(c.amount,null), m=mIdx(c.date); if(v==null||m==null) continue; (contribBy[c.pos]||(contribBy[c.pos]=[])).push({m,v,c}); }
  const pos=st.invPositions.map(p=>{
    const r=numOr(p.rate,0)/100, sE=mIdx(p.start), sF=mIdx(p.end), per=Math.round(numOr(p.contribPeriod,0)), ca=numOr(p.contribAmount,0);
    const cl=(contribBy[p.id]||[]).slice().sort((a,b)=>a.m-b.m||String(a.c.date).localeCompare(b.c.date));
    const manual=m=>cl.reduce((s,x)=>s+(x.m===m?x.v:0),0);
    const sched=m=>per>0&&ca>0&&sE!=null&&m>=sE&&(sF==null||m<=sF)&&(m-sE)%per===0;
    const planned=m=>(m>=curM&&sched(m)&&!cl.some(x=>x.m===m))?ca:0;
    const contribIn=m=>manual(m)+planned(m);
    const open=m=>(sE==null||m>=sE)&&(sF==null||m<=sF);
    const fm=invFact[p.id]||{};
    // бумага с биржи: количество — по записям покупок, доход — купоны по графику биржи или ожидаемый дивиденд
    const ex=!!p.secid, q=ex?p.q:null;
    const qtyAt=k=>cl.reduce((s,x)=>s+(String(x.c.date)<=k?numOr(x.c.qty,0):0),0), qty=ex?qtyAt(nowK):0;
    const exInc=ex?exIncome(p,q,qtyAt,qty,nowK):[];
    // ПДС: государство доплачивает по соотношению (1:1, 1:2, 1:4), не больше 36 000 ₽ за год, 10 лет с первого взноса,
    // если за год внесли от 2 000 ₽; приходит в следующем году (в расчёте — в январе).
    // Налоговый вычет — 13% с пополнений до 400 000 ₽ за год; возвращается вам, в балансе — доход в мае следующего года.
    const ratio=numOr(p.pdsRatio,0)>0?1/numOr(p.pdsRatio,0):0, y0=cl.length?Math.floor(cl[0].m/12):(sE!=null?Math.floor(sE/12):null);
    const cYear=y=>{ let s=0; for(let m=y*12;m<y*12+12;m++) s+=contribIn(m); return s; };
    const coFinY=y=>(ratio>0&&y0!=null&&y>=y0&&y<y0+10&&cYear(y)>=2000)?Math.min(36000,cYear(y)*ratio):0;
    const taxY=y=>p.taxBack?Math.round(Math.min(400000,cYear(y))*0.13):0;
    let acc=cl.filter(x=>x.m<months[0]).reduce((s,x)=>s+x.v,0);
    const plan=[],capital=[],flowIn=[],flowOut=[];
    months.forEach(m=>{ const add=contribIn(m); acc+=add; if(ratio>0&&m%12===0) acc+=coFinY(Math.floor(m/12)-1);
      plan.push(ex?exInc.reduce((s,x)=>s+(x.m===m?x.v:0),0):(open(m)&&!p.reinvest)?acc*r/12:0);
      flowIn.push(p.flow?add:0);
      flowOut.push(((p.flow&&sF!=null&&m===sF)?acc:0)+((p.taxBack&&m%12===4)?taxY(Math.floor(m/12)-1):0));
      capital.push((sF!=null&&m>=sF)?0:acc); });
    const fact=keys.map(k=>k in fm?fm[k]:null);
    const used=plan.map((v,j)=>fact[j]!=null?fact[j]:v);
    const received=Object.values(fm).reduce((a,b)=>a+b,0);
    const invested=cl.filter(x=>x.m<=curM).reduce((s,x)=>s+x.v,0);
    // оценка стоимости, если руками не вписана: при капитализации — наращиваем по ставке, иначе = внесено
    let est=invested;
    if(p.reinvest&&cl.length){ let V=0; for(let m=cl[0].m; m<=curM; m++){ if(m>cl[0].m) V*=1+r/12; V+=manual(m); if(ratio>0&&m%12===0&&m>cl[0].m) V+=coFinY(Math.floor(m/12)-1); } est=V; }
    const vMan=numOr(p.value,null), closed=sF!=null&&curM>sF;
    const exVal=(q&&q.price!=null)?qty*q.price:null;
    const valueNow=closed?0:exVal!=null?exVal:(vMan!=null?vMan:est);
    const yearK=dkey(new Date(now.getFullYear()+1,now.getMonth(),now.getDate()));
    const monNow=ex?exInc.reduce((s,x)=>s+((x.d>nowK&&x.d<=yearK)?x.v:0),0)/12:(!p.reinvest&&open(curM))?invested*r/12:0;
    // расчёт к погашению: помесячно от сегодняшней стоимости, с плановыми пополнениями и доплатой государства
    let proj=null;
    if(sF!=null&&sF>curM){
      const cf=numOr(p.coFin,0); let V=valueNow+planned(curM), pay=0, fc=planned(curM), fs=0; const pm=[curM], pv=[V];
      for(let m=curM+1; m<=sF; m++){
        if(p.reinvest) V*=1+r/12; else pay+=V*r/12;
        const add=contribIn(m); V+=add; fc+=add;
        if(ratio>0){ if(m%12===0){ const g=coFinY(Math.floor(m/12)-1); V+=g; fs+=g; } }
        else if(cf&&sE!=null&&m%12===sE%12){ V+=cf; fs+=cf; }
        pm.push(m); pv.push(V);
      }
      proj={months:pm,values:pv,vEnd:V,payouts:pay,futureContrib:fc,futureState:fs,total:V+pay,income:V+pay+received-invested-fc-fs};
    }
    const progress=(sE!=null&&sF!=null&&sF>sE)?Math.max(0,Math.min(1,(curM-sE)/(sF-sE))):null;
    return {p,plan,fact,used,flowIn,flowOut,capital,received,fm,invested,est,valueNow,valueManual:vMan!=null||exVal!=null,
      ex,qty,avg:(ex&&qty>0)?invested/qty:null,quote:q,exInc,nkd:(q&&q.nkd&&!closed)?qty*q.nkd:0,
      dayChg:(exVal!=null&&q.chg!=null&&!closed)?exVal-exVal/(1+q.chg/100):0,
      result:closed?0:valueNow-invested,resultPct:(!closed&&invested)?(valueNow-invested)/invested:null,monNow,proj,progress,
      contribs:cl,monthsLeft:sF!=null?sF-curM:null,closed,
      pdsRows:(ratio>0||p.taxBack)&&y0!=null?Array.from({length:Math.max(0,Math.min(y0+9,Math.floor(curM/12)+1)-y0+1)},(_,i)=>({y:y0+i,c:cYear(y0+i),g:coFinY(y0+i),t:taxY(y0+i)})):[]};
  });
  const sumOpen=(ps,k)=>ps.reduce((s,r)=>s+(r.closed?0:r[k]),0);
  const groups=st.invGroups.map(g=>{ const ps=pos.filter(r=>r.p.group===g.id);
    return {g,pos:ps,invested:sumOpen(ps,'invested'),value:sumOpen(ps,'valueNow'),received:ps.reduce((s,r)=>s+r.received,0),mon:sumOpen(ps,'monNow')}; });

  const AL=st.settings.alloc;
  const al=(AL&&Array.isArray(AL.funds)&&AL.funds.length&&mIdx(AL.start)!=null)?{start:mIdx(AL.start),funds:AL.funds,fundIds:new Set(AL.funds.map(f=>f.id))}:null;
  const B=buildBal(months,rows,ins,gifts,pos,'used',al);
  const P=buildBal(months,rows,ins,gifts,pos,'plan',al);
  const T={}; for(const k in B) if(Array.isArray(B[k])&&typeof B[k][0]!=='object') T[k]=B[k].reduce((a,b)=>a+b,0);
  // фонды: сколько отложено, сколько потрачено (привязанные статьи, дни рождения, пополнения инвестиций, ручные траты), остаток
  const funds=al?al.funds.map((f,fi)=>{
    const amt=B.funds[fi].amt;
    const use=months.map((m,j)=>{ if(m<al.start) return 0; let u=0;
      rows.forEach(r=>{ if(r.it.fund===f.id) u+=r.used[j]; });
      if(f.gifts) gifts.forEach(g=>{ u+=g.res[j]; });
      if(f.kind==='save') (st.invContribs||[]).forEach(c=>{ if(mIdx(c.date)===m) u+=numOr(c.amount,0); });
      (st.fundSpend||[]).forEach(s=>{ if(s.fund===f.id&&mIdx(s.date)===m) u+=numOr(s.amount,0); });
      return u; });
    let acc=0; const balance=months.map((_,j)=>acc+=amt[j]-use[j]);
    return {f,amt,base:B.funds[fi].base,use,balance,items:st.items.filter(it=>it.fund===f.id)};
  }):[];
  // отложенное в фонды-накопления (ещё не вложенное) — тоже капитал
  if(funds.some(x=>x.f.kind==='save')) B.savings=B.savings.map((v,j)=>v+funds.reduce((s,x)=>s+(x.f.kind==='save'?x.balance[j]:0),0));
  for(const k of ['cum','savCum','capital','savings']) T[k]=B[k][B[k].length-1]||0;

  // Средние траты к плану — по месяцам, где введён факт (и которые уже наступили)
  const factMonths=new Set(Object.values(factMap).flatMap(o=>Object.keys(o)));
  const tracked=months.map((_,j)=>j).filter(j=>months[j]<=curM&&factMonths.has(keys[j]));
  // разовые статьи (периодичность 0) в среднем за месяц только искажают картину — не берём
  const avgRows=tracked.length?rows.filter(r=>TYPE_CAT[r.it.type]==='exp'&&Math.round(numOr(r.it.period,0))>0).map(r=>{
    const n=tracked.length;
    return {it:r.it,plan:tracked.reduce((s,j)=>s+r.plan[j],0)/n,fact:tracked.reduce((s,j)=>s+r.used[j],0)/n,entered:tracked.filter(j=>r.fact[j]!=null).length};
  }).filter(x=>Math.round(x.plan)||Math.round(x.fact)):[];

  // Финансовая цель
  const g=st.goal||{}, gS=parseD(g.start), gD=parseD(g.date), target=numOr(g.target,0);
  const gN=(gS&&gD)?Math.max(1,Math.min(240,datedifM(gS,gD)+1)):0;
  const gStart=mIdx(g.start), pace=gN?target/gN:0;
  const gfMap={}; for(const f of (st.goalFacts||[])){ const v=evalExpr(f.value); if(v!=null&&!isNaN(v)) gfMap[f.month]=v; }
  let gc=0; const goalRows=Array.from({length:gN},(_,k)=>{ const key=mKey(gStart+k), fv=gfMap[key]??null; gc+=fv||0;
    return {key,plan:pace,fact:fv,cum:gc,left:Math.max(target-gc,0),pct:target?gc/target:0}; });
  const goal={target,pace,n:gN,saved:gc,left:Math.max(target-gc,0),pct:target?Math.min(1,gc/target):0,rows:goalRows};

  return {curM,months,keys,rows,ins,gifts,pos,groups,B,P,T,coef,goal,avg:{tracked,rows:avgRows},al,funds};
}

/* Привычки: серии, проценты выполнения, недели */
function habitStats(h,done,today){
  const sched=d=>h.days[wd(d)]==='1';
  let created=parseD(h.created)||today;
  for(const k of done){ const d=parseD(k); if(d<created) created=d; }
  // день вне плана, в который всё-таки сделал, тоже засчитывается
  const on=d=>sched(d)||done.has(dkey(d));
  // не каждый день (пн, ср, пт): считается, сколько раз сделано, а не в какие дни — план «3 раза» выполнен 3 разами в любые дни
  const nDays=String(h.days||'').split('').filter(c=>c==='1').length, weekly=nDays>0&&nDays<7;
  const range=(from,to)=>{ let s=0,c=0,p=0,n=0; for(let d=from<created?created:from; d<=to; d=addDays(d,1)){ const dn=done.has(dkey(d)); if(sched(d)) p++; if(dn) n++; if(on(d)){ s++; if(dn) c++; } }
    if(weekly){ const k=Math.min(n,p); return {s:p,c:k,pct:p?k/p:null}; } return {s,c,pct:s?c/s:null}; };
  let cur=0, best=0, run=0;
  if(weekly){
    // неделя (пн–вс) засчитана, если сделано не меньше, чем запланировано; текущая неделя, пока не набрана, серию не рвёт
    const wk=ws=>{ let p=0,n=0; for(let k=0;k<7;k++){ const d=addDays(ws,k); if(d>=created&&sched(d)) p++; if(done.has(dkey(d))) n++; } return {p,n}; };
    const mon=addDays(today,-wd(today)), cm=addDays(created,-wd(created));
    for(let k=0, ws=mon; ws>=cm; k++, ws=addDays(ws,-7)){ const w=wk(ws); if(!w.p) continue; if(w.n>=w.p) cur++; else if(k) break; }
    for(let ws=cm; ws<=mon; ws=addDays(ws,7)){ const w=wk(ws); if(!w.p) continue; if(w.n>=w.p){ run++; if(run>best) best=run; } else if(ws<mon) run=0; }
  } else {
    let d=today;
    if(sched(d)&&!done.has(dkey(d))) d=addDays(d,-1);
    for(; d>=created; d=addDays(d,-1)){ if(!on(d)) continue; if(done.has(dkey(d))) cur++; else break; }
    for(let x=created; x<=today; x=addDays(x,1)){ if(!on(x)) continue; if(done.has(dkey(x))){ run++; if(run>best) best=run; } else if(dkey(x)!==dkey(today)) run=0; }
  }
  const weeks=[]; const mon=addDays(today,-wd(today));
  for(let k=11; k>=0; k--){ const ws=addDays(mon,-7*k), we=addDays(ws,6); weeks.push(Object.assign({start:ws},range(ws,we>today?today:we))); }
  return {created,sched,weekly,cur,best,total:done.size,d7:range(addDays(today,-6),today),d30:range(addDays(today,-29),today),all:range(created,today),weeks};
}

function parseConnect(s){ const m=/#connect=([A-Za-z0-9+\/=_-]+)/.exec(String(s||'')); if(!m) return null;
  try{ const [url,key]=atob(m[1].replace(/-/g,'+').replace(/_/g,'/')).split('|'); return GAS_URL_RE.test(url)&&key?{url,key}:null; }catch(e){ return null; } }

  if(rc) try{ localStorage.setItem(RC_KEY,JSON.stringify(rc)); }catch(e){}
  history.replaceState(null,'',location.pathname+location.search); })();

function server(fn,arg){

    .then(r=>{ if(!r.ok) throw new Error('скрипт ответил '+r.status); return r.text(); })
    .then(t=>{ let j; try{ j=JSON.parse(t); }catch(e){ throw new Error(/<html/i.test(t)?'скрипт не открыт для всех или ссылка неверная':'непонятный ответ скрипта'); }

function gsSetTok(t,sec){ GTOK={t,exp:Date.now()+sec*1000}; try{ localStorage.setItem(GTOK_KEY,JSON.stringify(GTOK)); }catch(e){} }
function gsDropTok(){ GTOK=null; try{ localStorage.removeItem(GTOK_KEY); }catch(e){} }
// вернулись со страницы входа Google: #access_token=…&expires_in=…&state=… или #error=…
(function(){ const h=location.hash; if(!/^#.*\b(access_token|error)=/.test(h)) return;
  const p=new URLSearchParams(h.slice(1)); let st=null;

function gsRedirect(o){
  const n=Math.random().toString(36).slice(2)+Date.now().toString(36);
  try{ localStorage.setItem(GAUTH_KEY,JSON.stringify({n,first:!!o.first,action:LAUNCH||''})); if(!o.interactive) localStorage.setItem(GAUTO_KEY,String(Date.now())); }catch(e){}
  if(REMOTE) keepLocal();

  if(o.first) q.set('prompt','select_account'); else if(!o.interactive) q.set('prompt','none');
  if(!o.first&&REMOTE&&REMOTE.email) q.set('login_hint',REMOTE.email);
  location.assign('https://accounts.google.com/o/oauth2/v2/auth?'+q);
  return new Promise(()=>{});
}

function gsAutoOk(){ let last=0; try{ last=+localStorage.getItem(GAUTO_KEY)||0; }catch(e){}

/* Пропуск для запросов к Google. interactive — можно показать окно входа. */
function gsAuth(interactive){
  if(GTOK&&GTOK.exp>Date.now()+60000) return Promise.resolve(GTOK.t);
  const email=REMOTE&&REMOTE.g?REMOTE.email||'':'';
  if(NATIVE){
    if(typeof NATIVE.googleAuth!=='function') return Promise.reject(new Error('обновите приложение — вход через Google есть в новой версии'));
    return new Promise((res,rej)=>{ const q=gsAuth.q||(gsAuth.q=[]); q.push([res,rej]); if(q.length>1) return;
      window.__gauth=j=>{ const w=gsAuth.q; gsAuth.q=[]; let o={}; try{ o=JSON.parse(j); }catch(e){}
        if(o.token){ gsSetTok(o.token,3000); w.forEach(x=>x[0](o.token)); }
        else { const e=o.error==='need'?gsNeed():new Error(o.error||'вход не удался'); w.forEach(x=>x[1](e)); } };
      try{ NATIVE.googleAuth(!!interactive,email); }catch(e){ window.__gauth(JSON.stringify({error:errText(e)})); } });
  }
  if(interactive||gsAutoOk()) return gsRedirect({interactive});
  return Promise.reject(gsNeed());
}
/* Запрос к Google с пропуском. Пропуск отозван (401) — один раз берём новый. */
async function gsApi(url,o={},again){
  const tok=await gsAuth(false);
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),60000);
  let r;
  try{ r=await fetch(/^https:/.test(url)?url:SHEETS_API+'/'+REMOTE.sheet+url,{method:o.method||'GET',signal:ctl.signal,cache:'no-store',
      headers:Object.assign({Authorization:'Bearer '+tok},o.body?{'Content-Type':'application/json'}:{}),body:o.body?JSON.stringify(o.body):undefined}); }
  catch(e){ throw e&&e.name==='AbortError'?new Error('Google не ответил за минуту'):new Error('нет связи'); }
  finally{ clearTimeout(t); }
  if(r.status===401&&!again){ gsDropTok(); return gsApi(url,o,true); }
  if(r.status===204) return {};
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const m=j&&j.error&&(j.error.message||j.error.status)||('Google ответил ошибкой '+r.status);
    if(r.status===404) throw new Error('таблица «'+GS_TITLE+'» не найдена на Диске — выйдите и войдите заново');
    const e=new Error(m); e.status=r.status; throw e; }
  return j||{};
}

const GS_FMT={n:{type:'NUMBER',pattern:'#,##0.##'},d:{type:'DATE',pattern:'dd.mm.yyyy'},s:{type:'TEXT',pattern:'@'}};
const gsFmt=t=>GS_FMT[t]||GS_FMT.s;
const gsQ=s=>"'"+String(s).replace(/'/g,"''")+"'";
const gsCol=n=>{ let s=''; for(n=n;n>0;n=Math.floor((n-1)/26)) s=String.fromCharCode(65+(n-1)%26)+s; return s; };
const gsDay=v=>{ const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); };
function gsDate(v){
  if(typeof v==='number') return v>0?gsDay(v):'';
  const s=String(v==null?'':v).trim(); let m=/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/.exec(s);
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s); return m?m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'):'';
}
// ячейка → значение (как readCell_ в Code.gs). Формулу, вписанную руками (=715+600), в тексте читаем как выражение
function gsCell(v,t){
  const f=typeof v==='string'&&v[0]==='=';
  if(t==='d') return gsDate(v);
  if(t==='b') return v===true||String(v==null?'':v).trim().toLowerCase()==='да';
  if(t==='j'){ if(v===''||v==null) return null; try{ return JSON.parse(String(v)); }catch(e){ return null; } }
  if(v===''||v==null) return t==='n'?null:'';
  if(t==='n'){ if(typeof v==='number') return v; let x=null; try{ x=evalExpr(v); }catch(e){} return x==null||!isFinite(x)?null:x; }
  if(t==='m'){ if(typeof v==='number') return gsDay(v).slice(0,7); const m=/^(\d{4})-(\d{1,2})/.exec(String(v)); return m?m[1]+'-'+m[2].padStart(2,'0'):String(v); }
  if(f) return v.slice(1);
  return typeof v==='boolean'?(v?'да':''):String(v);
}
// значение → ячейка (как writeCell_ в Code.gs): дата — номером дня, без часовых поясов
function gsOut(v,t){
  if(t==='b') return v?'да':'';
  if(t==='j') return v==null?'':JSON.stringify(v);
  if(v==null||v==='') return '';
  if(t==='n') return isNaN(+v)?'':+v;
  if(t==='d'){ const p=String(v).split('-').map(Number); return p[0]?(Date.UTC(p[0],(p[1]||1)-1,p[2]||1)-Date.UTC(1899,11,30))/864e5:''; }
  return String(v);
}
const gsCD=(v,t)=>{ const c={userEnteredFormat:{numberFormat:gsFmt(t)}};
  if(typeof v==='number') c.userEnteredValue={numberValue:v}; else if(v!=='') c.userEnteredValue={stringValue:v}; return c; };
const GS_HEAD={textFormat:{bold:true,foregroundColor:{red:1,green:1,blue:1}},backgroundColor:{red:0x1f/255,green:0x38/255,blue:0x64/255}};
// листы таблицы: название → {id, rows, cols}
async function gsMeta(fresh){
  if(gsMeta.c&&gsMeta.c.sheet===REMOTE.sheet&&!fresh) return gsMeta.c.m;
  const r=await gsApi('?fields=sheets.properties(sheetId,title,gridProperties(rowCount,columnCount))'), m={};
  (r.sheets||[]).forEach(s=>{ const p=s.properties, g=p.gridProperties||{}; m[p.title]={id:p.sheetId,rows:g.rowCount||0,cols:g.columnCount||0}; });
  gsMeta.c={sheet:REMOTE.sheet,m}; return m;
}
async function gsLoad(){
  const m=await gsMeta(true);
  if(!m[GS_SCHEMA[0].sheet]) return '';
  const tabs=GS_SCHEMA.filter(t=>m[t.sheet]), set=!!m[GS_SETTINGS_SHEET];
  const ranges=tabs.map(t=>gsQ(t.sheet)+'!A2:'+gsCol(t.cols.length)); if(set) ranges.push(gsQ(GS_SETTINGS_SHEET)+'!A2:C');
  const r=await gsApi('/values:batchGet?'+ranges.map(x=>'ranges='+encodeURIComponent(x)).join('&')+'&valueRenderOption=FORMULA&dateTimeRenderOption=SERIAL_NUMBER');
  const vr=r.valueRanges||[], data={version:1,settings:{},goal:{}};
  GS_SCHEMA.forEach(t=>{ data[t.key]=[]; });
  tabs.forEach((t,i)=>((vr[i]||{}).values||[]).forEach(row=>{ if(!row.some(v=>v!==''&&v!=null)) return;
    const rec={}; t.cols.forEach((c,j)=>{ rec[c[0]]=gsCell(row[j],c[2]); }); data[t.key].push(rec); }));
  if(set) ((vr[tabs.length]||{}).values||[]).forEach(row=>{ const def=GS_SETTINGS.find(s=>s[0]===row[0]); if(!def) return;
    const p=def[0].split('.'), v=gsCell(row[2],def[2]); if(p.length===1) data[p[0]]=v; else data[p[0]][p[1]]=v; });
  return JSON.stringify(data);
}
// запись листов одним пакетом (всё или ничего): размер листа, очистка значений, шапка, строки
function gsSheetReqs(m,name,header,rows,reqs){
  let s=m[name]; const need=rows.length+1, w=header.length;
  if(!s){ let id; do{ id=1+Math.floor(Math.random()*2e9); }while(Object.values(m).some(x=>x.id===id));
    s=m[name]={id,rows:Math.max(need+50,100),cols:w};
    reqs.push({addSheet:{properties:{sheetId:id,title:name,gridProperties:{rowCount:s.rows,columnCount:w,frozenRowCount:1}}}}); }
  else { s.rows=Math.max(s.rows,need+20); s.cols=Math.max(s.cols,w);
    reqs.push({updateSheetProperties:{properties:{sheetId:s.id,gridProperties:{rowCount:s.rows,columnCount:s.cols,frozenRowCount:1}},fields:'gridProperties.rowCount,gridProperties.columnCount,gridProperties.frozenRowCount'}}); }
  reqs.push({updateCells:{range:{sheetId:s.id},fields:'userEnteredValue'}});
  reqs.push({updateCells:{start:{sheetId:s.id,rowIndex:0,columnIndex:0},fields:'userEnteredValue,userEnteredFormat.textFormat,userEnteredFormat.backgroundColor',
    rows:[{values:header.map(h=>({userEnteredValue:{stringValue:h},userEnteredFormat:GS_HEAD}))}]}});
  if(rows.length) reqs.push({updateCells:{start:{sheetId:s.id,rowIndex:1,columnIndex:0},fields:'userEnteredValue,userEnteredFormat.numberFormat',rows}});
}
async function gsSave(json,again){
  const msg=JSON.parse(json), data=msg.data||msg, keys=msg.keys||null, want=k=>!keys||keys.includes(k);
  const m=await gsMeta(again), reqs=[];
  GS_SCHEMA.forEach(t=>{ if(!want(t.key)) return;
    gsSheetReqs(m,t.sheet,t.cols.map(c=>c[1]),(data[t.key]||[]).map(rec=>({values:t.cols.map(c=>gsCD(gsOut(rec[c[0]],c[2]),c[2]))})),reqs); });
  if(['version','settings','goal','trainActive'].some(want))
    gsSheetReqs(m,GS_SETTINGS_SHEET,['Ключ (не менять)','Что это','Значение'],GS_SETTINGS.map(s=>{ const p=s[0].split('.'), v=p.length===1?data[p[0]]:(data[p[0]]||{})[p[1]];
      return {values:[gsCD(s[0],'s'),gsCD(s[1],'s'),gsCD(gsOut(v,s[2]),s[2])]}; }),reqs);
  if(!reqs.length) return 'ok';
  try{ await gsApi(':batchUpdate',{method:'POST',body:{requests:reqs}}); }
  catch(e){ gsMeta.c=null; if(e.status===400&&!again) return gsSave(json,true); throw e; } // лист удалили или переименовали руками
  return 'ok';
}
function gsServer(fn,arg){
  if(fn==='ping') return Promise.resolve('ok');
  if(fn==='loadState') return gsLoad().then(r=>{ gsBackup().catch(()=>{}); return r; });
  if(fn==='saveState') return gsSave(arg);
  return Promise.reject(new Error('без скрипта эта функция недоступна'));
}
/* Раз в неделю — копия таблицы в папку на Диске, хранятся 3 последние (старые — в корзину). */
async function gsBackup(){
  let last=0; try{ last=+localStorage.getItem(GBK_KEY)||0; }catch(e){}
  if(Date.now()-last<7*864e5) return;
  const q=s=>DRIVE_API+'?q='+encodeURIComponent(s)+'&spaces=drive&fields=files(id)';
  let f=((await gsApi(q("name='"+GS_BK_FOLDER+"' and mimeType='application/vnd.google-apps.folder' and trashed=false"))).files||[])[0];
  if(!f) f=await gsApi(DRIVE_API+'?fields=id',{method:'POST',body:{name:GS_BK_FOLDER,mimeType:'application/vnd.google-apps.folder'}});
  await gsApi(DRIVE_API+'/'+REMOTE.sheet+'/copy?fields=id',{method:'POST',body:{name:GS_TITLE+' — копия '+dRu(todayK()),parents:[f.id]}});
  try{ localStorage.setItem(GBK_KEY,String(Date.now())); }catch(e){}
  const old=((await gsApi(q("'"+f.id+"' in parents and trashed=false")+'&orderBy=createdTime%20desc')).files||[]).slice(3);
  for(const x of old) await gsApi(DRIVE_API+'/'+x.id+'?fields=id',{method:'PATCH',body:{trashed:true}});
}

    id=(await gsApi(SHEETS_API,{method:'POST',body:{properties:{title:GS_TITLE,locale:'ru_RU',timeZone:tz},sheets:[{properties:{title:GS_SETTINGS_SHEET}}]}})).spreadsheetId; made=true; }
  const rc={g:1,sheet:id,email:u.email||''};
  try{ if(S) localStorage.setItem('moyplan.backup.local.v1',JSON.stringify(S)); if(REMOTE&&!REMOTE.g) localStorage.setItem('moyplan.remote.old.v1',JSON.stringify(REMOTE));
    localStorage.setItem(RC_KEY,JSON.stringify(rc)); localStorage.removeItem(PEND_KEY); }catch(e){}
  REMOTE=rc; gsMeta.c=null; clearTimeout(saveTimer); dirtyAll=false; dirtyKeys.clear(); canSave=true;

  hideWelcome(); await pullRemote(); nativeSync();
