function newTask(name,goal,project){
  const due=goal?'':UI.qaDue==='today'?todayK():UI.qaDue==='tomorrow'?dkey(addDays(TODAY(),1)):'';
  return {id:uid(),name,note:'',due,priority:'0',repeat:'none',repeatDays:'',times:1,timesDone:0,goal:goal||'',project:project||'',checklist:[],done:false,doneAt:'',created:todayK(),part:''};
}
function taskOk(){
  const t=curTask(); if(!t||!UI.page.isNew) return false;
  const nm=$view.querySelector('[data-tf="name"]'), note=$view.querySelector('[data-tf="note"]');
  if(nm) t.name=nm.value.trim(); if(note) t.note=note.value;
  if(!t.name){ toast('Напишите, что сделать'); if(nm) nm.focus(); return false; }
  alignTask(t); S.tasks.push(t); UI.draft=null; persist('tasks');
  toast('Задача добавлена · '+(t.project&&projById(t.project)?projName(t.project):'без проекта'));
  UI.page=null; return true;
}
function tickTask(id,k){
  const t=S.tasks.find(x=>x.id===id); if(!t) return;
  const n=t.times||1; if(n<=1||t.done){ toggleTask(id); return; }
  const d=Math.min(n,t.timesDone||0);
  t.timesDone=k==null?d+1:(+k<d?d-1:d+1);
  if(t.timesDone>=n){ toggleTask(id); return; }
  persist('tasks'); render(); if(t.timesDone>d) buzz(false);
}
function addTask(name,goal,project){ const t=newTask(name,goal,project); S.tasks.push(t); persist('tasks'); return t; }
// следующая повторяющаяся: крайний срок сдвигается на столько же, на сколько дата выполнения
function nextDeadline(t,nd){ if(!t.deadline) return ''; if(!t.due) return nextDue(t.deadline,t.repeat,t.repeatDays);
  return dkey(addDays(parseD(t.deadline),Math.round((parseD(nd)-parseD(t.due))/864e5))); }
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id); if(!t) return;
  if(!t.done){
    t.done=true; t.doneAt=todayK(); t.timesDone=t.times||1;
    (t.checklist||[]).forEach(c=>{ if(c.k&&!c.done){ c.done=true; shopTick(c); } });
    if(t.repeat&&t.repeat!=='none'){ const nd=nextDue(t.due,t.repeat,t.repeatDays), n=Object.assign({},t,{id:uid(),done:false,doneAt:'',timesDone:0,due:nd,deadline:nextDeadline(t,nd),created:todayK(),checklist:(t.checklist||[]).map(c=>({id:uid(),text:c.text,done:false}))});
      S.tasks.push(n); toast('Готово. Следующая — '+dayLabel(n.due||n.deadline).toLowerCase()); }
    else toast('Готово');
    persist('tasks'); render(); cheer(allTasksDone()); return;
  } else { t.done=false; t.doneAt=''; t.timesDone=Math.max(0,(t.times||1)-1); }
  persist('tasks'); render();
}

const AREAS=['Здоровье','Финансы','Карьера','Семья','Развитие','Отдых','Другое'];
function goalProg(g){
  const tgt=numOr(g.target,0);
  if(tgt>0){ const c=numOr(g.current,0); return {pct:Math.min(1,c/tgt),text:fmt(c)+' из '+fmt(tgt)+(g.unit?' '+esc(g.unit):'')}; }
  const st=S.goalSteps.filter(s=>s.goal===g.id); if(st.length){ const d=st.filter(s=>s.done).length; return {pct:d/st.length,text:d+' из '+st.length+' '+plural(st.length,'шага','шагов','шагов')}; }
  const ts=S.tasks.filter(t=>t.goal===g.id); if(ts.length){ const d=ts.filter(t=>t.done).length; return {pct:d/ts.length,text:d+' из '+ts.length+' задач'}; }
  return {pct:g.status==='done'?1:0,text:'добавьте шаги'};
}
const SMART=[['S','Конкретно','specific','Что именно я сделаю?'],['M','Измеримо','measure','Как пойму, что цель достигнута?'],['A','Достижимо','achievable','За счёт чего, какие ресурсы и время?'],['R','Значимо','why','Зачем это мне?'],['T','Срок','deadline','К какой дате?']];
function smartParts(g){ return SMART.map(([L,title,k,q])=>{
  let txt=String(g[k]||'').trim();
  if(L==='M'&&numOr(g.target,0)>0) txt=(txt?txt+'\n':'')+'Число: '+fmt(numOr(g.target,0))+(g.unit?' '+g.unit:'');
  if(L==='T'&&g.deadline) txt=dRu(g.deadline);
  return {L,title,q,txt}; }); }
const smartScore=g=>smartParts(g).filter(p=>p.txt).length;
function deadlineText(g){
  if(!g.deadline) return 'без срока';
  const n=daysTo(g.deadline);
  return 'до '+dRu(g.deadline)+(g.status==='done'?'':n<0?' · <span class="neg">срок прошёл</span>':' · осталось '+n+' '+plural(n,'день','дня','дней'));
}

/* рецепты: продукты строками «Название — количество»; «Хочу приготовить» — чек-лист в проекте «Список покупок» */
const pkey=x=>String(x||'').toLowerCase().replace(/ё/g,'е').replace(/[«»"'().,;:!?*]/g,' ').replace(/\s+/g,' ').trim();
const capF=x=>{ x=String(x||'').trim(); return x?x[0].toUpperCase()+x.slice(1):x; };
const QTY_RE=/(\d|½|¼|¾|по вкусу|щепотк|пучок|зубчик|горст|стакан|ложк)/i;
function parseIng(line){
  const x=String(line||'').replace(/^[\s•\-–—*·]+/,'').replace(/\s+/g,' ').trim(); if(!x) return null;
  let m=/^(.+?)\s+[—–-]\s+(.+)$/.exec(x)||/^(.+?):\s*(.+)$/.exec(x);
  if(!m){ const i=x.lastIndexOf(', '); if(i>0&&QTY_RE.test(x.slice(i+2))) m=[x,x.slice(0,i),x.slice(i+2)]; }
  if(!m) m=/^(.+?)\s+((?:\d[\d.,/]*|½|¼|¾)\s*[^\d]*)$/.exec(x);
  return m?{name:capF(m[1]),qty:m[2].trim()}:{name:capF(x),qty:''};
}
const recIngs=r=>String(r.ingredients||'').split('\n').map(parseIng).filter(Boolean);
const prodBy=name=>{ const k=pkey(name); return S.pantry.find(x=>pkey(x.name)===k); };
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'#';
function shopProject(){ let pr=S.projects.find(x=>!x.parent&&/^список покупок$/i.test(String(x.name).trim())); if(!pr){ pr={id:uid(),name:'Список покупок',parent:'',created:todayK()}; S.projects.push(pr); } return pr; }
// количество: «2 шт», «500 г», «1,5 кг», «200 мл» → {n, u}; кг и л переводятся в г и мл
const UNITS=[[/^(кг|килограм)/,'g',1000],[/^(г|гр|грам)/,'g',1],[/^(л|литр)/,'ml',1000],[/^(мл|миллилитр)/,'ml',1],[/^(шт|штук)/,'pc',1],
  [/^(уп|упаков|пачк)/,'pack',1],[/^(ст\.?\s*л|столов)/,'tbsp',1],[/^(ч\.?\s*л|чайн)/,'tsp',1],[/^(стакан)/,'cup',1],[/^(зубч)/,'clove',1],[/^(пуч)/,'bunch',1],[/^(бут)/,'bottle',1],[/^(бан)/,'jar',1]];
const UNIT_TXT={pc:'шт',pack:'уп.',tbsp:'ст. л.',tsp:'ч. л.',cup:'стак.',clove:'зубч.',bunch:'пуч.',bottle:'бут.',jar:'бан.'};
function parseQty(x){
  const m=/^(\d+(?:[.,]\d+)?(?:\/\d+)?|½|¼|¾)\s*(.*)$/.exec(String(x||'').toLowerCase().trim()); if(!m) return null;
  const a=m[1].replace(',','.'), n=a==='½'?.5:a==='¼'?.25:a==='¾'?.75:a.includes('/')?(+a.split('/')[0])/(+a.split('/')[1]||1):+a;
  if(!(n>0)) return null; const rest=m[2].replace(/^[-–—]\s*\d.*$/,'').trim(); if(!rest) return {n,u:'pc'};
  for(const [re,u,k] of UNITS) if(re.test(rest)) return {n:n*k,u};
  return {n,u:rest.split(/[\s.]/)[0]};
}
const numTxt=n=>String(Math.round(n*100)/100).replace('.',',');
function qtyStr(q){ if(!q||q.u==null) return ''; const {n,u}=q;
  if(u==='g') return n>=1000?numTxt(n/1000)+' кг':numTxt(n)+' г'; if(u==='ml') return n>=1000?numTxt(n/1000)+' л':numTxt(n)+' мл';
  return numTxt(n)+' '+(UNIT_TXT[u]||u); }
// сколько нужно каждого продукта на все блюда из «Хочу приготовить»
function needMap(){ const m={};
  S.recipes.filter(r=>r.planned).forEach(r=>recIngs(r).forEach(gi=>{ const k=pkey(gi.name), q=parseQty(gi.qty), e=m[k]||(m[k]={name:gi.name,n:0,u:null,mixed:false,recipes:[]});
    if(!e.recipes.includes(r.name)) e.recipes.push(r.name);
    if(q){ if(e.u==null||e.u===q.u){ e.u=q.u; e.n+=q.n; } else e.mixed=true; } }));
  return m; }
// чего не хватает: null — хватает (или сравнить нельзя), {all:true} — продукта нет, {n,u} — докупить столько
function shortage(x,nm){
  if(!x||!x.have) return {all:true};
  if(!nm||nm.u==null||nm.mixed) return null;
  const h=parseQty(x.qty); if(!h||h.u!==nm.u) return null;
  return h.n>=nm.n-1e-9?null:{n:nm.n-h.n,u:nm.u};
}
function covered(k,NM){ return !shortage(S.pantry.find(y=>pkey(y.name)===k),(NM||needMap())[k]); }
function planRecipe(r){
  const ings=recIngs(r); if(!ings.length){ toast('Сначала впишите продукты рецепта'); return false; }
  const pr=shopProject(); let t=r.task&&S.tasks.find(x=>x.id===r.task&&!x.done);
  if(!t){ t=newTask('Купить для: '+(r.name||'блюда'),'',pr.id); t.due=''; S.tasks.push(t); r.task=t.id; }
  t.name='Купить для: '+(r.name||'блюда'); r.planned=true;
  ings.forEach(gi=>{ if(!prodBy(gi.name)) S.pantry.push({id:uid(),name:gi.name,have:false,qty:''}); });
  t.checklist=ings.map(gi=>({id:uid(),text:gi.name+(gi.qty?' — '+gi.qty:''),done:false,k:pkey(gi.name)}));
  syncShop(); persist('recipes','tasks','projects','pantry'); return true;
}
// приготовили: из наличия уходит столько, сколько в рецепте (бекона было 4 шт, в рецепте 2 — останется 2)
function consumeRecipe(r){ const used=[], gone=[];
  recIngs(r).forEach(gi=>{ const x=prodBy(gi.name); if(!x||!x.have) return; const q=parseQty(gi.qty), hv=parseQty(x.qty);
    if(!q||!hv||q.u!==hv.u) return;
    const rest=hv.n-q.n; used.push(x.name);
    if(rest<=1e-9){ S.pantry=S.pantry.filter(y=>y!==x); gone.push(x.name); } else x.qty=qtyStr({n:rest,u:hv.u}); });
  if(used.length) persist('pantry');
  return {used,gone}; }
function unplanRecipe(r,cooked){
  const t=r.task&&S.tasks.find(x=>x.id===r.task);
  if(t&&!t.done){ if(cooked){ t.done=true; t.doneAt=todayK(); t.timesDone=t.times||1; } else S.tasks=S.tasks.filter(x=>x!==t); }
  r.planned=false; r.task=''; persist('recipes','tasks'); syncShop();
}
// галочки во всех открытых списках покупок — по тому, хватает ли продукта на все запланированные блюда
function syncShop(){ const NM=needMap(); let ch=false;
  S.tasks.forEach(t=>{ if(t.done) return; (t.checklist||[]).forEach(c=>{ if(!c.k) return; const v=covered(c.k,NM); if(c.done!==v){ c.done=v; ch=true; } }); });
  if(ch) persist('tasks'); }
// купил (или пополнил) продукт: в наличии, и количества теперь хватает на все блюда
function stockUp(x){ x.have=true; const nm=needMap()[pkey(x.name)], sh=shortage(x,nm); if(sh&&!sh.all) x.qty=qtyStr(nm);
  else if(!String(x.qty||'').trim()&&nm&&nm.u!=null&&!nm.mixed) x.qty=qtyStr(nm); }
// отметка в списке покупок: отметил — купил нужное; снял — продукта нет
function shopTick(c){ if(!c||!c.k) return; let x=S.pantry.find(y=>pkey(y.name)===c.k);
  if(!x){ x={id:uid(),name:capF(String(c.text).split(' — ')[0]),have:false,qty:''}; S.pantry.push(x); }
  if(c.done) stockUp(x); else x.have=false;
  persist('pantry'); syncShop(); }
function recIngsHtml(r){ const L=recIngs(r), NM=needMap();

    const tail=ok?(x&&x.qty?'есть: '+esc(x.qty):'есть'):sh.all?'нет дома':'дома '+esc(x.qty)+', не хватает '+qtyStr(sh);

// импорт рецепта: разметка Recipe (JSON-LD) или микроразметка itemprop
const deEnt=x=>String(x||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/g,' ').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&laquo;/g,'«').replace(/&raquo;/g,'»').replace(/&mdash;/g,'—').replace(/&ndash;/g,'–').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
function parseRecipeHtml(html,url){
  const out={name:'',ingredients:[],steps:[],servings:'',kcal:null,url:url||''};
  for(const m of String(html||'').matchAll(/<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/gi)){
    let j; try{ j=JSON.parse(m[1].trim()); }catch(e){ continue; }
    const st=[j]; while(st.length){ const o=st.shift(); if(!o||typeof o!=='object') continue; if(Array.isArray(o)){ st.push(...o); continue; }
      if(o['@graph']) st.push(...[].concat(o['@graph']));
      if([].concat(o['@type']||[]).includes('Recipe')){
        out.name=deEnt(o.name); out.ingredients=[].concat(o.recipeIngredient||o.ingredients||[]).map(deEnt).filter(Boolean);
        out.steps=[].concat(o.recipeInstructions||[]).flatMap(x=>typeof x==='string'?[x]:(x&&x.itemListElement)?[].concat(x.itemListElement).map(y=>y&&(y.text||y.name)||''):[x&&(x.text||x.name)||'']).map(deEnt).filter(Boolean);
        out.servings=deEnt([].concat(o.recipeYield||[])[0]||'').replace(/[^\d]/g,'')||'';
        const cal=o.nutrition&&o.nutrition.calories; if(cal) out.kcal=parseFloat(String(cal).replace(',','.'))||null;
        if(out.ingredients.length) return out; } } }
  if(typeof DOMParser==='undefined') return null;
  const doc=new DOMParser().parseFromString(String(html||''),'text/html');
  const ings=[...doc.querySelectorAll('[itemprop="recipeIngredient"],[itemprop="ingredients"]')].map(e=>deEnt(e.textContent)).filter(Boolean);
  if(!ings.length) return null;
  const h1=doc.querySelector('[itemtype*="Recipe"] [itemprop="name"]')||doc.querySelector('h1');
  out.name=deEnt(h1?h1.textContent:doc.title); out.ingredients=ings;
  out.steps=[...doc.querySelectorAll('[itemprop="recipeInstructions"]')].map(e=>deEnt(e.textContent)).filter(Boolean);
  return out;
}
function recipeFromText(t){
  const L=String(t||'').split('\n').map(x=>x.trim()).filter(Boolean); if(!L.length) return null;
  const iH=L.findIndex(x=>/^ингредиент|^продукт|^состав/i.test(x)), iS=L.findIndex(x=>/^(приготовлени|способ|шаг|рецепт приготовления)/i.test(x));
  const name=(iH===0?'':L[0]).replace(/[:.]$/,'');
  let ings, steps;
  if(iH>=0){ ings=L.slice(iH+1,iS>iH?iS:undefined); steps=iS>iH?L.slice(iS+1):[]; }
  else { const body=L.slice(1); ings=body.filter(x=>QTY_RE.test(x)||/ [—–-] /.test(x)); steps=iS>=0?L.slice(iS+1):body.filter(x=>!ings.includes(x)); }
  return {name:name||'Рецепт',ingredients:ings.filter(x=>x.length<120),steps,servings:'',kcal:null,url:''};
}

function noteCmd(cmd,val){

const PREPEAT=[['monthly','Каждый месяц'],['weekly','Каждую неделю'],['2weeks','Раз в 2 недели'],['quarterly','Раз в квартал'],['yearly','Раз в год'],['once','Один раз']];

// даты платежа в промежутке [fromK, toK]
function payDates(p,fromK,toK){
  const s0=parseD(p.start); if(!s0) return [];
  const from=parseD(fromK), to=parseD(toK), until=p.until?parseD(p.until):null, out=[];
  if(p.repeat==='once'){ const k=dkey(s0); return (k>=fromK&&k<=toK&&(!until||s0<=until))?[k]:[]; }
  const days={weekly:7,'2weeks':14}[p.repeat], mon={quarterly:3,yearly:12}[p.repeat]||1;
  let i=0;
  if(from>s0) i=days?Math.max(0,Math.floor((from-s0)/864e5/days)-1):Math.max(0,Math.floor(((from.getFullYear()-s0.getFullYear())*12+from.getMonth()-s0.getMonth())/mon)-1);
  for(let g=0; g<800; g++,i++){ const d=days?addDays(s0,i*days):addMonthsKD(s0,i*mon);
    if(d>to||(until&&d>until)) break; if(d>=from) out.push(dkey(d)); }
  return out;
}

function payDue(){ const tk=TODAY(); return payOcc(dkey(addDays(tk,-62)),dkey(addDays(tk,7))).filter(o=>!o.paid&&o.due>=(o.p.created||'')&&daysTo(o.due)<=numOr(o.p.remind,3)); }
function payNext(p){ const t=TODAY(), l=payDates(p,dkey(addDays(t,-62)),dkey(addDays(t,400)));
  return l.find(d=>d>=(p.created||'')&&!payPaid(p,d))||l.find(d=>d>=todayK())||null; }

function factAdd(item,month,amt){ const f=S.facts.find(x=>x.item===item&&x.month===month), cur=f?String(f.value||'').trim():''; setListFact(S.facts,'item',item,month,cur?cur+'+'+amt:String(amt)); }
function factRemove(item,month,amt){ const f=S.facts.find(x=>x.item===item&&x.month===month); if(!f) return false; const t=factTerms(f.value); if(!t) return false;
  const k=t.indexOf(amt); if(k<0) return false; const tg=factTagList(f,t.length); t.splice(k,1); tg.splice(k,1); setListFact(S.facts,'item',item,month,t.join('+'));

  const unit=f==='weight'?'кг':f==='time'?'сек':'повт.';
  openSheet(`<h2>${esc(exName(it))} · подход ${+si+1}</h2><p class="hint" style="margin-top:-8px">Прокрутите до нужного числа${ph!==''&&ph!=null?' · в прошлый раз '+esc(ph):''}</p>

/* ---- таймер отдыха и подхода, звук, экран не гаснет ---- */
let TM=null, AC=null, WL=null;
function unlockAudio(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function beep(){
  try{ unlockAudio(); [0,0.28,0.56].forEach(t=>{ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=880; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(0.0001,AC.currentTime+t); g.gain.exponentialRampToValueAtTime(0.3,AC.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t+0.22);
    o.start(AC.currentTime+t); o.stop(AC.currentTime+t+0.24); }); }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
}
async function keepAwake(on){
  try{ if(on&&!WL&&navigator.wakeLock){ WL=await navigator.wakeLock.request('screen'); WL.addEventListener('release',()=>{ WL=null; }); }
    else if(!on&&WL){ const w=WL; WL=null; await w.release(); } }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&S&&S.trainActive) keepAwake(true); });
function startTimer(o){ unlockAudio(); TM=Object.assign({start:Date.now()},o); if(o.secs){ TM.total=o.secs; TM.end=Date.now()+o.secs*1000; } drawTimer(); }
function stopTimer(){ TM=null; drawTimer(); }
function drawTimer(){
  const el=document.getElementById('timerBar'); if(!el) return;
  if(!TM){ el.hidden=true; document.body.classList.remove('has-timer'); return; }
  el.hidden=false; document.body.classList.add('has-timer');
  const left=TM.end?(TM.end-Date.now())/1000:null, lbl=TM.mode==='rest'?'Отдых':TM.mode==='work'?'Подход':'Секундомер';
  el.innerHTML=`<div class="tb-top"><span class="tl">${lbl}${TM.label?' · '+esc(TM.label):''}</span><span class="tb-time num" id="tbTime">${mmss(TM.end?Math.ceil(left):(Date.now()-TM.start)/1000)}</span></div>
    ${TM.end?`<div class="tb-bar"><i id="tbBar" style="width:${Math.max(0,Math.min(100,left/TM.total*100)).toFixed(1)}%"></i></div>`:''}
    <div class="tb-btns">${TM.end?'<button data-act="tAdj" data-d="-15">−15 с</button><button data-act="tAdj" data-d="15">+15 с</button>':''}<button data-act="tStop">${TM.mode==='rest'?'Пропустить':TM.mode==='work'?'Готово':'Стоп'}</button></div>`;
}
function timerDone(early){
  const T=TM; TM=null; if(!early) beep();
  if(T.mode==='work'&&S.trainActive){
    const it=S.trainActive.items[T.ei], s=it&&it.sets[T.si];
    if(s){ s.time=early?Math.round((Date.now()-T.start)/1000):(numOr(s.time,0)||T.total); s.done=true; persist('trainActive');
      if(numOr(it.rest,0)>0) startTimer({mode:'rest',secs:numOr(it.rest,60),label:exName(it)}); }
    render(); return;
  }
  drawTimer();
  if(T.mode==='rest'&&!early) toast('Отдых окончен — следующий подход');
}
function tick(){
  if(S&&S.trainActive) document.querySelectorAll('[data-tick="elapsed"]').forEach(e=>{ e.textContent=mmss((Date.now()-S.trainActive.startTs)/1000); });
  if(!TM) return;
  const t=document.getElementById('tbTime'), b=document.getElementById('tbBar');
  if(TM.end){ const left=(TM.end-Date.now())/1000; if(left<=0){ timerDone(false); return; } if(t) t.textContent=mmss(Math.ceil(left)); if(b) b.style.width=Math.max(0,left/TM.total*100).toFixed(1)+'%'; }
  else if(t) t.textContent=mmss((Date.now()-TM.start)/1000);
}
setInterval(tick,250);

/* ---------- графики (SVG, одна ось, подсказка по касанию) ---------- */
function niceStep(range){ const raw=range/4, p=Math.pow(10,Math.floor(Math.log10(raw||1))), n=raw/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function drawChart(el){
  const sp=CH[el.dataset.chart]; if(!sp) return;
  const vals=sp.vals, n=vals.length, W=Math.max(260,el.clientWidth), H=el.clientHeight||190, L=sp.pct?40:46, Rp=6, Tp=10, Bp=24;
  const fv=sp.fv||(sp.pct?(v=>Math.round(v*100)+'%'):compact);
  const ftip0=sp.ftip||(sp.pct?(v=>pct(v)):(v=>rub(v))), ftip=v=>v==null?'не было по плану':ftip0(v);
  let lo,hi,st;
  if(sp.pct){ lo=0; hi=1; st=.25; }
  else { const nums=vals.concat(sp.vals2||[]).filter(v=>v!=null);
    if(sp.fit){ lo=Math.min(...nums); hi=Math.max(...nums); const pad=Math.max((hi-lo)*0.15,Math.abs(hi)*0.01,0.5); lo-=pad; hi+=pad; }
    else { lo=Math.min(0,...nums); hi=Math.max(0,...nums); }
    if(lo===hi) hi=lo+1; st=niceStep(hi-lo); lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st; }
  const base=sp.fit?lo:0;
  const y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-Bp), band=(W-L-Rp)/n, cx=j=>L+band*(j+.5);
  let g='';
  for(let v=lo; v<=hi+st/2; v+=st) g+=`<line class="${Math.abs(v)<st/1e6?'zero':'grid'}" x1="${L}" x2="${W-Rp}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${fv(v)}</text>`;
  const every=band<26?(band<14?4:2):1;
  sp.axis.forEach((a,j)=>{ if(a&&(sp.pct||sp.sparse||j%every===0)) g+=`<text class="ax" x="${cx(j)}" y="${H-6}" text-anchor="middle">${a}</text>`; });
  let marks='';
  if(sp.kind==='bar'){
    const bw=Math.max(3,Math.min(26,band-2)), r=Math.min(4,bw/2);
    vals.forEach((v,j)=>{ if(v==null) return; const x=cx(j)-bw/2, y0=y(0), y1=y(v), h=Math.abs(y1-y0); if(h<.5) return;
      const rr=Math.min(r,h), up=v>=0;
      const d=up?`M${x},${y0}V${y1+rr}Q${x},${y1} ${x+rr},${y1}H${x+bw-rr}Q${x+bw},${y1} ${x+bw},${y1+rr}V${y0}Z`
               :`M${x},${y0}V${y1-rr}Q${x},${y1} ${x+rr},${y1}H${x+bw-rr}Q${x+bw},${y1} ${x+bw},${y1-rr}V${y0}Z`;
      marks+=`<path data-j="${j}" d="${d}" fill="var(${sp.colors&&sp.colors[j]?sp.colors[j]:sp.signed&&!up?'--neg-bar':'--pos-bar'})"/>`; });
  } else {
    const pts=vals.map((v,j)=>cx(j)+','+y(v)).join(' ');
    marks=`<polygon points="${cx(0)},${y(base)} ${pts} ${cx(n-1)},${y(base)}" fill="var(--series)" opacity=".10"/><polyline points="${pts}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round"/>
      <line class="xh" x1="0" x2="0" y1="${Tp}" y2="${H-Bp}" stroke="var(--muted)" stroke-width="1" opacity="0"/><circle class="xd" r="4.5" cx="0" cy="0" fill="var(--series)" stroke="var(--surface)" stroke-width="2" opacity="0"/>`;
    if(sp.vals2) marks+=`<polyline points="${sp.vals2.map((v,j)=>cx(j)+','+y(v)).join(' ')}" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linejoin="round"/><circle class="xd2" r="4.5" cx="0" cy="0" fill="var(--t3)" stroke="var(--surface)" stroke-width="2" opacity="0"/>`;
  }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">${g}${marks}</svg><div class="tip"></div>`;
  const svg=el.firstChild, tip=el.lastChild;
  const hide=()=>{ tip.classList.remove('on'); svg.querySelectorAll('path[data-j]').forEach(p=>p.style.opacity=1); const xh=svg.querySelector('.xh'); if(xh){ xh.setAttribute('opacity',0); svg.querySelector('.xd').setAttribute('opacity',0); const d2=svg.querySelector('.xd2'); if(d2) d2.setAttribute('opacity',0); } };
  const show=e=>{ const rc=svg.getBoundingClientRect(), px=(e.clientX-rc.left)*W/rc.width;
    if(px<L-10){ hide(); return; }
    const j=Math.max(0,Math.min(n-1,Math.floor((px-L)/band)));
    tip.innerHTML=sp.vals2?`${sp.tips[j]}<br>${sp.name1}: <b>${ftip(vals[j])}</b><br>${sp.name2}: <b>${ftip(sp.vals2[j])}</b><br>всего: <b>${ftip((vals[j]||0)+(sp.vals2[j]||0))}</b>`:`${sp.tips[j]}: <b>${ftip(vals[j])}</b>`; tip.classList.add('on');
    tip.style.left=Math.max(80,Math.min(rc.width-80,cx(j)*rc.width/W))+'px'; tip.style.top=(Math.min(y(vals[j]??base),y(base))*rc.height/H-6)+'px';
    if(sp.kind==='bar') svg.querySelectorAll('path[data-j]').forEach(p=>p.style.opacity=(+p.dataset.j===j)?1:.45);
    else { const xh=svg.querySelector('.xh'), xd=svg.querySelector('.xd'); xh.setAttribute('x1',cx(j)); xh.setAttribute('x2',cx(j)); xh.setAttribute('opacity',.6); xd.setAttribute('cx',cx(j)); xd.setAttribute('cy',y(vals[j])); xd.setAttribute('opacity',1);
      const d2=svg.querySelector('.xd2'); if(d2&&sp.vals2){ d2.setAttribute('cx',cx(j)); d2.setAttribute('cy',y(sp.vals2[j])); d2.setAttribute('opacity',1); } } };
  svg.addEventListener('pointermove',show); svg.addEventListener('pointerdown',show); svg.addEventListener('pointerleave',hide);
}

let edit=null;
function openSheet(html){ const s=document.getElementById('sheet'); s.innerHTML=html; s.hidden=false; document.getElementById('sheetBg').hidden=false; }
function closeSheet(){ document.getElementById('sheet').hidden=true; document.getElementById('sheetBg').hidden=true; edit=null; }
function openEditor(kind,i,preset){
  const F=FORMS[kind], rec=i==null?Object.assign(F.blank(),preset||{}):F.list()[i]; edit={kind,i};
  const fld=([k,l,t,opts,fl])=>{ const v=rec[k]??'';
    if(fl&&fl.newOnly&&i!=null) return '';
    if(fl&&fl.only&&!fl.only(rec)) return '';
    if(typeof opts==='function') opts=opts();
    if(t==='cperiod') return `<div class="field"><label>${l}</label><select name="${k}">${CPERIODS.map(([val,lab])=>`<option value="${val}" ${val===Math.round(numOr(v,0))?'selected':''}>${lab}</option>`).join('')}</select></div>`;
    if(t==='select') return `<div class="field"><label>${l}</label><select name="${k}">${opts.map(([val,lab])=>`<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`).join('')}</select></div>`;
    if(t==='period'){ const p=Math.round(numOr(v,0)), list=PERIODS.some(x=>x[0]===p)?PERIODS:PERIODS.concat([[p,'Раз в '+p+' мес.']]);
      return `<div class="field"><label>${l}</label><select name="${k}">${list.map(([val,lab])=>`<option value="${val}" ${val===p?'selected':''}>${lab}</option>`).join('')}</select></div>`; }
    if(t==='check') return `<label class="chk"><input type="checkbox" name="${k}" ${v?'checked':''}><span>${l}</span></label>`;
    if(t==='emoji') return `<div class="field"><label>${l}</label><div class="emojis">${['',...opts].map(x=>`<label class="emo"><input type="radio" name="${k}" value="${esc(x)}" ${x===v?'checked':''}><span${x?'':' class="none"'}>${x?esc(x):'нет'}</span></label>`).join('')}</div></div>`;
    const ph=fl&&fl.ph?` placeholder="${esc(fl.ph)}"`:'';
    if(t==='textarea') return `<div class="field"><label>${l}</label><textarea name="${k}"${ph}>${esc(v)}</textarea></div>`;
    if(t==='days') return `<div class="field"><label>${l}</label><div class="days">${WD.map((w,d)=>`<label class="dchip"><input type="checkbox" name="${k}_${d}" ${String(v)[d]==='1'?'checked':''}><span>${w}</span></label>`).join('')}</div></div>`;
    return `<div class="field"><label>${l}</label><input name="${k}" ${t==='date'?'type="date"':t==='num'?'class="num" inputmode="decimal"':''}${ph} value="${esc(v)}"></div>`; };
  openSheet(`<h2>${i==null?'Новая запись: ':''}${F.title}</h2><form class="form" id="edForm" onsubmit="return false">${F.fields.map(fld).join('')}</form>
    ${F.note?`<p class="hint" style="margin-top:10px">${F.note}</p>`:''}
    <div class="actions">${i!=null?'<button class="btn danger" data-act="edDelete">Удалить</button>':''}<span class="sp"></span><button class="btn" data-act="sheetClose">Отмена</button><button class="btn primary" data-act="edSave">Сохранить</button></div>`);
  const first=document.querySelector('#edForm [name=name]'); if(first&&i==null) setTimeout(()=>first.focus(),50);
}
function saveEditor(){
  const F=FORMS[edit.kind], list=F.list(), form=document.getElementById('edForm');
  const fEl=n=>form.querySelector(`[name="${n}"]`);
  const vals={};
  for(const [k,l,t,,fl] of F.fields){
    if(fl&&fl.newOnly&&edit.i!=null) continue;
    if(t!=='days'&&!fEl(k)) continue;
    if(t==='check'){ vals[k]=fEl(k).checked; continue; }
    if(t==='emoji'){ const c=form.querySelector(`[name="${k}"]:checked`); vals[k]=c?c.value:''; continue; }
    if(t==='days'){ vals[k]=WD.map((_,d)=>fEl(k+'_'+d).checked?'1':'0').join(''); if(!vals[k].includes('1')){ toast('Выберите хотя бы один день'); return; } continue; }
    let v=fEl(k).value.trim();
    if(t==='num'||t==='period'||t==='cperiod'){ v=v===''?null:(t==='num'?evalExpr(v):+v); if(v!=null&&isNaN(v)){ toast('Поле «'+l+'» — нужно число'); return; } }
    vals[k]=v;
  }
  if(!F.noName&&!vals.name){ toast('Укажите название'); return; }
  if(F.check){ const msg=F.check(vals); if(msg){ toast(msg); return; } }
  if(edit.kind==='item'&&!vals.start){ toast('Без даты старта статья не попадёт в расчёт'); return; }
  if(edit.kind==='invPos'&&!vals.group){ toast('Сначала создайте группу на вкладке «Инвестиции»'); return; }
  if(edit.kind==='invPos'&&vals.start&&vals.end&&vals.end<vals.start){ toast('Дата закрытия раньше даты открытия'); return; }
  const initial=vals.initial; delete vals.initial;
  const rec=edit.i==null?F.blank():list[edit.i];
  Object.assign(rec,vals);
  if(edit.i==null) list.push(rec);
  if(edit.kind==='invPos'&&edit.i==null&&initial) S.invContribs.push({id:uid(),pos:rec.id,date:rec.start||dkey(TODAY()),amount:initial,note:'первое внесение'});
  const isNew=edit.i==null;
  if(F.after) F.after(rec,isNew);
  closeSheet(); persist(...F.keys); render();
}
function deleteEditor(){
  const F=FORMS[edit.kind], list=F.list(), rec=list[edit.i];
  if(!confirm(F.deleteText?F.deleteText(rec):'Удалить «'+(rec.name||'запись')+'»?')) return;
  const tr=trashed(F.keys.concat(F.extraKeys||[]),rec.name||F.title,F.title,()=>{ if(F.onDelete) F.onDelete(rec); const idx=F.list().indexOf(rec); if(idx>=0) F.list().splice(idx,1); });
  closeSheet(); persist(...F.keys,...(F.extraKeys||[])); render(); if(tr) toast('Удалено — можно вернуть из корзины');
}

let drag=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-drag]'); if(!h||!S) return;
  e.preventDefault();
  const row=h.closest('.drow'), r=row.getBoundingClientRect();
  const ghost=row.cloneNode(true); ghost.className='drow ghost'; Object.assign(ghost.style,{width:r.width+'px',left:r.left+'px',top:r.top+'px'});
  document.body.appendChild(ghost); row.classList.add('dragging'); document.body.classList.add('is-dragging');
  drag={row,ghost,dy:e.clientY-r.top,x:e.clientX,y:e.clientY,from:row.closest('[data-group]').dataset.group};
  try{ h.setPointerCapture(e.pointerId); }catch(err){}
  drag.timer=setInterval(()=>{ if(!drag) return; const H=innerHeight; if(drag.y<120) scrollBy(0,-12); else if(drag.y>H-140) scrollBy(0,12); else return; dragMove(); },16);
});
document.addEventListener('pointermove',e=>{ if(!drag) return; drag.x=e.clientX; drag.y=e.clientY; dragMove(); });
function dragMove(){
  drag.ghost.style.top=(drag.y-drag.dy)+'px';
  const el=document.elementFromPoint(drag.x,drag.y), grp=el&&el.closest('[data-group]');
  $view.querySelectorAll('[data-group]').forEach(g=>g.classList.toggle('drop-on',g===grp));
  if(!grp) return;
  const box=grp.querySelector('.drows'), rows=[...box.querySelectorAll('.drow:not(.dragging)')];
  const before=rows.find(r=>{ const b=r.getBoundingClientRect(); return drag.y<b.top+b.height/2; });
  if(before){ if(before.previousElementSibling!==drag.row) box.insertBefore(drag.row,before); }
  else if(box.lastElementChild!==drag.row) box.appendChild(drag.row);
}
function dragEnd(){
  if(!drag) return;
  clearInterval(drag.timer); drag.ghost.remove(); drag.row.classList.remove('dragging'); document.body.classList.remove('is-dragging');
  const to=drag.row.closest('[data-group]').dataset.group, from=drag.from;
  const order=[]; $view.querySelectorAll('[data-group]').forEach(g=>g.querySelectorAll('.drow').forEach(r=>order.push([r.dataset.id,g.dataset.group])));
  const byId=new Map(S.items.map(i=>[i.id,i])), next=[];
  order.forEach(([id,t])=>{ const it=byId.get(id); if(!it) return; it.type=t; next.push(it); byId.delete(id); });
  byId.forEach(it=>next.push(it));
  const changed=next.some((it,k)=>it!==S.items[k])||to!==from;
  drag=null;
  if(changed){ S.items=next; persist('items'); if(to!==from) toast('Перенесено в «'+TYPE_PLURAL[to]+'»'); }
  render();
}

/* ---------- корзина: удалённое лежит 30 дней, оттуда можно вернуть ---------- */
// снимок разделов до удаления → после удаления в корзину попадает всё, что из них исчезло (запись и её отметки, факт и т.п.)
const trashSnap=keys=>[...new Set(keys)].filter(k=>Array.isArray(S[k])).map(k=>[k,S[k].slice()]);
function trashPut(snap,name,kind,main){
  const data={};
  snap.forEach(([k,arr])=>{ const now=new Set(S[k]), gone=arr.filter(x=>!now.has(x)); if(gone.length) data[k]=clone(gone); });
  const ks=Object.keys(data); if(!ks.length) return null;
  // ячейка таблицы — до 50 000 знаков: если не влезает, кладём только саму запись
  const fit=d=>JSON.stringify(d).length<45000;
  let d=data; if(!fit(d)){ main=main||ks[0]; d=data[main]?{[main]:data[main]}:null; if(!d||!fit(d)) return null; }
  const e={id:uid(),kind:kind||'Запись',name:String(name||'запись').slice(0,200),deleted:todayK(),data:d};
  S.trash.unshift(e); persist('trash'); return e;
}
// удалить с корзиной: fn делает само удаление
function trashed(keys,name,kind,fn){ const snap=trashSnap(keys); fn(); return trashPut(snap,name,kind,keys[0]); }
function trashRestore(id){
  const i=S.trash.findIndex(x=>x.id===id); if(i<0) return; const e=S.trash[i], keys=[];
  Object.entries(e.data||{}).forEach(([k,arr])=>{ if(!Array.isArray(S[k])||!Array.isArray(arr)) return; keys.push(k);
    const ids=new Set(S[k].map(x=>x&&x.id).filter(Boolean)), js=new Set(S[k].filter(x=>x&&!x.id).map(x=>JSON.stringify(x)));
    arr.forEach(x=>{ if(!x||typeof x!=='object') return;
      if(x.id?ids.has(x.id):js.has(JSON.stringify(x))) return;
      // проект или раздел заметок могли удалить — тогда запись возвращается без него
      if(k==='tasks'&&x.project&&!projById(x.project)) x.project='';
      if(k==='notes'&&x.folder&&!S.noteFolders.some(f=>f.id===x.folder)) x.folder='';
      S[k].push(x); }); });
  S.trash.splice(i,1); persist(...keys,'trash'); render(); toast('Возвращено: '+e.name);
}

const DEL_KINDS={taskOpen:'task',goalOpen:'goal',payOpen:'payment',bookOpen:'book',movieOpen:'movie',habit:'habit',posOpen:'invPos',invOpen:'invGroup',wishOpen:'invWish',nfOpen:'noteFolder',bdOpen:'gift'};

let sw=null, swOpen=null, swBlock=false;
function swClose(){ const o=swOpen; swOpen=null; if(!o) return; o.row.style.transform='';
  setTimeout(()=>{ if(o.wrap.isConnected&&o.row.parentElement===o.wrap&&!(swOpen&&swOpen.row===o.row)){ o.row.classList.remove('sw-row'); o.wrap.replaceWith(o.row); } },220); }
document.addEventListener('pointerdown',e=>{
  if(!S||e.pointerType==='mouse'||!e.target.closest) return;
  if(swOpen&&!swOpen.wrap.contains(e.target)) swClose();
  if(e.target.closest('input,textarea,select,[contenteditable="true"],[data-drag],[data-tdrag],.sw-bin,.hgrid,.tcal,.pcal,.cal,.sheet')) return;
  const d=delTarget(e.target); if(!d) return;
  sw={x:e.clientX,y:e.clientY,id:e.pointerId,row:d.row,sp:d.sp,on:false,dx:0,base:swOpen&&swOpen.row===d.row?-76:0};
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!sw||e.pointerId!==sw.id) return; const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(!sw.on){ if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){ sw=null; return; }
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4&&(dx<0||sw.base)){ sw.on=true; swStart(); } else return; }
  sw.dx=Math.max(-120,Math.min(0,sw.base+dx)); sw.row.style.transform='translateX('+sw.dx+'px)';
},{passive:true});
function swStart(){
  if(swOpen&&swOpen.row!==sw.row) swClose();
  let wrap=sw.row.parentElement;
  if(!wrap.classList.contains('sw-wrap')){ wrap=document.createElement('div'); wrap.className='sw-wrap'; sw.row.before(wrap);
    const bin=document.createElement('button'); bin.type='button'; bin.className='sw-bin'; bin.setAttribute('aria-label','Удалить: '+sw.sp.name); bin.innerHTML='<span aria-hidden="true">🗑</span><small>Удалить</small>';
    wrap.append(bin,sw.row); }
  sw.wrap=wrap; sw.row.classList.add('sw-row'); sw.row.style.transition='none';
}
function swEnd(){
  const s=sw; sw=null; if(!s||!s.on) return; swBlock=true; setTimeout(()=>{ swBlock=false; },400);
  s.row.style.transition=''; const o={wrap:s.wrap,row:s.row,sp:s.sp};
  if(s.dx<-44){ s.row.style.transform='translateX(-76px)'; swOpen=o; } else { swOpen=o; swClose(); }
}
document.addEventListener('pointerup',swEnd); document.addEventListener('pointercancel',swEnd);
// клик после свайпа строку не открывает; клик по корзине — удаляет
document.addEventListener('click',e=>{
  const bin=e.target.closest&&e.target.closest('.sw-bin');
  if(bin&&swOpen){ e.stopPropagation(); e.preventDefault(); const sp=swOpen.sp; swOpen=null; delRecord(sp); return; }
  if(swBlock){ e.stopPropagation(); e.preventDefault(); swBlock=false; return; }
  if(swOpen&&swOpen.wrap.contains(e.target)){ e.stopPropagation(); e.preventDefault(); swClose(); }
},true);

function caretRect(el){
  if(el.isContentEditable){ const sl=document.getSelection&&document.getSelection(); if(sl&&sl.rangeCount){ const r=sl.getRangeAt(0).cloneRange(); r.collapse(false);
    let rc=r.getClientRects&&r.getClientRects()[0]; if(!rc||!rc.height){ const n=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement; rc=n&&n.getBoundingClientRect(); } if(rc) return rc; } }
  const rc=el.getBoundingClientRect();
  if(el.tagName==='TEXTAREA'&&el.selectionStart!=null){ const cs=getComputedStyle(el), lh=parseFloat(cs.lineHeight)||22, fs=parseFloat(cs.fontSize)||16;
    const cols=Math.max(8,Math.floor(el.clientWidth/(fs*0.52))), lines=el.value.slice(0,el.selectionStart).split('\n').reduce((s,l)=>s+Math.max(1,Math.ceil(l.length/cols)),0);
    const y=rc.top+(parseFloat(cs.paddingTop)||0)+lines*lh-el.scrollTop; return {top:Math.max(rc.top,y-lh),bottom:Math.min(rc.bottom,y+6)}; }
  return rc;
}
function visBottom(){
  const vv=window.visualViewport, kb=vv&&vv.height<window.innerHeight*0.8; let b=vv?vv.offsetTop+vv.height:window.innerHeight;
  [kb?null:document.getElementById('bottom'),...document.querySelectorAll('.sticky-ok')].forEach(e=>{ if(!e) return; const r=e.getBoundingClientRect(); if(r.height&&r.top<b&&r.top>window.innerHeight*0.35) b=r.top; });
  return b;
}
function keepCaret(){
  const el=document.activeElement; if(!el||!(/^(INPUT|TEXTAREA)$/.test(el.tagName)||el.isContentEditable)||el.closest('#sheet')) return;
  if(el.tagName==='INPUT'&&/^(checkbox|radio|button|range)$/.test(el.type)) return;
  const r=caretRect(el); if(!r) return; const lim=visBottom()-14;
  if(r.bottom>lim) window.scrollBy(0,Math.ceil(r.bottom-lim));
}

  else if(a==='noteNew'){ const n={id:uid(),name:'',body:'',pinned:false,updated:new Date().toISOString(),folder:folderById(UI.noteFolder)?UI.noteFolder:'',book:''}; S.notes.push(n); persist('notes'); UI.page={kind:'note',id:n.id,isNew:true}; go(); const t=$view.querySelector('.note-title'); if(t) t.focus(); }
  else if(a==='noteSave'){ const n=UI.page&&S.notes.find(x=>x.id===UI.page.id), wasNew=UI.page&&UI.page.isNew; const empty=n&&noteEmpty(n);
    if(wasNew&&empty){ toast('Заметка пустая — напишите что-нибудь или нажмите «Отмена»'); return; }
    dropEmptyNote(); UI.page=null; go(); if(wasNew) toast('Заметка сохранена'); }
  else if(a==='noteCancel'){ const i=S.notes.findIndex(x=>x.id===b.dataset.id); if(i>=0){ const n=S.notes[i]; if((String(n.name||'').trim()||noteText(n.body).trim())&&!confirm('Не сохранять новую заметку?')) return; S.notes.splice(i,1); persist('notes'); } UI.page=null; go(); }
  else if(a==='noteOpen'){ UI.page={kind:'note',id:b.dataset.id}; go(); }
  else if(a==='nfOpen'){ UI.noteFolder=b.dataset.id; UI.noteQ=''; go(); }
  else if(a==='nfBack'){ UI.noteFolder=null; UI.noteQ=''; go(); }
  else if(a==='quoteAdd'){ const bk=S.books.find(x=>x.id===b.dataset.id), ta=document.getElementById('qText'), txt=(ta&&ta.value||'').trim(); if(!bk) return; if(!txt){ if(ta) ta.focus(); toast('Впишите цитату'); return; }
    const pg=(document.getElementById('qPage')||{}).value, n=bookQuoteNote(bk,true), src=[String(pg||'').trim()?'стр. '+String(pg).trim():'',dRu(todayK())].filter(Boolean).join(' · ');
    n.body=String(n.body||'')+`<blockquote>${esc(txt).replace(/\n/g,'<br>')}<div class="qsrc">${esc(src)}</div></blockquote>`; n.updated=new Date().toISOString();
    persist('notes','noteFolders'); render(); toast('Цитата сохранена — Заметки → Книги'); }
  else if(a==='quoteDel'){ const bk=S.books.find(x=>x.id===b.dataset.id), n=bk&&bookQuoteNote(bk,false); if(!n) return; if(!confirm('Удалить цитату?')) return;
    let c=-1; const k=+b.dataset.k; n.body=String(n.body).replace(/<blockquote[^>]*>[\s\S]*?<\/blockquote>/gi,m=>(++c===k)?'':m); n.updated=new Date().toISOString(); persist('notes'); render(); }
  else if(a==='quoteNote'){ const bk=S.books.find(x=>x.id===b.dataset.id), n=bk&&bookQuoteNote(bk,false); if(!n) return; UI.section='notes'; UI.noteFolder=n.folder||null; UI.page={kind:'note',id:n.id}; saveUI(); go(); }
  else if(a==='recipeNew'){ const r={id:uid(),name:'',servings:'',kcal:null,ingredients:'',steps:'',url:'',planned:false,task:'',created:todayK()}; S.recipes.push(r); UI.page={kind:'recipe',id:r.id,isNew:true}; go();
    setTimeout(()=>{ const i=$view.querySelector('[data-rec$="|name"]'); if(i) i.focus(); },60); }
  else if(a==='recipeOpen'){ UI.page={kind:'recipe',id:b.dataset.id}; go(); }
  else if(a==='recipeImport') openRecipeImport();
  else if(a==='recipeFetch') recipeFetch();
  else if(a==='recipeParseText'){ const o=recipeFromText((document.getElementById('recPaste')||{}).value); if(!o||!o.ingredients.length){ toast('Не нашёл продуктов — по одному на строке: «Свёкла — 2 шт.»'); return; } createRecipe(o); }
  else if(a==='recipeSave'){ const r=UI.page&&S.recipes.find(x=>x.id===UI.page.id); if(!r) return; if(!r.name.trim()){ toast('Назовите блюдо'); const i=$view.querySelector('[data-rec$="|name"]'); if(i) i.focus(); return; }
    if(r.planned) planRecipe(r); persist('recipes'); UI.page=null; UI.sub.food='recipes'; go(); }
  else if(a==='recipeCancel'){ const r=S.recipes.find(x=>x.id===b.dataset.id); if(r&&UI.page&&UI.page.isNew){ S.recipes=S.recipes.filter(x=>x!==r); persist('recipes'); } UI.page=null; go(); }
  else if(a==='recipeDel'){ const r=S.recipes.find(x=>x.id===b.dataset.id); if(!r||!confirm('Удалить рецепт «'+(r.name||'без названия')+'»?')) return;
    trashed(['recipes','tasks'],r.name||'рецепт','Рецепт',()=>{ if(r.planned) unplanRecipe(r,false); S.recipes=S.recipes.filter(x=>x!==r); }); persist('recipes'); UI.page=null; go(); }
  else if(a==='recipePlan'){ const r=S.recipes.find(x=>x.id===b.dataset.id); if(r&&planRecipe(r)){ render(); const m=recMissing(r).length; toast(m?'В плане. Купить '+m+' '+plural(m,'продукт','продукта','продуктов')+' — Задачи → «Список покупок»':'В плане. Все продукты есть дома'); } }
  else if(a==='recipeUnplan'){ const r=S.recipes.find(x=>x.id===b.dataset.id); if(r){ unplanRecipe(r,false); render(); toast('Убрано из плана, список покупок для блюда удалён'); } }
  else if(a==='recipeCooked'){ const r=S.recipes.find(x=>x.id===b.dataset.id); if(r){ const was=clone(S.pantry), c=consumeRecipe(r); if(r.planned) unplanRecipe(r,true); else syncShop(); render();
    toast('Приятного аппетита!'+(c.used.length?' Списано из наличия: '+c.used.length+(c.gone.length?', закончилось: '+c.gone.slice(0,3).join(', ')+(c.gone.length>3?'…':''):''):''),c.used.length?{label:'Вернуть продукты',fn:()=>{ S.pantry=was; persist('pantry'); syncShop(); render(); }}:undefined); } }
  else if(a==='prodAdd'){ const have=b.dataset.have==='1', inp=document.getElementById(have?'pHave':'pNeed'), items=(inp&&inp.value||'').split(/[,;\n]/).map(parseIng).filter(Boolean);
    if(!items.length){ if(inp) inp.focus(); return; }
    items.forEach(gi=>{ let x=prodBy(gi.name); if(!x){ x={id:uid(),name:gi.name,have,qty:''}; S.pantry.push(x); } x.have=have; if(gi.qty) x.qty=gi.qty; });
    syncShop(); persist('pantry'); render(); const n=document.getElementById(have?'pHave':'pNeed'); if(n) n.focus(); }
  else if(a==='prodMove'){ const x=S.pantry.find(y=>y.id===b.dataset.id); if(!x) return; if(x.have) x.have=false; else stockUp(x); syncShop(); persist('pantry'); render(); }
  else if(a==='prodBuy'){ const x=S.pantry.find(y=>y.id===b.dataset.id); if(!x) return; stockUp(x); syncShop(); persist('pantry'); render(); toast(x.name+': теперь дома '+x.qty); }
  else if(a==='prodDel'){ const x=S.pantry.find(y=>y.id===b.dataset.id); if(!x) return; S.pantry=S.pantry.filter(y=>y!==x); persist('pantry'); syncShop(); render(); }
  else if(a==='bdOpen'){ UI.page={kind:'bday',id:b.dataset.id}; go(); }
  else if(a==='ideaAdd'){ const gg=S.gifts.find(x=>x.id===b.dataset.id), inp=document.getElementById('ideaNew'), txt=(inp&&inp.value||'').trim(); if(!gg) return; if(!txt){ if(inp) inp.focus(); return; }
    (gg.ideas||(gg.ideas=[])).push({id:uid(),text:txt,done:false,doneAt:''}); persist('gifts'); render(); const n=document.getElementById('ideaNew'); if(n) n.focus(); }
  else if(a==='ideaToggle'){ const gg=S.gifts.find(x=>x.id===b.dataset.id), it=gg&&gg.ideas[+b.dataset.j]; if(!it) return; it.done=!it.done; it.doneAt=it.done?todayK():''; persist('gifts'); render(); }
  else if(a==='ideaDel'){ const gg=S.gifts.find(x=>x.id===b.dataset.id); if(!gg||!gg.ideas[+b.dataset.j]) return; gg.ideas.splice(+b.dataset.j,1); persist('gifts'); render(); }
  else if(a==='notePin'){ const n=S.notes.find(x=>x.id===b.dataset.id); if(!n) return; n.pinned=!n.pinned; persist('notes'); render(); }
  else if(a==='noteDel'){ const i=S.notes.findIndex(x=>x.id===b.dataset.id); if(i<0) return; const n=S.notes[i], has=n.body||n.name; if(has&&!confirm('Удалить заметку?')) return; if(has&&!noteEmpty(n)) trashed(['notes'],n.name||firstLine(noteText(n.body))||'заметка','Заметка',()=>S.notes.splice(i,1)); else S.notes.splice(i,1); persist('notes'); UI.page=null; go(); }
  // тренировки
  else if(a==='wStart') startWorkout(b.dataset.id);
  else if(a==='wFinish') finishWorkout();
  else if(a==='wCancel'){ if(!confirm('Отменить тренировку? Введённые подходы не сохранятся.')) return; S.trainActive=null; stopTimer(); keepAwake(false); persist('trainActive'); render(); }
  else if(a==='wTimer'){ const ei=+b.dataset.ei, it=S.trainActive&&S.trainActive.items[ei]; startTimer({mode:'stop',label:it?exName(it):''}); }
  else if(a==='wMove'){ const ei=+b.dataset.ei, A=S.trainActive; if(ei>0){ [A.items[ei-1],A.items[ei]]=[A.items[ei],A.items[ei-1]]; persist('trainActive'); render(); } }
  else if(a==='wExDel'){ const ei=+b.dataset.ei, A=S.trainActive; if(A.items[ei].sets.some(s=>s.done)&&!confirm('Убрать упражнение вместе с отмеченными подходами?')) return; A.items.splice(ei,1); persist('trainActive'); render(); }
  else if(a==='setAdd'){ const it=S.trainActive.items[+b.dataset.ei], last=it.sets[it.sets.length-1]||{}; it.sets.push({reps:last.reps??null,weight:last.weight??null,time:last.time??null,done:false}); persist('trainActive'); render(); }
  else if(a==='setDel'){ const it=S.trainActive.items[+b.dataset.ei]; if(it.sets.length>1){ it.sets.pop(); persist('trainActive'); render(); } }
  else if(a==='setDone'){ const ei=+b.dataset.ei, si=+b.dataset.si, it=S.trainActive.items[ei], s=it.sets[si];
    if(!s.done){ const prev=lastWith(it.ex,S.trainActive.id,S.trainActive.routine), p=prev&&prev.it.sets[si];
      for(const f of ['reps','weight','time']) if((s[f]==null||s[f]==='')&&p&&p[f]!=null) s[f]=p[f];
      s.done=true; if(numOr(it.rest,0)>0) startTimer({mode:'rest',secs:numOr(it.rest,60),label:exName(it)}); }
    else s.done=false;
    persist('trainActive'); render(); }
  else if(a==='setTimer'){ const ei=+b.dataset.ei, si=+b.dataset.si, it=S.trainActive.items[ei], s=it.sets[si], prev=lastWith(it.ex,S.trainActive.id,S.trainActive.routine), p=prev&&prev.it.sets[si];
    const secs=numOr(s.time,0)||(p?numOr(p.time,0):0)||30; startTimer({mode:'work',secs,ei,si,label:exName(it)+', подход '+(si+1)}); }
  else if(a==='tAdj'){ if(TM&&TM.end){ const d=+b.dataset.d; TM.end+=d*1000; TM.total=Math.max(1,TM.total+d); if(TM.end<=Date.now()) TM.end=Date.now()+1000; drawTimer(); } }
  else if(a==='tStop'){ if(!TM) return; if(TM.mode==='work') timerDone(true); else { if(TM.mode==='stop') toast('Секундомер: '+mmss((Date.now()-TM.start)/1000)); stopTimer(); } }
  else if(a==='pick') openPicker(b.dataset.target);
  else if(a==='pickEx') addPicked(b.dataset.ex);
  else if(a==='exOpen'){ UI.page={kind:'exercise',id:b.dataset.id,back:UI.page&&UI.page.kind==='workout'?'Тренировка':(UI.sub.train==='home'?'Тренировка':'Упражнения')}; go(); }
  else if(a==='routineOpen'){ UI.page={kind:'routine',id:b.dataset.id}; go(); }
  else if(a==='routineNew'){ const r={id:uid(),name:'Новая программа',items:[]}; S.routines.push(r); persist('routines'); UI.page={kind:'routine',id:r.id,isNew:true}; go(); }
  else if(a==='routineSave'){ const r=UI.page&&S.routines.find(x=>x.id===UI.page.id); if(r&&!r.items.length&&UI.page.isNew){ toast('Добавьте хотя бы одно упражнение'); return; } const wasNew=UI.page&&UI.page.isNew; UI.page=null; go(); if(wasNew) toast('Программа сохранена'); }
  else if(a==='routineCancel'){ const i=S.routines.findIndex(x=>x.id===b.dataset.id); if(i>=0&&S.routines[i].items.length&&!confirm('Не сохранять новую программу?')) return; if(i>=0){ S.routines.splice(i,1); persist('routines'); } UI.page=null; go(); }
  else if(a==='routineDel'){ const i=S.routines.findIndex(x=>x.id===b.dataset.id); if(i<0||!confirm('Удалить программу «'+S.routines[i].name+'»?')) return; trashed(['routines'],S.routines[i].name,'Программа тренировок',()=>S.routines.splice(i,1)); persist('routines'); UI.page=null; go(); }
  else if(a==='rMove'||a==='rDel'){ const r=S.routines.find(x=>x.id===UI.page.id), k=+b.dataset.k; if(!r) return;
    if(a==='rDel') r.items.splice(k,1); else if(k>0) [r.items[k-1],r.items[k]]=[r.items[k],r.items[k-1]]; persist('routines'); render(); }
  else if(a==='workoutOpen'){ UI.page={kind:'workout',id:b.dataset.id}; go(); }
  else if(a==='wDel'){ const i=S.workouts.findIndex(x=>x.id===b.dataset.id); if(i<0||!confirm('Удалить тренировку из истории?')) return; const w=S.workouts[i]; trashed(['workouts'],(w.name||'Тренировка')+', '+dRu(w.date),'Тренировка',()=>S.workouts.splice(i,1)); persist('workouts'); UI.page=null; go(); }
  else if(a==='export'){ document.getElementById('jsonBox').value=JSON.stringify(S,null,1); }
  else if(a==='copy'){ const t=document.getElementById('jsonBox'); if(!t.value) t.value=JSON.stringify(S,null,1); t.select(); try{ navigator.clipboard.writeText(t.value).then(()=>toast('Скопировано'),()=>{ document.execCommand('copy'); toast('Скопировано'); }); }catch(err){ document.execCommand('copy'); toast('Скопировано'); } }
  else if(a==='import'){ let d; try{ d=JSON.parse(document.getElementById('jsonBox').value); }catch(err){ toast('Это не JSON'); return; }
    if(!d||!Array.isArray(d.items)){ toast('В копии нет списка статей'); return; }
    if(!confirm('Заменить все текущие данные копией?')) return; S=normalize(d)[0]; closeSheet(); persist(); render(); toast('Загружено'); }
  else if(a==='rcConnect'){ rcConnect(); }
  else if(a==='gsLogin'){ gsLogin(); }
  else if(a==='welcomeLogin'){ gsLogin(); }
  else if(a==='welcomeSkip'){ try{ localStorage.setItem(WELCOME_KEY,'1'); }catch(err){} hideWelcome(); }
  else if(a==='gsOpen'){ const u='https://docs.google.com/spreadsheets/d/'+REMOTE.sheet+'/edit'; if(NATIVE) NATIVE.openUrl(u); else window.open(u,'_blank','noopener'); }
  else if(a==='apkCheck'){ checkApk(true); }
  else if(a==='apkGet'){ if(APK_NEW) NATIVE.openUrl(APK_NEW.url); }
  else if(a==='rcPull'){ if(isDirty()){ flush(); toast('Сначала отправляю свои правки'); return; } closeSheet(); setSync('pending','Загружаю из таблицы…'); pullRemote().then(()=>toast('Обновлено')); }
  else if(a==='rcLink'){ const link=(NATIVE||!/^https:/.test(location.href)?SITE:location.origin+location.pathname)+'#connect='+btoa(REMOTE.url+'|'+REMOTE.key);
    try{ navigator.clipboard.writeText(link).then(()=>toast('Ссылка скопирована. В ней ключ — отправляйте только себе'),()=>prompt('Ссылка для другого устройства (в ней ключ):',link)); }catch(err){ prompt('Ссылка для другого устройства (в ней ключ):',link); } }
  else if(a==='rcOff'){ const g=!!(REMOTE&&REMOTE.g); if(!confirm(g?'Выйти из Google на этом устройстве? Данные останутся в вашей таблице, а здесь — их копия.':'Отключить Google Таблицу на этом устройстве? Данные останутся в таблице, а здесь — их копия.')) return;
    if(isDirty()&&!confirm('Часть правок ещё не дошла до таблицы и останется только здесь. Всё равно отключить?')) return;
    try{ localStorage.removeItem(RC_KEY); localStorage.removeItem(PEND_KEY); localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(err){}
    if(g) gsDropTok();
    REMOTE=null; dirtyAll=false; dirtyKeys.clear(); canSave=true; closeSheet(); setSync('ok','Данные из этого браузера'); toast(g?'Вы вышли из Google':'Таблица отключена'); nativeSync(); }
  else if(a==='reset'){ if(!confirm('Вернуть финансы к данным из Excel? Всё, что вводили здесь, пропадёт. Привычки останутся.')) return;
    const keep={}; for(const k of ['habits','habitLog','tasks','goals','goalSteps','books','movies','noteFolders','recipes','pantry','notes','foodLog','waterLog','weightLog','exercises','routines','workouts','trainActive','projects','payments','payLog','trash']) keep[k]=S[k];
    S=Object.assign(normalize(DEFAULT_DATA)[0],keep); closeSheet(); persist(); render(); toast('Данные из Excel восстановлены'); }
  else if(a==='theme'){ const v=b.dataset.v; if(v) document.documentElement.dataset.theme=v; else delete document.documentElement.dataset.theme; try{ localStorage.setItem('moyplan.theme',v); }catch(err){} openSettings(); }
});
try{ const t=localStorage.getItem('moyplan.theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}

boot();
if(!IS_GAS&&!NATIVE&&'serviceWorker' in navigator&&/^(https:|http:\/\/localhost)/.test(location.href)) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(NATIVE&&notifCfg().on) try{ NATIVE.askNotify(); }catch(e){}
if(NATIVE){ if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{}); setTimeout(()=>checkApk(),4000); }
</script>
